# PRODUCTION Workouts frontend.
# Host 80/443 are owned by the central reverse proxy (reverse-proxy repo,
# container: central-reverse-proxy). This container is reachable ONLY on
# workouts-network: central proxy --HTTPS--> workouts-frontend-runtime:443.
services:
  workouts-frontend-runtime:
    image: ${WORKOUTS_FRONTEND_IMAGE}
    container_name: workouts-frontend-runtime
    expose:
      - "80"
      - "443"
    ports:
      # Loopback-only diagnostics from the server itself (never public).
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18444:443"
    volumes:
      - ./nginx.runtime.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      workouts-network:
        ipv4_address: 172.21.0.3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      # Local TLS check: the default 443 server is workouts.hevexora.com.
      test: ["CMD-SHELL", "curl -fsk -o /dev/null https://127.0.0.1/ || wget -q -O /dev/null --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  workouts-network:
    external: true
