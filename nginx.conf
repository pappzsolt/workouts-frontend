server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ==========================================================
    # SECURITY HEADERS
    # ==========================================================
    # 'always': hibaválaszokra (4xx/5xx) is rákerülnek.
    # FONTOS: egy location blokkban megadott add_header felülírja
    # (nem örökli) a server szintű add_header sorokat, ezért ahol egy
    # location saját add_header-t használ, ott ezeket is meg kell ismételni.
    #
    # CSP: a scriptek csak saját originről jöhetnek (Angular AOT build,
    # nincs inline script, az angular.json-ban az inlineCritical ki van
    # kapcsolva). Stílusnál az 'unsafe-inline' az Angular komponens-
    # stílusok miatt kell. A fontok az alkalmazás saját /assets/fonts/ könyvtárából töltődnek.
    # A gyakorlatképek külső HTTPS-forrásból is jöhetnek, ezért img-src https:.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Hibabejelentés: legfeljebb 3 x 5 MB képernyőkép (a backend is ennyit enged).
    # Csak ezen az egy végponton nagyobb a kéréskorlát; minden más /api kérés marad 1 MB.
    location = /api/bug-reports {
        client_max_body_size 16m;

        proxy_pass http://192.168.1.37:8089;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://192.168.1.37:8089;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Az index.html-t a böngésző mindig ellenőrizze, így új verzió után azonnal
    # az új (új chunk-nevekre hivatkozó) fájlt kapja. Az 'expires' nem add_header,
    # ezért a server szintű biztonsági fejlécek itt is megmaradnak.
    location = /index.html {
        expires -1;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";

        # SECURITY HEADERS - ismétlés: a location saját add_header-je miatt
        # a server szintű fejlécek itt nem öröklődnének.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        # Hiányzó fájlra 404, nem index.html: különben a böngésző HTML-t kap JS helyett
        # („disallowed MIME type (text/html)”).
        try_files $uri =404;
    }
}
