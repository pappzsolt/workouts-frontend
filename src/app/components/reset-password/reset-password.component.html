<div class="w-full rounded-2xl border border-surface-200 bg-white p-6 shadow-lg sm:p-8">
  <div class="mb-6 flex justify-end">
    <app-language-selector></app-language-selector>
  </div>

  <div class="mb-8 text-center">
    <h2 appHeading="page">
      {{ 'resetPassword.title' | translate }}
    </h2>
    <p class="mt-2 text-sm text-content-500">
      {{ 'resetPassword.description' | translate }}
    </p>
  </div>

  <app-message
    *ngIf="errorMessage"
    [message]="errorMessage"
    type="error"
    class="block mb-4"
  ></app-message>

  <app-message
    *ngIf="successMessage"
    [message]="successMessage"
    type="success"
    class="block mb-4"
  ></app-message>

  <form *ngIf="!completed" [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
    <app-form-field labelKey="resetPassword.newPassword" controlId="reset-password-newPassword">
      <input
        appInput="admin"
        id="reset-password-newPassword"
        formControlName="newPassword"
        type="password"
        autocomplete="new-password"
        class="placeholder:text-content-400"
      />
    </app-form-field>

    <app-form-field
      labelKey="resetPassword.confirmPassword"
      controlId="reset-password-confirmPassword"
    >
      <input
        appInput="admin"
        id="reset-password-confirmPassword"
        formControlName="confirmPassword"
        type="password"
        autocomplete="new-password"
        class="placeholder:text-content-400"
      />
    </app-form-field>

    <app-button
      variant="primary"
      type="submit"
      [disabled]="loading || !token"
      [label]="
        loading ? ('resetPassword.saving' | translate) : ('resetPassword.submit' | translate)
      "
    ></app-button>

    <app-button type="button" (buttonClick)="backToLogin()" variant="secondary" appearance="link">
      {{ 'resetPassword.backToLogin' | translate }}
    </app-button>
  </form>

  <app-button
    *ngIf="completed"
    type="button"
    (buttonClick)="backToLogin()"
    variant="secondary"
    appearance="link"
    [fullWidth]="true"
    class="block w-full"
  >
    {{ 'resetPassword.login' | translate }}
  </app-button>
</div>
