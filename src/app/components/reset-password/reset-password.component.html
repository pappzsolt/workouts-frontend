<div
  class="w-full rounded-2xl border border-surface-200 bg-white p-6 shadow-lg sm:p-8"
>
  <div class="mb-6 flex justify-end">
    <app-language-selector></app-language-selector>
  </div>

  <div class="mb-8 text-center">
    <h2 class="text-2xl font-bold tracking-tight text-content-800 sm:text-3xl">
      {{ 'resetPassword.title' | translate }}
    </h2>
    <p class="mt-2 text-sm text-content-500">
      {{ 'resetPassword.description' | translate }}
    </p>
  </div>

  <app-message *ngIf="errorMessage" [message]="errorMessage" type="error" class="block mb-4"></app-message>

  <app-message *ngIf="successMessage" [message]="successMessage" type="success" class="block mb-4"></app-message>

  <form
    *ngIf="!completed"
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="flex flex-col gap-5"
  >
    <app-form-field
      labelKey="resetPassword.newPassword"
      controlId="reset-password-newPassword"
    >
      <input
        id="reset-password-newPassword"
        formControlName="newPassword"
        type="password"
        autocomplete="new-password"
        class="min-h-11 w-full rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
      />
    </app-form-field>

    <app-form-field
      labelKey="resetPassword.confirmPassword"
      controlId="reset-password-confirmPassword"
    >
      <input
        id="reset-password-confirmPassword"
        formControlName="confirmPassword"
        type="password"
        autocomplete="new-password"
        class="min-h-11 w-full rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
      />
    </app-form-field>

    <app-button
      variant="primary"
      type="submit"
      [disabled]="loading || !token"
      [label]="loading ? ('resetPassword.saving' | translate) : ('resetPassword.submit' | translate)"
    ></app-button>

    <button
      type="button"
      class="text-sm font-medium text-content-600 hover:text-primary-600 hover:underline"
      (click)="backToLogin()"
    >
      {{ 'resetPassword.backToLogin' | translate }}
    </button>
  </form>

  <button
    *ngIf="completed"
    type="button"
    class="w-full text-sm font-medium text-primary-600 hover:text-primary-700 hover:underline"
    (click)="backToLogin()"
  >
    {{ 'resetPassword.login' | translate }}
  </button>
</div>
