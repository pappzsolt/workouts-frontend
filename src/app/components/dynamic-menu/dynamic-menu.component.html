<nav class="w-full" [attr.aria-label]="'menu.navigation' | translate">
  <ul class="flex flex-col gap-1.5">
    <ng-container *ngFor="let item of menuItems; trackBy: trackByMenuItem">
      <li class="w-full">
        <!-- Normál link -->
        <a
          *ngIf="!item.children && !item.action"
          [routerLink]="item.path"
          routerLinkActive="bg-primary-50 text-primary-700"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          (click)="menuNavigate.emit()"
          class="menu-item"
        >
          @if (item.icon) {
            <app-icon [name]="item.icon" sizeClass="h-[18px] w-[18px]" />
          }
          {{ item.label | translate }}
        </a>

        <!-- Action (logout) -->
        <button *ngIf="item.action" type="button" class="menu-item" (click)="onAction(item)">
          @if (item.icon) {
            <app-icon [name]="item.icon" sizeClass="h-[18px] w-[18px]" />
          }
          {{ item.label | translate }}
        </button>

        <!-- Dropdown -->
        <ng-container *ngIf="item.children">
          <button type="button" class="menu-item" [attr.aria-expanded]="isOpen(item)" (click)="toggle(item)">
            @if (item.icon) {
              <app-icon [name]="item.icon" sizeClass="h-[18px] w-[18px]" />
            }
            <span class="flex-1">{{ item.label | translate }}</span>
            <app-icon [name]="isOpen(item) ? 'chevron-up' : 'chevron-down'" sizeClass="h-4 w-4" />
          </button>

          <!-- Dropdown submenu -->
          <ul
            *ngIf="isOpen(item)"
            class="mt-1 ml-3 flex flex-col gap-1 border-l-2 border-surface-200 pl-3"
          >
            <li *ngFor="let child of item.children; trackBy: trackByMenuItem">
              <a
                [routerLink]="child.path"
                routerLinkActive="bg-primary-50 text-primary-700"
                [routerLinkActiveOptions]="{ exact: true }"
                ariaCurrentWhenActive="page"
                (click)="menuNavigate.emit()"
                class="menu-item menu-item-child"
              >
                {{ child.label | translate }}
              </a>
            </li>
          </ul>
        </ng-container>
      </li>
    </ng-container>
  </ul>
</nav>
