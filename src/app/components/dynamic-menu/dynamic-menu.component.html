<nav class="w-full" [attr.aria-label]="'menu.navigation' | translate">
  <ul class="flex flex-col gap-1.5">
    <ng-container *ngFor="let item of menuItems; trackBy: trackByMenuItem">
      <li class="w-full">
        <!-- Normál link -->
        <a
          *ngIf="!item.children && !item.action"
          [routerLink]="item.path"
          routerLinkActive="bg-primary-50 text-primary-700"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          (click)="menuNavigate.emit()"
          class="flex w-full items-center rounded-xl px-4 py-3 text-sm font-medium text-content-700 transition-all duration-200 hover:bg-surface-100 hover:text-content-900 focus:outline-none focus:ring-2 focus:ring-surface-400/30"
        >
          {{ item.label | translate }}
        </a>

        <!-- Action (logout) -->
        <app-button
          type="button"
          *ngIf="item.action"
          (buttonClick)="onAction(item)"
          variant="secondary"
          appearance="ghost"
          [fullWidth]="true"
          align="start"
          class="block w-full"
        >
          {{ item.label | translate }}
        </app-button>

        <!-- Dropdown -->
        <ng-container *ngIf="item.children">
          <app-button
            type="button"
            [ariaExpanded]="isOpen(item)"
            (buttonClick)="toggle(item)"
            variant="secondary"
            appearance="ghost"
            [fullWidth]="true"
            align="start"
            class="block w-full"
          >
            {{ item.label | translate }}
          </app-button>

          <!-- Dropdown submenu -->
          <ul
            *ngIf="isOpen(item)"
            class="mt-1 ml-3 flex flex-col gap-1 border-l-2 border-surface-200 pl-3"
          >
            <li *ngFor="let child of item.children; trackBy: trackByMenuItem">
              <a
                [routerLink]="child.path"
                routerLinkActive="bg-primary-50 text-primary-700"
                [routerLinkActiveOptions]="{ exact: true }"
                ariaCurrentWhenActive="page"
                (click)="menuNavigate.emit()"
                class="flex w-full items-center rounded-lg px-3 py-2.5 text-sm text-content-600 transition-all duration-200 hover:bg-surface-100 hover:text-content-900"
              >
                {{ child.label | translate }}
              </a>
            </li>
          </ul>
        </ng-container>
      </li>
    </ng-container>
  </ul>
</nav>
