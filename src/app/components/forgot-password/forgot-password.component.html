<div
  class="w-full rounded-2xl border border-surface-200 bg-white p-6 shadow-lg sm:p-8"
>
  <div class="mb-6 flex justify-end">
    <app-language-selector></app-language-selector>
  </div>

  <div class="mb-8 text-center">
    <h2 class="text-2xl font-bold tracking-tight text-content-800 sm:text-3xl">
      {{ 'forgotPassword.title' | translate }}
    </h2>
    <p class="mt-2 text-sm text-content-500">
      {{ 'forgotPassword.description' | translate }}
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
    <div class="flex flex-col gap-2">
      <label class="text-sm font-semibold text-content-700">{{ 'forgotPassword.email' | translate }}</label>
      <input
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="{{ 'forgotPassword.emailPlaceholder' | translate }}"
        class="min-h-11 w-full rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
      />
    </div>

    <div
      *ngIf="errorMessage"
      class="rounded-xl border border-delete-200 bg-delete-50 px-4 py-3 text-sm font-medium text-delete-700"
    >
      {{ errorMessage | translate }}
    </div>

    <div
      *ngIf="successMessage"
      class="rounded-xl border border-green-200 bg-green-50 px-4 py-3 text-sm font-medium text-green-700"
    >
      {{ successMessage }}
    </div>

    <app-button
      variant="primary"
      type="submit"
      [disabled]="loading"
      [label]="loading ? ('forgotPassword.sending' | translate) : ('forgotPassword.submit' | translate)"
    ></app-button>

    <button
      type="button"
      class="text-sm font-medium text-content-600 hover:text-primary-600 hover:underline"
      (click)="backToLogin()"
    >
      {{ 'forgotPassword.backToLogin' | translate }}
    </button>
  </form>
</div>
