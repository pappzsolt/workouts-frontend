<div class="w-full rounded-2xl border border-surface-200 bg-white p-6 shadow-lg sm:p-8">
  <div class="mb-6 flex justify-end">
    <app-language-selector></app-language-selector>
  </div>

  <div class="mb-8 text-center">
    <h2 appHeading="page">
      {{ 'forgotPassword.title' | translate }}
    </h2>
    <p class="mt-2 text-sm text-content-500">
      {{ 'forgotPassword.description' | translate }}
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
    <app-form-field labelKey="forgotPassword.email" controlId="forgot-password-email">
      <input
        appInput="admin"
        id="forgot-password-email"
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="{{ 'forgotPassword.emailPlaceholder' | translate }}"
        class="placeholder:text-content-400"
      />
    </app-form-field>

    <app-message
      *ngIf="errorMessage"
      [message]="errorMessage"
      type="error"
      class="block mb-4"
    ></app-message>

    <app-message
      *ngIf="successMessage"
      [message]="successMessage"
      type="success"
      class="block mb-4"
    ></app-message>

    <app-button
      variant="primary"
      type="submit"
      [disabled]="loading"
      [label]="
        loading ? ('forgotPassword.sending' | translate) : ('forgotPassword.submit' | translate)
      "
    ></app-button>

    <app-button type="button" (buttonClick)="backToLogin()" variant="secondary" appearance="link">
      {{ 'forgotPassword.backToLogin' | translate }}
    </app-button>
  </form>
</div>
