<div
  class="min-h-screen min-w-0 bg-surface-50 px-4 py-6 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-6xl min-w-0 flex-col gap-6">

    <!-- Cím -->
    <div class="text-center">
      <h2
        class="break-words text-2xl font-bold tracking-tight text-content-800 sm:text-3xl"
      >
        {{ 'adminDashboard.title' | translate }}
      </h2>
    </div>

    <!-- Üzenet -->
    <app-message
      [message]="message"
      [type]="messageType"
    >
    </app-message>

    <!-- Dashboard kártyák -->
    <div class="grid min-w-0 grid-cols-1 gap-5 sm:grid-cols-2">

      <app-dashboard-action
        icon="👥"
        label="adminDashboard.usersList"
        (activated)="navigateTo('admin/users')"
      ></app-dashboard-action>

      <app-dashboard-action
        icon="🔍"
        label="adminDashboard.userSearch"
        (activated)="navigateTo('admin/users/search')"
      ></app-dashboard-action>

      <app-dashboard-action
        icon="➕"
        label="adminDashboard.newUser"
        (activated)="navigateTo('admin/choice-users/new')"
      ></app-dashboard-action>

      <app-dashboard-action
        icon="✏️"
        label="adminDashboard.editUser"
        (activated)="navigateTo('admin/choice-users/edit')"
      ></app-dashboard-action>

    </div>
  </div>
</div>
