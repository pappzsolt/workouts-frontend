<div class="min-h-full min-w-0 bg-transparent px-4 py-6 sm:px-6 lg:px-8">
  <div class="mx-auto flex w-full max-w-4xl min-w-0 flex-col gap-6">
    <!-- ============================= -->
    <!-- OLDAL CÍM -->
    <!-- ============================= -->

    <div class="text-center">
      <h2 appHeading="page" class="break-words">
        {{ 'adminCoachEdit.title' | translate }}
      </h2>
    </div>

    <!-- ============================= -->
    <!-- ÜZENET -->
    <!-- ============================= -->

    <app-message *ngIf="message" [message]="message" [type]="messageType"></app-message>

    <!-- ============================= -->
    <!-- BETÖLTÉS -->
    <!-- ============================= -->

    <app-loading *ngIf="loading" message="common.loading" class="block"></app-loading>

    <!-- ============================= -->
    <!-- COACH KIVÁLASZTÁSA -->
    <!-- ============================= -->

    <div class="rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:p-6">
      <app-form-field labelKey="adminCoachEdit.selectCoach" controlId="coachSelect">
        <app-select
          [searchable]="true"
          id="coachSelect"
          [value]="selectedCoachId"
          [options]="coachOptions"
          placeholder="adminCoachEdit.selectCoach"
          [placeholderValue]="null"
          (valueChange)="selectedCoachId = $event; onSelectCoach()"
        ></app-select>
      </app-form-field>
    </div>

    <!-- ============================= -->
    <!-- COACH FORM -->
    <!-- ============================= -->

    <form
      appProfileFields
      class="rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:p-6 lg:p-8"
      (ngSubmit)="onSave()"
    >
      <!-- Név -->
      <app-form-field class="min-w-0" labelKey="common.name" controlId="name">
        <input
          appInput="admin"
          id="name"
          name="name"
          type="text"
          [placeholder]="'common.name' | translate"
          [(ngModel)]="selectedCoach.name"
          class="min-w-0 placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Email -->
      <app-form-field class="min-w-0" labelKey="common.email" controlId="email">
        <input
          appInput="admin"
          id="email"
          name="email"
          type="email"
          [placeholder]="'common.email' | translate"
          [(ngModel)]="selectedCoach.email"
          class="min-w-0 placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Jelszó -->
      <app-form-field class="min-w-0" labelKey="common.password" controlId="password">
        <input
          appInput="admin"
          id="password"
          name="password"
          type="password"
          [placeholder]="'adminCoachEdit.passwordPlaceholder' | translate"
          [(ngModel)]="selectedCoach.password"
          class="min-w-0 placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Telefonszám -->
      <app-form-field class="min-w-0" labelKey="common.phone" controlId="phone">
        <input
          appInput="admin"
          id="phone"
          name="phone"
          type="text"
          [placeholder]="'common.phone' | translate"
          [(ngModel)]="selectedCoach.phone"
          class="min-w-0 placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Specializáció -->
      <app-form-field
        class="min-w-0 sm:col-span-2"
        labelKey="common.specialization"
        controlId="specialization"
      >
        <textarea
          appTextarea="admin"
          id="specialization"
          name="specialization"
          rows="4"
          [placeholder]="'common.specialization' | translate"
          [(ngModel)]="selectedCoach.specialization"
          class="min-w-0 placeholder:text-content-400"
        ></textarea>
      </app-form-field>

      <!-- Avatar URL -->
      <app-form-field
        class="min-w-0 sm:col-span-2"
        labelKey="common.avatarUrl"
        controlId="avatar_url"
      >
        <input
          appInput="admin"
          id="avatar_url"
          name="avatarUrl"
          type="text"
          [placeholder]="'common.avatarImageUrl' | translate"
          [(ngModel)]="selectedCoach.avatarUrl"
          class="min-w-0 placeholder:text-content-400"
        />
      </app-form-field>

      <!-- ============================= -->
      <!-- MENTÉS -->
      <!-- ============================= -->

      <div class="flex min-w-0 sm:col-span-2 sm:justify-end">
        <app-button
          variant="save"
          type="submit"
          [label]="'common.save' | translate"
          [disabled]="loading || saving || selectedCoachId === null"
        ></app-button>
      </div>
    </form>
  </div>
</div>
