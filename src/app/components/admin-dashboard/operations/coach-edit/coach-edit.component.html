<div class="page-container">

  <h2 class="page-title">Edző módosítása</h2>

  <!-- Üzenetek -->
  <div *ngIf="loading" class="loading-message">
    Betöltés folyamatban...
  </div>

  <div *ngIf="message" class="success-message">
    {{ message }}
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <!-- Coach select -->
  <div class="coach-select-container">
    <label class="form-label" for="coachSelect">
      Válassz edzőt
    </label>

    <select
      id="coachSelect"
      [(ngModel)]="selectedCoachId"
      (change)="onSelectCoach()"
      class="form-control"
    >
      <option [ngValue]="null">-- Válassz edzőt --</option>

      <option *ngFor="let c of coaches" [ngValue]="c.id">
        {{ c.name }} ({{ c.email }})
      </option>
    </select>
  </div>

  <!-- Form -->
  <form
    class="coach-form"
    (ngSubmit)="onSave()"
  >

    <!-- Name -->
    <div class="form-group">
      <label class="form-label" for="name">Név</label>

      <input
        id="name"
        name="name"
        type="text"
        placeholder="Név"
        [(ngModel)]="selectedCoach.name"
        class="form-control"
      />
    </div>

    <!-- Email -->
    <div class="form-group">
      <label class="form-label" for="email">Email</label>

      <input
        id="email"
        name="email"
        type="email"
        placeholder="Email"
        [(ngModel)]="selectedCoach.email"
        class="form-control"
      />
    </div>

    <!-- Password -->
    <div class="form-group">
      <label class="form-label" for="password">Jelszó</label>

      <input
        id="password"
        name="password"
        type="password"
        placeholder="Jelszó (hagyd üresen ha nem változik)"
        [(ngModel)]="selectedCoach.password"
        class="form-control"
      />
    </div>

    <!-- Phone -->
    <div class="form-group">
      <label class="form-label" for="phone">Telefon</label>

      <input
        id="phone"
        name="phone"
        type="text"
        placeholder="Telefon"
        [(ngModel)]="selectedCoach.phone"
        class="form-control"
      />
    </div>

    <!-- Specialization -->
    <div class="form-group full-width">
      <label class="form-label" for="specialization">
        Specializáció
      </label>

      <textarea
        id="specialization"
        name="specialization"
        rows="3"
        placeholder="Specializáció"
        [(ngModel)]="selectedCoach.specialization"
        class="form-control"
      ></textarea>
    </div>

    <!-- Avatar URL -->
    <div class="form-group full-width">
      <label class="form-label" for="avatar_url">
        Avatar URL
      </label>

      <input
        id="avatar_url"
        name="avatarUrl"
        type="text"
        placeholder="Avatar kép URL"
        [(ngModel)]="selectedCoach.avatarUrl"
        class="form-control"
      />
    </div>

    <!-- Submit Button -->
    <div class="submit-container">
      <button
        type="submit"
        class="save-button"
      >
        Mentés
      </button>
    </div>

  </form>

</div>
