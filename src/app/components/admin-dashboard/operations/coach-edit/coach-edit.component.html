<div
  class="min-h-screen min-w-0 bg-gradient-to-br from-surface-50 via-primary-50/40 to-primary-50/50 px-4 py-6 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-4xl min-w-0 flex-col gap-6">

    <!-- ============================= -->
    <!-- OLDAL CÍM -->
    <!-- ============================= -->

    <div class="text-center">
      <h2
        class="break-words text-2xl font-bold tracking-tight text-content-800 sm:text-3xl"
      >
        {{ 'adminCoachEdit.title' | translate }}
      </h2>
    </div>

    <!-- ============================= -->
    <!-- ÜZENET -->
    <!-- ============================= -->

    <app-message
      *ngIf="message"
      [message]="message"
      [type]="messageType"
    ></app-message>

    <!-- ============================= -->
    <!-- BETÖLTÉS -->
    <!-- ============================= -->

    <div
      *ngIf="loading"
      class="flex min-h-20 items-center justify-center rounded-xl border border-info-200 bg-info-50 px-4 py-4 text-center text-sm font-medium text-info-700"
    >
      {{ 'common.loading' | translate }}
    </div>

    <!-- ============================= -->
    <!-- COACH KIVÁLASZTÁSA -->
    <!-- ============================= -->

    <div
      class="rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:p-6"
    >
      <label
        class="mb-2 block text-sm font-semibold text-content-700"
        for="coachSelect"
      >
        {{ 'adminCoachEdit.selectCoach' | translate }}
      </label>

      <select
        id="coachSelect"
        [(ngModel)]="selectedCoachId"
        (change)="onSelectCoach()"
        class="min-h-11 w-full rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
      >
        <option [ngValue]="null">
          -- {{ 'adminCoachEdit.selectCoach' | translate }} --
        </option>

        <option
          *ngFor="let c of coaches"
          [ngValue]="c.id"
        >
          {{ c.name }} ({{ c.email }})
        </option>
      </select>
    </div>

    <!-- ============================= -->
    <!-- COACH FORM -->
    <!-- ============================= -->

    <form
      class="grid min-w-0 grid-cols-1 gap-5 rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:grid-cols-2 sm:p-6 lg:p-8"
      (ngSubmit)="onSave()"
    >

      <!-- Név -->
      <app-form-field class="min-w-0" labelKey="common.name" controlId="name">
        <input
          id="name"
          name="name"
          type="text"
          [placeholder]="'common.name' | translate"
          [(ngModel)]="selectedCoach.name"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- Email -->
      <app-form-field class="min-w-0" labelKey="common.email" controlId="email">
        <input
          id="email"
          name="email"
          type="email"
          [placeholder]="'common.email' | translate"
          [(ngModel)]="selectedCoach.email"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- Jelszó -->
      <app-form-field class="min-w-0" labelKey="common.password" controlId="password">
        <input
          id="password"
          name="password"
          type="password"
          [placeholder]="'adminCoachEdit.passwordPlaceholder' | translate"
          [(ngModel)]="selectedCoach.password"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- Telefonszám -->
      <app-form-field class="min-w-0" labelKey="common.phone" controlId="phone">
        <input
          id="phone"
          name="phone"
          type="text"
          [placeholder]="'common.phone' | translate"
          [(ngModel)]="selectedCoach.phone"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- Specializáció -->
      <app-form-field class="min-w-0 sm:col-span-2" labelKey="common.specialization" controlId="specialization">
        <textarea
          id="specialization"
          name="specialization"
          rows="4"
          [placeholder]="'common.specialization' | translate"
          [(ngModel)]="selectedCoach.specialization"
          class="w-full min-w-0 resize-y rounded-xl border border-surface-300 bg-white px-4 py-3 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        ></textarea>
      </app-form-field>

      <!-- Avatar URL -->
      <app-form-field class="min-w-0 sm:col-span-2" labelKey="common.avatarUrl" controlId="avatar_url">
        <input
          id="avatar_url"
          name="avatarUrl"
          type="text"
          placeholder="Avatar kép URL"
          [(ngModel)]="selectedCoach.avatarUrl"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- ============================= -->
      <!-- MENTÉS -->
      <!-- ============================= -->

      <div class="flex min-w-0 sm:col-span-2 sm:justify-end">
        <app-button
          variant="save"
          type="submit"
          [label]="'common.save' | translate"
        ></app-button>
      </div>

    </form>

  </div>
</div>
