<div class="page-container">

  <!-- ============================= -->
  <!-- OLDAL CÍM -->
  <!-- ============================= -->

  <h2 class="page-title">
    {{ 'adminCoachEdit.title' | translate }}
  </h2>


  <!-- ============================= -->
  <!-- ÜZENET -->
  <!-- ============================= -->

  <app-message
    *ngIf="message"
    [message]="message"
    [type]="messageType"
  ></app-message>


  <!-- ============================= -->
  <!-- BETÖLTÉS -->
  <!-- ============================= -->

  <div
    *ngIf="loading"
    class="loading-message"
  >
    {{ 'common.loading' | translate }}
  </div>


  <!-- ============================= -->
  <!-- COACH KIVÁLASZTÁSA -->
  <!-- ============================= -->

  <div class="coach-select-container">

    <label
      class="form-label"
      for="coachSelect"
    >
      {{ 'adminCoachEdit.selectCoach' | translate }}
    </label>

    <select
      id="coachSelect"
      [(ngModel)]="selectedCoachId"
      (change)="onSelectCoach()"
      class="form-control"
    >
      <option [ngValue]="null">
        -- {{ 'adminCoachEdit.selectCoach' | translate }} --
      </option>

      <option
        *ngFor="let c of coaches"
        [ngValue]="c.id"
      >
        {{ c.name }} ({{ c.email }})
      </option>

    </select>

  </div>


  <!-- ============================= -->
  <!-- COACH FORM -->
  <!-- ============================= -->

  <form
    class="coach-form"
    (ngSubmit)="onSave()"
  >

    <!-- Név -->

    <div class="form-group">

      <label
        class="form-label"
        for="name"
      >
        {{ 'common.name' | translate }}
      </label>

      <input
        id="name"
        name="name"
        type="text"
        [placeholder]="'common.name' | translate"
        [(ngModel)]="selectedCoach.name"
        class="form-control"
      />

    </div>


    <!-- Email -->

    <div class="form-group">

      <label
        class="form-label"
        for="email"
      >
        {{ 'common.email' | translate }}
      </label>

      <input
        id="email"
        name="email"
        type="email"
        [placeholder]="'common.email' | translate"
        [(ngModel)]="selectedCoach.email"
        class="form-control"
      />

    </div>


    <!-- Jelszó -->

    <div class="form-group">

      <label
        class="form-label"
        for="password"
      >
        {{ 'common.password' | translate }}
      </label>

      <input
        id="password"
        name="password"
        type="password"
        [placeholder]="'adminCoachEdit.passwordPlaceholder' | translate"
        [(ngModel)]="selectedCoach.password"
        class="form-control"
      />

    </div>


    <!-- Telefonszám -->

    <div class="form-group">

      <label
        class="form-label"
        for="phone"
      >
        {{ 'common.phone' | translate }}
      </label>

      <input
        id="phone"
        name="phone"
        type="text"
        [placeholder]="'common.phone' | translate"
        [(ngModel)]="selectedCoach.phone"
        class="form-control"
      />

    </div>


    <!-- Specializáció -->

    <div class="form-group full-width">

      <label
        class="form-label"
        for="specialization"
      >
        {{ 'common.specialization' | translate }}
      </label>

      <textarea
        id="specialization"
        name="specialization"
        rows="3"
        [placeholder]="'common.specialization' | translate"
        [(ngModel)]="selectedCoach.specialization"
        class="form-control"
      ></textarea>

    </div>


    <!-- Avatar URL -->

    <div class="form-group full-width">

      <label
        class="form-label"
        for="avatar_url"
      >
        Avatar URL
      </label>

      <input
        id="avatar_url"
        name="avatarUrl"
        type="text"
        placeholder="Avatar kép URL"
        [(ngModel)]="selectedCoach.avatarUrl"
        class="form-control"
      />

    </div>


    <!-- ============================= -->
    <!-- MENTÉS -->
    <!-- ============================= -->

    <div class="submit-container">

      <button
        type="submit"
        class="save-button"
      >
        {{ 'common.save' | translate }}
      </button>

    </div>

  </form>

</div>
