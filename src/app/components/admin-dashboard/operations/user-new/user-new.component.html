<div class="user-new-container">
  <!-- Oldal címe -->
  <h2 class="page-title">
    {{ 'adminUserNew.title' | translate }}
  </h2>

  <!-- Üzenet -->
  <app-message
    *ngIf="message"
    [message]="message | translate"
    [type]="messageType"
  ></app-message>

  <!-- Form -->
  <form
    #userForm="ngForm"
    (ngSubmit)="onSubmit(userForm)"
    class="user-form"
  >
    <!-- Felhasználónév -->
    <div class="form-group">
      <label for="username" class="form-label">
        {{ 'common.username' | translate }}
      </label>

      <input
        id="username"
        name="username"
        type="text"
        required
        [(ngModel)]="user.username"
        class="form-input"
      />
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="email" class="form-label">
        {{ 'common.email' | translate }}
      </label>

      <input
        id="email"
        name="email"
        type="email"
        required
        [(ngModel)]="user.email"
        class="form-input"
      />
    </div>

    <!-- Jelszó -->
    <div class="form-group">
      <label for="password" class="form-label">
        {{ 'common.password' | translate }}
      </label>

      <input
        id="password"
        name="password"
        type="password"
        required
        [(ngModel)]="user.passwordHash"
        class="form-input"
      />
    </div>

    <!-- Életkor -->
    <div class="form-group">
      <label for="age" class="form-label">
        {{ 'common.age' | translate }}
      </label>

      <input
        id="age"
        name="age"
        type="number"
        [(ngModel)]="user.age"
        class="form-input"
      />
    </div>

    <!-- Testsúly -->
    <div class="form-group">
      <label for="weight" class="form-label">
        {{ 'common.weight' | translate }} (kg)
      </label>

      <input
        id="weight"
        name="weight"
        type="number"
        step="0.01"
        [(ngModel)]="user.weight"
        class="form-input"
      />
    </div>

    <!-- Magasság -->
    <div class="form-group">
      <label for="height" class="form-label">
        {{ 'common.height' | translate }} (cm)
      </label>

      <input
        id="height"
        name="height"
        type="number"
        step="0.01"
        [(ngModel)]="user.height"
        class="form-input"
      />
    </div>

    <!-- Nem -->
    <div class="form-group">
      <label for="gender" class="form-label">
        {{ 'common.gender' | translate }}
      </label>

      <select
        id="gender"
        name="gender"
        [(ngModel)]="user.gender"
        class="form-input"
      >
        <option value="male">
          {{ 'common.male' | translate }}
        </option>

        <option value="female">
          {{ 'common.female' | translate }}
        </option>
      </select>
    </div>

    <!-- Célok -->
    <div class="form-group form-group-full">
      <label for="goals" class="form-label">
        {{ 'common.goals' | translate }}
      </label>

      <textarea
        id="goals"
        name="goals"
        [(ngModel)]="user.goals"
        class="form-input form-textarea"
      ></textarea>
    </div>

    <!-- Avatar URL -->
    <div class="form-group form-group-full">
      <label for="avatarUrl" class="form-label">
        {{ 'common.avatarUrl' | translate }}
      </label>

      <input
        id="avatarUrl"
        name="avatarUrl"
        type="text"
        [(ngModel)]="user.avatarUrl"
        class="form-input"
      />
    </div>

    <!-- Edző kiválasztása -->
    <div class="form-group form-group-full">
      <label class="form-label">
        {{ 'adminUserNew.assignCoach' | translate }}
      </label>

      <app-coach-select
        [(selectedCoachId)]="user.coachId"
        (coachSelected)="onCoachSelected($event)"
      >
      </app-coach-select>
    </div>

    <!-- Szerepkörök -->
    <div class="form-group form-group-full">
      <label class="form-label">
        {{ 'adminUserNew.roles' | translate }}*
      </label>

      <app-role-select
        [roles]="roles"
        (roleSelected)="onRoleSelected($event)"
      >
      </app-role-select>

      <!-- Kiválasztott szerepkörök -->
      <div class="selected-roles">
        <span
          *ngFor="let role of user.roleIds"
          class="selected-role"
          (click)="onRemoveRole(role)"
        >
          {{ role.name }}

          <span class="remove-role">x</span>
        </span>
      </div>
    </div>

    <!-- Mentés -->
    <div class="form-submit">
      <button
        type="submit"
        class="submit-button"
      >
        {{ 'adminUserNew.create' | translate }}
      </button>
    </div>
  </form>
</div>
