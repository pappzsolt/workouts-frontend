<div class="user-new-container">

  <h2 class="user-new-title">
    Új Felhasználó
  </h2>

  <!-- Üzenet -->
  <div
    *ngIf="message"
    [ngClass]="{
      'message-error': isError,
      'message-success': !isError
    }"
    class="message">
    {{ message }}
  </div>

  <form
    #userForm="ngForm"
    (ngSubmit)="onSubmit(userForm)"
    class="user-form">

    <div class="form-group">
      <label for="username">Felhasználónév</label>
      <input
        id="username"
        name="username"
        type="text"
        required
        [(ngModel)]="user.username"
        class="form-input"/>
    </div>

    <div class="form-group">
      <label for="email">Email cím</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        [(ngModel)]="user.email"
        class="form-input"/>
    </div>

    <div class="form-group">
      <label for="password">Jelszó</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        [(ngModel)]="user.passwordHash"
        class="form-input"/>
    </div>

    <div class="form-group">
      <label for="age">Életkor</label>
      <input
        id="age"
        name="age"
        type="number"
        [(ngModel)]="user.age"
        class="form-input"/>
    </div>

    <div class="form-group">
      <label for="weight">Súly (kg)</label>
      <input
        id="weight"
        name="weight"
        type="number"
        step="0.01"
        [(ngModel)]="user.weight"
        class="form-input"/>
    </div>

    <div class="form-group">
      <label for="height">Magasság (cm)</label>
      <input
        id="height"
        name="height"
        type="number"
        step="0.01"
        [(ngModel)]="user.height"
        class="form-input"/>
    </div>

    <div class="form-group">
      <label for="gender">Nem</label>
      <select
        id="gender"
        name="gender"
        [(ngModel)]="user.gender"
        class="form-input">

        <option value="Férfi">Férfi</option>
        <option value="Nő">Nő</option>

      </select>
    </div>

    <div class="form-group form-group-full">
      <label for="goals">Célok</label>

      <textarea
        id="goals"
        name="goals"
        [(ngModel)]="user.goals"
        class="form-input form-textarea">
      </textarea>
    </div>

    <div class="form-group">
      <label for="avatarUrl">Avatar URL</label>

      <input
        id="avatarUrl"
        name="avatarUrl"
        type="text"
        [(ngModel)]="user.avatarUrl"
        class="form-input"/>
    </div>

    <!-- Coach select -->
    <div class="form-group form-group-full">
      <label class="form-label">
        Edző hozzárendelése
      </label>

      <app-coach-select
        [(selectedCoachId)]="user.coachId"
        (coachSelected)="onCoachSelected($event)">
      </app-coach-select>
    </div>

    <!-- Role kiválasztás -->
    <div class="form-group form-group-full">

      <label class="form-label">
        Szerepkörök*
      </label>

      <app-role-select
        [roles]="roles"
        (roleSelected)="onRoleSelected($event)">
      </app-role-select>

      <div class="selected-roles">

        <span
          *ngFor="let r of user.roleIds"
          class="selected-role"
          (click)="onRemoveRole(r)">

          {{ r.name }}

          <span class="remove-role">
            x
          </span>

        </span>

      </div>

    </div>

    <!-- Submit -->
    <div class="form-submit">

      <button
        type="submit"
        class="submit-button">
        Létrehozás
      </button>

    </div>

  </form>

</div>
