<div
  class="min-h-screen min-w-0 bg-gradient-to-br from-surface-50 via-primary-50/40 to-primary-50/50 px-4 py-6 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-4xl min-w-0 flex-col gap-6">

    <!-- Oldal címe -->
    <div class="text-center">
      <h2
        class="break-words text-2xl font-bold tracking-tight text-content-800 sm:text-3xl"
      >
        {{ 'adminUserNew.title' | translate }}
      </h2>
    </div>

    <!-- Üzenet -->
    <app-message
      *ngIf="message"
      [message]="message | translate"
      [type]="messageType"
    ></app-message>

    <!-- Form -->
    <form
      #userForm="ngForm"
      (ngSubmit)="onSubmit(userForm)"
      class="grid min-w-0 grid-cols-1 gap-5 rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:grid-cols-2 sm:p-6"
    >

      <!-- Felhasználónév -->
      <div class="min-w-0">
        <label
          for="username"
          class="mb-2 block text-sm font-semibold text-content-700"
        >
          {{ 'common.username' | translate }}
        </label>

        <input
          id="username"
          name="username"
          type="text"
          required
          [(ngModel)]="user.username"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </div>

      <!-- Email -->
      <div class="min-w-0">
        <label
          for="email"
          class="mb-2 block text-sm font-semibold text-content-700"
        >
          {{ 'common.email' | translate }}
        </label>

        <input
          id="email"
          name="email"
          type="email"
          required
          [(ngModel)]="user.email"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </div>

      <!-- Jelszó -->
      <div class="min-w-0">
        <label
          for="password"
          class="mb-2 block text-sm font-semibold text-content-700"
        >
          {{ 'common.password' | translate }}
        </label>

        <input
          id="password"
          name="password"
          type="password"
          required
          [(ngModel)]="user.passwordHash"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </div>

      <!-- Életkor -->
      <div class="min-w-0">
        <label
          for="age"
          class="mb-2 block text-sm font-semibold text-content-700"
        >
          {{ 'common.age' | translate }}
        </label>

        <input
          id="age"
          name="age"
          type="number"
          [(ngModel)]="user.age"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </div>

      <!-- Testsúly -->
      <div class="min-w-0">
        <label
          for="weight"
          class="mb-2 block text-sm font-semibold text-content-700"
        >
          {{ 'common.weight' | translate }} (kg)
        </label>

        <input
          id="weight"
          name="weight"
          type="number"
          step="0.01"
          [(ngModel)]="user.weight"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </div>

      <!-- Magasság -->
      <div class="min-w-0">
        <label
          for="height"
          class="mb-2 block text-sm font-semibold text-content-700"
        >
          {{ 'common.height' | translate }} (cm)
        </label>

        <input
          id="height"
          name="height"
          type="number"
          step="0.01"
          [(ngModel)]="user.height"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </div>

      <!-- Nem -->
      <div class="min-w-0">
        <label
          for="gender"
          class="mb-2 block text-sm font-semibold text-content-700"
        >
          {{ 'common.gender' | translate }}
        </label>

        <select
          id="gender"
          name="gender"
          [(ngModel)]="user.gender"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        >
          <option value="male">
            {{ 'common.male' | translate }}
          </option>

          <option value="female">
            {{ 'common.female' | translate }}
          </option>
        </select>
      </div>

      <!-- Célok -->
      <div class="min-w-0 sm:col-span-2">
        <label
          for="goals"
          class="mb-2 block text-sm font-semibold text-content-700"
        >
          {{ 'common.goals' | translate }}
        </label>

        <textarea
          id="goals"
          name="goals"
          [(ngModel)]="user.goals"
          rows="4"
          class="w-full min-w-0 resize-y rounded-xl border border-surface-300 bg-white px-4 py-3 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        ></textarea>
      </div>

      <!-- Avatar URL -->
      <div class="min-w-0 sm:col-span-2">
        <label
          for="avatarUrl"
          class="mb-2 block text-sm font-semibold text-content-700"
        >
          {{ 'common.avatarUrl' | translate }}
        </label>

        <input
          id="avatarUrl"
          name="avatarUrl"
          type="text"
          [(ngModel)]="user.avatarUrl"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </div>

      <!-- Edző kiválasztása -->
      <div class="min-w-0 sm:col-span-2">
        <label class="mb-2 block text-sm font-semibold text-content-700">
          {{ 'adminUserNew.assignCoach' | translate }}
        </label>

        <div
          class="rounded-xl border border-surface-200 bg-surface-50 p-4"
        >
          <app-coach-select
            [(selectedCoachId)]="user.coachId"
            (coachSelected)="onCoachSelected($event)"
          >
          </app-coach-select>
        </div>
      </div>

      <!-- Szerepkörök -->
      <div class="min-w-0 sm:col-span-2">
        <label class="mb-2 block text-sm font-semibold text-content-700">
          {{ 'adminUserNew.roles' | translate }}*
        </label>

        <div
          class="rounded-xl border border-surface-200 bg-surface-50 p-4"
        >
          <app-role-select
            [roles]="roles"
            (roleSelected)="onRoleSelected($event)"
          >
          </app-role-select>

          <!-- Kiválasztott szerepkörök -->
          <div
            *ngIf="user.roleIds?.length"
            class="mt-4 flex flex-wrap gap-2"
          >
            <span
              *ngFor="let role of user.roleIds"
              class="inline-flex cursor-pointer items-center gap-2 rounded-full border border-info-200 bg-info-50 px-3 py-1.5 text-sm font-semibold text-info-700 transition-colors duration-200 hover:border-delete-200 hover:bg-delete-50 hover:text-delete-700"
              (click)="onRemoveRole(role)"
            >
              {{ role.name }}

              <span
                class="text-xs font-bold opacity-70"
              >
                ×
              </span>
            </span>
          </div>
        </div>
      </div>

      <!-- Mentés -->
      <div class="sm:col-span-2">
        <app-button
          variant="primary"
          type="submit"
          [label]="'adminUserNew.create' | translate"
        ></app-button>
      </div>

    </form>
  </div>
</div>
