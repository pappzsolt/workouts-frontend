<div class="min-h-full min-w-0 bg-transparent px-4 py-6 sm:px-6 lg:px-8">
  <div class="mx-auto flex w-full max-w-4xl min-w-0 flex-col gap-6">
    <!-- Oldal címe -->
    <div class="text-center">
      <h2 appHeading="page" class="break-words">
        {{ 'adminUserNew.title' | translate }}
      </h2>
    </div>

    <!-- Üzenet -->
    <app-message *ngIf="message" [message]="message" [type]="messageType"></app-message>

    <!-- Form -->
    <form
      appProfileFields
      #userForm="ngForm"
      (ngSubmit)="onSubmit(userForm)"
      class="rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:p-6"
    >
      <!-- Felhasználónév -->
      <app-form-field labelKey="common.username" controlId="username" [required]="true">
        <input
          appInput="admin"
          id="username"
          name="username"
          type="text"
          required
          [(ngModel)]="user.username"
          class="min-w-0 placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Email -->
      <app-form-field labelKey="common.email" controlId="email" [required]="true">
        <input
          appInput="admin"
          id="email"
          name="email"
          type="email"
          required
          [(ngModel)]="user.email"
          class="min-w-0 placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Jelszó -->
      <app-form-field labelKey="common.password" controlId="password" [required]="true">
        <input
          appInput="admin"
          id="password"
          name="password"
          type="password"
          appValidation="password"
          required
          [(ngModel)]="user.passwordHash"
          class="min-w-0 placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Életkor -->
      <app-form-field labelKey="common.age" controlId="age">
        <input
          appInput="admin"
          id="age"
          name="age"
          type="number"
          min="0"
          step="1"
          [(ngModel)]="user.age"
          class="min-w-0 placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Testsúly -->
      <app-form-field labelKey="common.weight" controlId="weight" labelSuffix=" (kg)">
        <input
          appInput="admin"
          id="weight"
          name="weight"
          type="number"
          min="0"
          step="0.01"
          [(ngModel)]="user.weight"
          class="min-w-0 placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Magasság -->
      <app-form-field labelKey="common.height" controlId="height" labelSuffix=" (cm)">
        <input
          appInput="admin"
          id="height"
          name="height"
          type="number"
          min="0"
          step="0.01"
          [(ngModel)]="user.height"
          class="min-w-0 placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Nem -->
      <app-form-field labelKey="common.gender" controlId="gender">
        <app-select
          id="gender"
          name="gender"
          [(value)]="user.gender"
          [options]="genderOptions"
        ></app-select>
      </app-form-field>

      <!-- Célok -->
      <app-form-field class="min-w-0 sm:col-span-2" labelKey="common.goals" controlId="goals">
        <textarea
          appTextarea="admin"
          id="goals"
          name="goals"
          [(ngModel)]="user.goals"
          rows="4"
          class="min-w-0 placeholder:text-content-400"
        ></textarea>
      </app-form-field>

      <!-- Avatar URL -->
      <app-form-field
        class="min-w-0 sm:col-span-2"
        labelKey="common.avatarUrl"
        controlId="avatarUrl"
      >
        <input
          appInput="admin"
          id="avatarUrl"
          name="avatarUrl"
          type="text"
          [(ngModel)]="user.avatarUrl"
          class="min-w-0 placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Edző kiválasztása -->
      <app-form-field class="min-w-0 sm:col-span-2" labelKey="adminUserNew.assignCoach">
        <div class="rounded-xl border border-surface-200 bg-surface-50 p-4">
          <app-coach-select
            [(selectedCoachId)]="user.coachId"
            (coachSelected)="onCoachSelected($event)"
          >
          </app-coach-select>
        </div>
      </app-form-field>

      <!-- Szerepkörök -->
      <app-form-field class="min-w-0 sm:col-span-2" labelKey="adminUserNew.roles" [required]="true">
        <div class="rounded-xl border border-surface-200 bg-surface-50 p-4">
          <app-role-select [roles]="roles" (roleSelected)="onRoleSelected($event)">
          </app-role-select>

          <!-- Kiválasztott szerepkörök -->
          <div *ngIf="user.roleIds?.length" class="mt-4 flex flex-wrap gap-2">
            <app-button
              *ngFor="let role of user.roleIds; trackBy: trackByRole"
              variant="delete"
              appearance="outline"
              size="sm"
              [round]="true"
              [label]="role.name"
              lucideIcon="x"
              [ariaLabel]="('common.remove' | translate) + ': ' + role.name"
              (buttonClick)="onRemoveRole(role)"
            ></app-button>
          </div>
        </div>
      </app-form-field>

      <!-- Mentés -->
      <div class="sm:col-span-2">
        <app-button
          variant="primary"
          type="submit"
          [label]="'adminUserNew.create' | translate"
        ></app-button>
      </div>
    </form>
  </div>
</div>
