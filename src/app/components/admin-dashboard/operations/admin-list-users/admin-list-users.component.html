<h2 class="programs-title">
  {{ 'adminUsers.title' | translate }}
</h2>

<!-- Hiba / Üzenet -->
<div *ngIf="errorMessage" class="message-box message-error">
  {{ errorMessage }}
</div>

<!-- Felhasználók -->
<ng-container *ngIf="paginatedUsers.length > 0; else noUsers">
  <div class="programs-grid">
    <div *ngFor="let user of paginatedUsers" class="program-card">
      <!-- Avatar / Emoji -->
      <div class="program-image">
        <span class="program-emoji">👤</span>
      </div>

      <!-- Tartalom -->
      <div class="program-content">
        <div class="program-name">
          {{ user.username }}
        </div>

        <div class="program-description">
          {{ user.email }}
        </div>

        <div class="user-roles">
          {{ 'adminUsers.role' | translate }}: {{ user.roles.join(', ') }}
        </div>
      </div>
    </div>
  </div>

  <!-- Lapozás -->
  <div class="pagination">
    <button
      (click)="prevPage()"
      [disabled]="currentPage === 1"
      class="pagination-button"
    >
      {{ 'common.previous' | translate }}
    </button>

    <span class="pagination-page">
      {{ currentPage }} / {{ totalPages }}
    </span>

    <button
      (click)="nextPage()"
      [disabled]="currentPage === totalPages"
      class="pagination-button"
    >
      {{ 'common.next' | translate }}
    </button>
  </div>
</ng-container>

<!-- Üres lista -->
<ng-template #noUsers>
  <div class="no-programs">
    {{ 'adminUsers.noUsers' | translate }}
  </div>
</ng-template>
