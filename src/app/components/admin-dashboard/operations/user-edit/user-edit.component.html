<div
  class="min-h-full min-w-0 bg-transparent px-4 py-6 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-5xl min-w-0 flex-col gap-6">

    <!-- Oldal címe -->
    <div class="text-center">
      <h2
        class="break-words text-2xl font-bold tracking-tight text-content-800 sm:text-3xl"
      >
        {{ 'adminUserEdit.title' | translate }}
      </h2>
    </div>

    <!-- Üzenet -->
    <app-message
      *ngIf="message"
      [message]="message | translate"
      [type]="messageType"
    ></app-message>

    <!-- Felhasználó kiválasztása -->
    <div
      class="rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:p-6"
    >
      <app-user-select
        [(selectedUserId)]="selectedUserId"
        (userSelected)="onUserSelected($event)"
      >
      </app-user-select>
    </div>

    <!-- Form -->
    <form
      (ngSubmit)="onSave()"
      class="grid min-w-0 grid-cols-1 gap-5 rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:grid-cols-2 sm:p-6 lg:p-8"
    >

      <!-- Felhasználónév -->
      <app-form-field class="min-w-0" labelKey="common.username" controlId="username">
        <input
          id="username"
          type="text"
          [(ngModel)]="selectedUser.username"
          name="username"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- Email -->
      <app-form-field class="min-w-0" labelKey="common.email" controlId="email">
        <input
          id="email"
          type="email"
          [(ngModel)]="selectedUser.email"
          name="email"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- Jelszó -->
      <app-form-field class="min-w-0" labelKey="common.password" controlId="password">
        <input
          id="password"
          type="password"
          [(ngModel)]="selectedUser.password"
          name="password"
          [placeholder]="'adminUserEdit.newPassword' | translate"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- Életkor -->
      <app-form-field class="min-w-0" labelKey="common.age" controlId="age">
        <input
          id="age"
          type="number"
          [(ngModel)]="selectedUser.age"
          name="age"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- Testsúly -->
      <app-form-field class="min-w-0" labelKey="common.weight" controlId="weight">
        <input
          id="weight"
          type="number"
          step="0.01"
          [(ngModel)]="selectedUser.weight"
          name="weight"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- Magasság -->
      <app-form-field class="min-w-0" labelKey="common.height" controlId="height">
        <input
          id="height"
          type="number"
          step="0.01"
          [(ngModel)]="selectedUser.height"
          name="height"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- Nem -->
      <app-form-field class="min-w-0" labelKey="common.gender" controlId="gender">
        <input
          id="gender"
          type="text"
          [(ngModel)]="selectedUser.gender"
          name="gender"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- Célok -->
      <app-form-field class="min-w-0 sm:col-span-2" labelKey="common.goals" controlId="goals">
        <textarea
          id="goals"
          [(ngModel)]="selectedUser.goals"
          name="goals"
          rows="4"
          class="w-full min-w-0 resize-y rounded-xl border border-surface-300 bg-white px-4 py-3 text-base text-content-800 shadow-sm outline-none transition-all duration-200 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        ></textarea>
      </app-form-field>

      <!-- Avatar URL -->
      <app-form-field class="min-w-0 sm:col-span-2" labelKey="common.avatarUrl" controlId="avatarUrl">
        <input
          id="avatarUrl"
          type="text"
          [(ngModel)]="selectedUser.avatarUrl"
          name="avatarUrl"
          class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </app-form-field>

      <!-- Edző -->
      <div class="min-w-0">
        <label
          class="mb-2 block text-sm font-semibold text-content-700"
        >
          {{ 'adminUserEdit.coach' | translate }}
        </label>

        <app-coach-select
          [selectedCoachId]="selectedCoach?.id"
          (coachSelected)="onCoachSelected($event)"
        >
        </app-coach-select>
      </div>

      <!-- Szerepkörök -->
      <div class="min-w-0">
        <mat-form-field
          appearance="fill"
          class="w-full"
        >
          <mat-label>
            {{ 'adminUserEdit.roles' | translate }}
          </mat-label>

          <mat-select
            multiple
            [value]="selectedRoles"
            (selectionChange)="onRoleSelected($event.value)"
          >
            <mat-option
              *ngFor="let role of roles"
              [value]="role"
            >
              {{ role.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Mentés -->
      <div
        class="flex min-w-0 sm:col-span-2 sm:justify-end"
      >
        <button
          type="submit"
          class="min-h-11 w-full rounded-xl bg-gradient-to-r from-primary-700 to-primary-800 px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:from-primary-700 hover:to-primary-700 hover:shadow-md focus:outline-none focus:ring-4 focus:ring-primary-200/50 active:scale-[0.99] sm:w-auto"
        >
          {{ 'common.save' | translate }}
        </button>
      </div>

    </form>
  </div>
</div>
