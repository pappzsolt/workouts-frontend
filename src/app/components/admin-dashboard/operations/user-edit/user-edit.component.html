<div class="min-h-full min-w-0 bg-transparent px-4 py-6 sm:px-6 lg:px-8">
  <div class="mx-auto flex w-full max-w-5xl min-w-0 flex-col gap-6">
    <!-- Oldal címe -->
    <div class="text-center">
      <h2 appHeading="page" class="break-words">
        {{ 'adminUserEdit.title' | translate }}
      </h2>
    </div>

    <!-- Üzenet -->
    <app-message *ngIf="message" [message]="message" [type]="messageType"></app-message>

    <!-- Felhasználó kiválasztása -->
    <div class="rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:p-6">
      <app-user-select
        [searchable]="true"
        [(selectedUserId)]="selectedUserId"
        [disabled]="!ready || saving"
        (userSelected)="onUserSelected($event)"
      >
      </app-user-select>
    </div>

    <fieldset [disabled]="!ready || saving" class="min-w-0">
      <!-- Form -->
      <form
        appProfileFields
        (ngSubmit)="onSave()"
        class="rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:p-6 lg:p-8"
      >
        <!-- Felhasználónév -->
        <app-form-field class="min-w-0" labelKey="common.username" controlId="username" [required]="true">
          <input
            required
            appInput="admin"
            id="username"
            type="text"
            [(ngModel)]="selectedUser.username"
            name="username"
            class="min-w-0"
          />
        </app-form-field>

        <!-- Email -->
        <app-form-field class="min-w-0" labelKey="common.email" controlId="email" [required]="true">
          <input
            required
            appInput="admin"
            id="email"
            type="email"
            [(ngModel)]="selectedUser.email"
            name="email"
            class="min-w-0"
          />
        </app-form-field>

        <!-- Jelszó -->
        <app-form-field class="min-w-0" labelKey="common.password" controlId="password">
          <input
            appInput="admin"
            id="password"
            type="password"
            appValidation="password"
            [(ngModel)]="selectedUser.password"
            name="password"
            [placeholder]="'adminUserEdit.newPassword' | translate"
            class="min-w-0 placeholder:text-content-400"
          />
        </app-form-field>

        <!-- Életkor -->
        <app-form-field class="min-w-0" labelKey="common.age" controlId="age">
          <input
            appInput="admin"
            id="age"
            type="number"
            min="0"
            step="1"
            [(ngModel)]="selectedUser.age"
            name="age"
            class="min-w-0"
          />
        </app-form-field>

        <!-- Testsúly -->
        <app-form-field class="min-w-0" labelKey="common.weight" controlId="weight">
          <input
            appInput="admin"
            id="weight"
            type="number"
            min="0"
            step="0.01"
            [(ngModel)]="selectedUser.weight"
            name="weight"
            class="min-w-0"
          />
        </app-form-field>

        <!-- Magasság -->
        <app-form-field class="min-w-0" labelKey="common.height" controlId="height">
          <input
            appInput="admin"
            id="height"
            type="number"
            min="0"
            step="0.01"
            [(ngModel)]="selectedUser.height"
            name="height"
            class="min-w-0"
          />
        </app-form-field>

        <!-- Nem -->
        <app-form-field class="min-w-0" labelKey="common.gender" controlId="gender">
          <input
            appInput="admin"
            id="gender"
            type="text"
            [(ngModel)]="selectedUser.gender"
            name="gender"
            class="min-w-0"
          />
        </app-form-field>

        <!-- Célok -->
        <app-form-field class="min-w-0 sm:col-span-2" labelKey="common.goals" controlId="goals">
          <textarea
            appTextarea="admin"
            id="goals"
            [(ngModel)]="selectedUser.goals"
            name="goals"
            rows="4"
            class="min-w-0"
          ></textarea>
        </app-form-field>

        <!-- Avatar URL -->
        <app-form-field
          class="min-w-0 sm:col-span-2"
          labelKey="common.avatarUrl"
          controlId="avatarUrl"
        >
          <input
            appInput="admin"
            id="avatarUrl"
            type="text"
            [(ngModel)]="selectedUser.avatarUrl"
            name="avatarUrl"
            class="min-w-0"
          />
        </app-form-field>

        <!-- Edző -->
        <div class="min-w-0">
          <label class="mb-2 block text-sm font-semibold text-content-700">
            {{ 'adminUserEdit.coach' | translate }}
          </label>

          <app-coach-select
            [selectedCoachId]="selectedCoach?.id"
            (coachSelected)="onCoachSelected($event)"
          >
          </app-coach-select>
        </div>

        <!-- Szerepkörök -->
        <div class="min-w-0">
          <mat-form-field appearance="fill" class="w-full">
            <mat-label>
              {{ 'adminUserEdit.roles' | translate }}
            </mat-label>

            <mat-select
              multiple
              [value]="selectedRoles"
              (selectionChange)="onRoleSelected($event.value)"
            >
              <mat-option *ngFor="let role of roles; trackBy: trackByRole" [value]="role">
                {{ role.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Mentés -->
        <div class="flex min-w-0 sm:col-span-2 sm:justify-end">
          <app-button
            variant="save"
            type="submit"
            [label]="'common.save' | translate"
            [disabled]="!ready || saving || !selectedUser.id"
          ></app-button>
        </div>
      </form>
    </fieldset>
  </div>
</div>
