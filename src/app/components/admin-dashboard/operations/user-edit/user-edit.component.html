<!-- Üzenet -->
<div
  *ngIf="message"
  class="message-box"
  [ngClass]="{
    'message-success': message.includes('sikeresen'),
    'message-error': message.includes('Hiba')
  }">
  {{ message }}
</div>

<div class="user-edit-container">

  <h2 class="user-edit-title">Felhasználó módosítása</h2>

  <!-- Felhasználó kiválasztása -->
  <div class="user-select-container">
    <app-user-select
      [(selectedUserId)]="selectedUserId"
      (userSelected)="onUserSelected($event)">
    </app-user-select>
  </div>

  <!-- Form -->
  <form
    (ngSubmit)="onSave()"
    class="user-edit-form">

    <div class="form-group">
      <label class="form-label">Username</label>

      <input
        type="text"
        [(ngModel)]="selectedUser.username"
        name="username"
        class="form-input">
    </div>

    <div class="form-group">
      <label class="form-label">Email</label>

      <input
        type="email"
        [(ngModel)]="selectedUser.email"
        name="email"
        class="form-input">
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>

      <input
        type="password"
        [(ngModel)]="selectedUser.password"
        name="password"
        placeholder="Új jelszó"
        class="form-input">
    </div>

    <!-- Életkor / testsúly / magasság -->
    <div class="physical-data-grid">

      <div class="form-group">
        <label class="form-label">Age</label>

        <input
          type="number"
          [(ngModel)]="selectedUser.age"
          name="age"
          class="form-input">
      </div>

      <div class="form-group">
        <label class="form-label">Weight</label>

        <input
          type="number"
          step="0.01"
          [(ngModel)]="selectedUser.weight"
          name="weight"
          class="form-input">
      </div>

      <div class="form-group">
        <label class="form-label">Height</label>

        <input
          type="number"
          step="0.01"
          [(ngModel)]="selectedUser.height"
          name="height"
          class="form-input">
      </div>

    </div>

    <div class="form-group">
      <label class="form-label">Gender</label>

      <input
        type="text"
        [(ngModel)]="selectedUser.gender"
        name="gender"
        class="form-input">
    </div>

    <div class="form-group">
      <label class="form-label">Goals</label>

      <textarea
        [(ngModel)]="selectedUser.goals"
        name="goals"
        class="form-input form-textarea">
      </textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Avatar URL</label>

      <input
        type="text"
        [(ngModel)]="selectedUser.avatarUrl"
        name="avatarUrl"
        class="form-input">
    </div>

    <!-- Coach -->
    <div class="form-group">
      <label class="form-label">Coach</label>

      <app-coach-select
        [selectedCoachId]="selectedCoach?.id"
        (coachSelected)="onCoachSelected($event)">
      </app-coach-select>
    </div>

    <!-- Roles -->
    <mat-form-field
      appearance="fill"
      class="roles-field">

      <mat-label>Roles</mat-label>

      <mat-select
        multiple
        [value]="selectedRoles"
        (selectionChange)="onRoleSelected($event.value)">

        <mat-option
          *ngFor="let role of roles"
          [value]="role">

          {{ role.name }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <!-- Mentés -->
    <div class="save-container">

      <button
        type="submit"
        class="save-button">

        Mentés

      </button>

    </div>

  </form>

</div>
