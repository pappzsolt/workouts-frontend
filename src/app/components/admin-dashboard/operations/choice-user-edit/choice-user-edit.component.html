<div class="min-h-full min-w-0 bg-transparent px-4 py-6 sm:px-6 lg:px-8">
  <div class="mx-auto flex w-full max-w-5xl min-w-0 flex-col gap-6">
    <!-- Cím -->
    <div class="text-center">
      <h2 appHeading="page" class="break-words">
        {{ 'adminChoiceEdit.title' | translate }}
      </h2>
    </div>

    <!-- Üzenet -->
    <app-message *ngIf="message" [message]="message" [type]="messageType"> </app-message>

    <!-- Választási lehetőségek -->
    <div class="grid min-w-0 grid-cols-1 gap-5 sm:grid-cols-2">
      <!-- Edit Coach -->
      <app-dashboard-action
        label="adminChoiceEdit.editCoach"
        icon="barbell"
        tone="edit"
        (activated)="navigateTo('admin/coach/edit')"
      ></app-dashboard-action>

      <!-- Edit User -->
      <app-dashboard-action
        label="adminChoiceEdit.editUser"
        icon="users-three"
        tone="edit"
        (activated)="navigateTo('admin/users/edit')"
      ></app-dashboard-action>
    </div>
  </div>
</div>
