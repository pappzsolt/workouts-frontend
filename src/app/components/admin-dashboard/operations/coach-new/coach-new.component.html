<div class="coach-new">

  <h2 class="coach-new__title">
    Új Edző
  </h2>

  <form
    #coachForm="ngForm"
    (ngSubmit)="onSubmit(coachForm)"
    class="coach-form"
  >

    <!-- Név -->
    <div class="form-field">

      <label for="name">
        Név*
      </label>

      <input
        id="name"
        name="name"
        type="text"
        [(ngModel)]="coach.name"
        required
        #nameModel="ngModel"
      />

      <div
        *ngIf="nameModel.invalid && (nameModel.dirty || nameModel.touched)"
        class="validation-error"
      >
        Név megadása kötelező
      </div>

    </div>


    <!-- Email -->
    <div class="form-field">

      <label for="email">
        Email*
      </label>

      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="coach.email"
        required
        email
        #emailModel="ngModel"
      />

      <div
        *ngIf="emailModel.invalid && (emailModel.dirty || emailModel.touched)"
        class="validation-error"
      >
        Érvényes email cím szükséges
      </div>

    </div>


    <!-- Jelszó -->
    <div class="form-field">

      <label for="passwordHash">
        Jelszó*
      </label>

      <input
        id="passwordHash"
        name="passwordHash"
        type="password"
        [(ngModel)]="coach.passwordHash"
        required
        minlength="6"
        #passwordModel="ngModel"
      />

      <div
        *ngIf="passwordModel.invalid && (passwordModel.dirty || passwordModel.touched)"
        class="validation-error"
      >
        Minimum 6 karakter
      </div>

    </div>


    <!-- Telefon -->
    <div class="form-field">

      <label for="phone">
        Telefon*
      </label>

      <input
        id="phone"
        name="phone"
        type="text"
        [(ngModel)]="coach.phone"
        required
        pattern="^\+36\d{9}$"
        #phoneModel="ngModel"
      />

      <div
        *ngIf="phoneModel.invalid && (phoneModel.dirty || phoneModel.touched)"
        class="validation-error"
      >
        Érvényes magyar telefonszám szükséges (+36xxxxxxxxx)
      </div>

    </div>


    <!-- Szakterület -->
    <div class="form-field form-field--full">

      <label for="specialization">
        Szakterület
      </label>

      <textarea
        id="specialization"
        name="specialization"
        rows="3"
        placeholder="Szakterület"
        [(ngModel)]="coach.specialization"
      ></textarea>

    </div>


    <!-- Avatar URL -->
    <div class="form-field form-field--full">

      <label for="avatarUrl">
        Avatar URL
      </label>

      <input
        id="avatarUrl"
        name="avatarUrl"
        type="text"
        [(ngModel)]="coach.avatarUrl"
      />

    </div>


    <!-- Submit -->
    <div class="form-actions">

      <button
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Mentés...' : 'Edző létrehozása' }}
      </button>

    </div>

  </form>


  <!-- Üzenet -->
  <div
    *ngIf="message"
    [class.error-message]="isError"
    [class.success-message]="!isError"
    class="form-message"
  >
    {{ message }}
  </div>

</div>
