<div class="coach-new">
  <h2 class="coach-new__title">
    {{ 'adminCoachNew.title' | translate }}
  </h2>

  <form
    #coachForm="ngForm"
    (ngSubmit)="onSubmit(coachForm)"
    class="coach-form"
  >
    <!-- Név -->
    <div class="form-field">
      <label for="name">
        {{ 'common.name' | translate }}*
      </label>

      <input
        id="name"
        name="name"
        type="text"
        [(ngModel)]="coach.name"
        required
        #nameModel="ngModel"
      />

      <div
        *ngIf="nameModel.invalid && (nameModel.dirty || nameModel.touched)"
        class="validation-error"
      >
        {{ 'adminCoachNew.nameRequired' | translate }}
      </div>
    </div>

    <!-- Email -->
    <div class="form-field">
      <label for="email">
        {{ 'common.email' | translate }}*
      </label>

      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="coach.email"
        required
        email
        #emailModel="ngModel"
      />

      <div
        *ngIf="emailModel.invalid && (emailModel.dirty || emailModel.touched)"
        class="validation-error"
      >
        {{ 'adminCoachNew.validEmailRequired' | translate }}
      </div>
    </div>

    <!-- Jelszó -->
    <div class="form-field">
      <label for="passwordHash">
        {{ 'common.password' | translate }}*
      </label>

      <input
        id="passwordHash"
        name="passwordHash"
        type="password"
        [(ngModel)]="coach.passwordHash"
        required
        minlength="6"
        #passwordModel="ngModel"
      />

      <div
        *ngIf="
          passwordModel.invalid &&
          (passwordModel.dirty || passwordModel.touched)
        "
        class="validation-error"
      >
        {{ 'adminCoachNew.minimumSixCharacters' | translate }}
      </div>
    </div>

    <!-- Telefon -->
    <div class="form-field">
      <label for="phone">
        {{ 'common.phone' | translate }}*
      </label>

      <input
        id="phone"
        name="phone"
        type="text"
        [(ngModel)]="coach.phone"
        required
        pattern="^\+36\d{9}$"
        #phoneModel="ngModel"
      />

      <div
        *ngIf="phoneModel.invalid && (phoneModel.dirty || phoneModel.touched)"
        class="validation-error"
      >
        {{ 'adminCoachNew.validHungarianPhoneRequired' | translate }}
      </div>
    </div>

    <!-- Szakterület -->
    <div class="form-field form-field--full">
      <label for="specialization">
        {{ 'adminCoachNew.specialization' | translate }}
      </label>

      <textarea
        id="specialization"
        name="specialization"
        rows="3"
        [placeholder]="'adminCoachNew.specialization' | translate"
        [(ngModel)]="coach.specialization"
      ></textarea>
    </div>

    <!-- Avatar URL -->
    <div class="form-field form-field--full">
      <label for="avatarUrl">
        {{ 'adminCoachNew.avatarUrl' | translate }}
      </label>

      <input
        id="avatarUrl"
        name="avatarUrl"
        type="text"
        [placeholder]="'adminCoachNew.avatarImageUrl' | translate"
        [(ngModel)]="coach.avatarUrl"
      />
    </div>

    <!-- Submit -->
    <div class="form-actions">
      <button type="submit" [disabled]="loading">
        {{
          loading
            ? ('common.saving' | translate)
            : ('adminCoachNew.createCoach' | translate)
        }}
      </button>
    </div>
  </form>

  <!-- Üzenet -->
  <div
    *ngIf="message"
    [class.error-message]="isError"
    [class.success-message]="!isError"
    class="form-message"
  >
    {{ message }}
  </div>
</div>
