<div
  class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/40 to-indigo-50/50 px-4 py-6 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-7xl flex-col gap-6">

    <!-- Oldal címe -->
    <div class="text-center">
      <h2 class="text-2xl font-bold tracking-tight text-slate-800 sm:text-3xl">
        {{ 'coachDashboard.title' | translate }}
      </h2>
    </div>

    <!-- Dashboard kártyák -->
    <div
      class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
    >

      <!-- Programs -->
      <button
        type="button"
        (click)="togglePrograms()"
        class="group flex min-h-36 flex-col items-center justify-center rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-blue-200 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500/20"
      >
        <div
          class="mb-3 flex h-14 w-14 items-center justify-center rounded-xl bg-gradient-to-br from-blue-500 to-primary-700 text-2xl shadow-sm transition-transform duration-200 group-hover:scale-105"
        >
          💪
        </div>

        <div class="text-base font-semibold text-slate-800">
          {{ 'coachDashboard.programs' | translate }}
        </div>
      </button>

      <!-- Workouts -->
      <button
        type="button"
        (click)="toggleWorkouts()"
        class="group flex min-h-36 flex-col items-center justify-center rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-blue-200 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500/20"
      >
        <div
          class="mb-3 flex h-14 w-14 items-center justify-center rounded-xl bg-gradient-to-br from-blue-500 to-primary-700 text-2xl shadow-sm transition-transform duration-200 group-hover:scale-105"
        >
          🔥
        </div>

        <div class="text-base font-semibold text-slate-800">
          {{ 'coachDashboard.workouts' | translate }}
        </div>
      </button>

      <!-- Exercises -->
      <button
        type="button"
        (click)="toggleExercises()"
        class="group flex min-h-36 flex-col items-center justify-center rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-blue-200 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500/20"
      >
        <div
          class="mb-3 flex h-14 w-14 items-center justify-center rounded-xl bg-gradient-to-br from-blue-500 to-primary-700 text-2xl shadow-sm transition-transform duration-200 group-hover:scale-105"
        >
          🏋️
        </div>

        <div class="text-base font-semibold text-slate-800">
          {{ 'coachDashboard.exercises' | translate }}
        </div>
      </button>

      <!-- Workout → Exercise hozzárendelés -->
      <button
        type="button"
        (click)="toggleWorkoutExercises()"
        class="group flex min-h-36 flex-col items-center justify-center rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-blue-200 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500/20"
      >
        <div
          class="mb-3 flex h-14 w-14 items-center justify-center rounded-xl bg-gradient-to-br from-blue-500 to-primary-700 text-2xl shadow-sm transition-transform duration-200 group-hover:scale-105"
        >
          🔗🏋️
        </div>

        <div class="text-base font-semibold text-slate-800">
          {{ 'coachDashboard.assignWorkoutExercises' | translate }}
        </div>
      </button>

      <!-- Workout Exercise Manager -->
      <button
        type="button"
        (click)="toggleWorkoutExerciseManager()"
        class="group flex min-h-36 flex-col items-center justify-center rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-blue-200 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500/20"
      >
        <div
          class="mb-3 flex h-14 w-14 items-center justify-center rounded-xl bg-gradient-to-br from-blue-500 to-primary-700 text-2xl shadow-sm transition-transform duration-200 group-hover:scale-105"
        >
          📊🏋️
        </div>

        <div class="text-base font-semibold text-slate-800">
          {{ 'coachDashboard.workoutExerciseManager' | translate }}
        </div>
      </button>

    </div>

    <!-- Dinamikus tartalom -->

    <!-- Programs -->
    <div
      *ngIf="showPrograms"
      class="min-w-0 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
    >
      <div class="min-w-0 p-4 sm:p-6">
        <app-coach-program></app-coach-program>
      </div>
    </div>

    <!-- Workouts -->
    <div
      *ngIf="showWorkouts"
      class="min-w-0 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
    >
      <div class="min-w-0 p-4 sm:p-6">
        <app-coach-workouts
          [programId]="programIdForWorkouts"
        >
        </app-coach-workouts>
      </div>
    </div>

    <!-- Exercises -->
    <div
      *ngIf="showExercises"
      class="min-w-0 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
    >
      <div class="min-w-0 p-4 sm:p-6">

        <div
          *ngIf="exerciseNotFound"
          class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700"
        >
          {{ 'coachDashboard.exerciseNotFound' | translate }}
        </div>

        <app-exercise-controller></app-exercise-controller>
      </div>
    </div>

    <!-- Workout → Exercise -->
    <div
      *ngIf="showWorkoutExercises"
      class="min-w-0 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
    >
      <div class="min-w-0 p-4 sm:p-6">
        <app-assign-workouts-exercises>
        </app-assign-workouts-exercises>
      </div>
    </div>

    <!-- Workout Exercise Manager -->
    <div
      *ngIf="showWorkoutExerciseManager"
      class="min-w-0 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
    >
      <div class="min-w-0 p-4 sm:p-6">
        <app-user-workout-exercise-manager>
        </app-user-workout-exercise-manager>
      </div>
    </div>

  </div>
</div>
