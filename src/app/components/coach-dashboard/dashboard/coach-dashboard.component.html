<h2 class="dashboard-title">
  {{ 'coachDashboard.title' | translate }}
</h2>

<div class="dashboard-cards-container">
  <!-- Programs -->
  <div class="dashboard-card" (click)="togglePrograms()">
    <div class="dashboard-card-emoji">💪</div>
    <div class="dashboard-card-title">
      {{ 'coachDashboard.programs' | translate }}
    </div>
  </div>

  <!-- Workouts -->
  <div class="dashboard-card" (click)="toggleWorkouts()">
    <div class="dashboard-card-emoji">🔥</div>
    <div class="dashboard-card-title">
      {{ 'coachDashboard.workouts' | translate }}
    </div>
  </div>

  <!-- Exercises -->
  <div class="dashboard-card" (click)="toggleExercises()">
    <div class="dashboard-card-emoji">🏋️</div>
    <div class="dashboard-card-title">
      {{ 'coachDashboard.exercises' | translate }}
    </div>
  </div>

  <!-- Workout Exercise Manager -->
  <div
    class="dashboard-card"
    (click)="toggleWorkoutExerciseManager()"
  >
    <div class="dashboard-card-emoji">📊🏋️</div>
    <div class="dashboard-card-title">
      {{ 'coachDashboard.workoutExerciseManager' | translate }}
    </div>
  </div>
</div>

<!-- Dinamikus tartalmak -->

<div *ngIf="showPrograms">
  <app-coach-program></app-coach-program>
</div>

<div *ngIf="showWorkouts">
  <app-coach-workouts
    [programId]="programIdForWorkouts"
  >
  </app-coach-workouts>
</div>

<div *ngIf="showExercises">
  <app-exercise-controller></app-exercise-controller>
</div>

<div *ngIf="showWorkoutExerciseManager">
  <app-user-workout-exercise-manager></app-user-workout-exercise-manager>
</div>
