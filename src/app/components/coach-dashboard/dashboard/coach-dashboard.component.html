<div
  class="min-h-full bg-surface-50 px-4 py-6 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-7xl flex-col gap-6">

    <!-- Oldal címe -->
    <div class="text-center">
      <h2 class="text-2xl font-bold tracking-tight text-content-800 sm:text-3xl">
        {{ 'coachDashboard.title' | translate }}
      </h2>
    </div>

    <!-- Dashboard kártyák -->
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">

      <app-dashboard-action
        icon="dumbbell"
        label="coachDashboard.programs"
        (activated)="togglePrograms()"
      ></app-dashboard-action>

      <app-dashboard-action
        icon="flame"
        label="coachDashboard.workouts"
        (activated)="toggleWorkouts()"
      ></app-dashboard-action>

      <app-dashboard-action
        icon="dumbbell"
        label="coachDashboard.exercises"
        (activated)="toggleExercises()"
      ></app-dashboard-action>

      <app-dashboard-action
        icon="link"
        label="coachDashboard.assignWorkoutExercises"
        (activated)="toggleWorkoutExercises()"
      ></app-dashboard-action>

      <app-dashboard-action
        icon="chart-column-increasing"
        label="coachDashboard.workoutExerciseManager"
        (activated)="toggleWorkoutExerciseManager()"
      ></app-dashboard-action>

    </div>

    <!-- Dinamikus tartalom -->

    <!-- Programs -->
    <div
      *ngIf="showPrograms"
      class="min-w-0 overflow-hidden rounded-2xl border border-surface-200 bg-white shadow-sm"
    >
      <div class="min-w-0 p-4 sm:p-6">
        <app-coach-program></app-coach-program>
      </div>
    </div>

    <!-- Workouts -->
    <div
      *ngIf="showWorkouts"
      class="min-w-0 overflow-hidden rounded-2xl border border-surface-200 bg-white shadow-sm"
    >
      <div class="min-w-0 p-4 sm:p-6">
        <app-coach-workouts
          [programId]="programIdForWorkouts"
        >
        </app-coach-workouts>
      </div>
    </div>

    <!-- Exercises -->
    <div
      *ngIf="showExercises"
      class="min-w-0 overflow-hidden rounded-2xl border border-surface-200 bg-white shadow-sm"
    >
      <div class="min-w-0 p-4 sm:p-6">

        <app-message
          *ngIf="exerciseNotFound"
          [message]="'coachDashboard.exerciseNotFound' | translate"
          type="error"
          class="mb-4 block"
        ></app-message>

        <app-exercise-controller></app-exercise-controller>
      </div>
    </div>

    <!-- Workout → Exercise -->
    <div
      *ngIf="showWorkoutExercises"
      class="min-w-0 overflow-hidden rounded-2xl border border-surface-200 bg-white shadow-sm"
    >
      <div class="min-w-0 p-4 sm:p-6">
        <app-assign-workouts-exercises>
        </app-assign-workouts-exercises>
      </div>
    </div>

    <!-- Workout Exercise Manager -->
    <div
      *ngIf="showWorkoutExerciseManager"
      class="min-w-0 overflow-hidden rounded-2xl border border-surface-200 bg-white shadow-sm"
    >
      <div class="min-w-0 p-4 sm:p-6">
        <app-user-workout-exercise-manager>
        </app-user-workout-exercise-manager>
      </div>
    </div>

  </div>
</div>
