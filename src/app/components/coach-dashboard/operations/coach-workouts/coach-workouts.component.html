<!-- ======================================================
     OLDAL
     ====================================================== -->

<div class="min-h-full min-w-0 bg-transparent px-4 py-6 sm:px-6 lg:px-8">
  <div class="mx-auto flex w-full max-w-7xl min-w-0 flex-col gap-6">
    <!-- ======================================================
         ÜZENET
         ====================================================== -->

    @if (message) {
      <app-message [message]="message" [type]="messageType"></app-message>
    }

    <!-- ======================================================
         CÍM
         ====================================================== -->

    <h2 appHeading="page" class="text-center">
      {{ 'coachWorkouts.title' | translate }}
    </h2>

    <!-- ======================================================
         KERESÉS ÉS RENDEZÉS
         ====================================================== -->

    <div
      class="flex flex-col gap-4 rounded-2xl border border-surface-200 bg-white p-4 shadow-sm sm:p-5 lg:flex-row lg:items-end"
    >
      <!-- KERESÉS KOMPONENS -->

      <div class="min-w-0 flex-1">
        <app-search
          inputId="workoutSearch"
          [searchTerm]="searchTerm"
          label="coachWorkouts.search"
          placeholder="coachWorkouts.searchPlaceholder"
          (searchTermChange)="searchTerm = $event; onSearchChange()"
        ></app-search>
      </div>

      <!-- RENDEZÉS -->

      <app-button
        variant="sort"
        [label]="(sortMode === 'newest' ? 'coachWorkouts.sortNewest' : 'coachWorkouts.sortByName') | translate"
        [lucideIcon]="sortMode === 'nameDesc' ? 'arrow-down-wide-narrow' : 'arrow-up-narrow-wide'"
        (buttonClick)="toggleSort()"
      ></app-button>
    </div>

    <!-- ======================================================
         ÚJ EDZÉS FORM
         ====================================================== -->

    @if (showNewWorkoutForm) {
      <app-newworkout> </app-newworkout>
    }

    <!-- ======================================================
         EDZÉSEK
         ====================================================== -->

    <ng-container *ngIf="workouts.length > 0; else noWorkouts">
      <!-- ======================================================
           EDZÉSKÁRTYÁK
           ====================================================== -->

      <div class="grid min-w-0 grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
        <app-card
          *ngFor="let w of workouts; trackBy: trackByWorkout"
          class="group flex min-w-0 flex-col overflow-hidden"
        >
          <!-- ==================================================
               FEJLÉC
               ================================================== -->

          <app-card-banner icon="flame" />

          <!-- ==================================================
               TARTALOM
               ================================================== -->

          <div class="flex min-w-0 flex-1 flex-col p-5">
            <!-- WORKOUT NÉV -->

            <h3 class="mb-2 break-words text-lg font-bold text-content-800">
              {{ w.name }}
            </h3>

            @if (w.programNames?.length) {
              <div class="mb-3 text-sm text-content-600">
                <span class="font-semibold">{{ 'coachWorkouts.programLabel' | translate }}</span>
                <span class="ml-1 break-words">{{ w.programNames?.join(', ') }}</span>
              </div>
            }

            <!-- LEÍRÁS -->

            @if (w.description) {
              <p class="mb-4 line-clamp-3 break-words text-sm leading-6 text-content-600">
                {{ w.description }}
              </p>
            }

            <!-- ==================================================
                 WORKOUT ADATOK
                 ================================================== -->

            <div class="mt-auto grid grid-cols-2 gap-3 border-t border-surface-100 pt-4">
              <app-card-stat
                [label]="'coachWorkouts.duration' | translate"
                [value]="w.durationMinutes"
                [unit]="'common.minutes' | translate"
              />

              <app-card-stat
                [label]="'coachWorkouts.exercises' | translate"
                [value]="w.exercises.length"
              />
            </div>

            <!-- ==================================================
                 NINCS GYAKORLAT
                 ================================================== -->

            @if (!w.exercises.length) {
              <div class="mt-4">
                <app-message
                  [message]="'coachWorkouts.noExercisesAssigned'"
                  type="info"
                ></app-message>
              </div>
            }

            <!-- ==================================================
                 SZERKESZTÉS
                 ================================================== -->

            <div class="mt-4 flex flex-wrap gap-2">
              <app-button
                variant="primary"
                [label]="'common.edit' | translate"
                [lucideIcon]="'pencil'"
                (buttonClick)="editWorkout(w.id, $event)"
              ></app-button>

              <app-button
                variant="delete"
                [label]="'userWorkoutExerciseManager.delete' | translate"
                [lucideIcon]="'trash-2'"
                [disabled]="deletingWorkout"
                (buttonClick)="requestDeleteWorkout(w, $event)"
              ></app-button>
            </div>
          </div>
        </app-card>
      </div>

      <!-- ======================================================
           LAPOZÁS KOMPONENS
           ====================================================== -->

      <app-pagination
        [totalItems]="totalItems"
        [pageSize]="itemsPerPage"
        [currentPage]="currentPage"
        [showPageSize]="false"
        [showInfo]="false"
        (pageChange)="onPageChange($event)"
      ></app-pagination>
    </ng-container>

    <!-- ======================================================
         NINCS EDZÉS / NINCS TALÁLAT
         ====================================================== -->

    <ng-template #noWorkouts>
      <app-message
        *ngIf="!loading"
        [message]="searchTerm ? 'coachWorkouts.noSearchResults' : 'coachWorkouts.noWorkouts'"
        type="info"
      ></app-message>
    </ng-template>
  </div>

  <!-- ======================================================
       ÚJ EDZÉS
       ====================================================== -->

  <app-button
    variant="add"
    [floating]="true"
    [lucideIcon]="'circle-plus'"
    [title]="'coachWorkouts.addWorkout' | translate"
    (buttonClick)="goToNewWorkout()"
  ></app-button>
</div>
<!-- ======================================================
     WORKOUT TÖRLÉS MEGERŐSÍTÉSE
     ====================================================== -->

<app-confirm-dialog
  [open]="pendingDeleteWorkoutId !== null"
  [busy]="deletingWorkout"
  [message]="deleteWorkoutConfirmMessage"
  [messageParams]="{ name: pendingDeleteWorkoutName.trim() }"
  confirmLabel="userWorkoutExerciseManager.delete"
  (confirmed)="confirmDeleteWorkout()"
  (cancelled)="cancelDeleteWorkout()"
></app-confirm-dialog>
