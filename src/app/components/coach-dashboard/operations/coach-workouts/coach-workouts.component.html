<div class="workouts-container">

  <!-- ======================================================
       ÜZENET
       ====================================================== -->

  <div
    *ngIf="message"
    [ngClass]="{
      'message-success': messageType === 'success',
      'error-message': messageType === 'error'
    }">

    {{ message }}

  </div>


  <!-- ======================================================
       CÍM
       ====================================================== -->

  <h2 class="workouts-title">
    Edzések
  </h2>


  <!-- ======================================================
       KERESÉS ÉS RENDEZÉS
       ====================================================== -->

  <div class="workout-controls">

    <!-- ====================================================
         KERESÉS
         ==================================================== -->

    <div class="workout-search">

      <label
        for="workoutSearch"
        class="workout-search-label">

        Workout keresése

      </label>

      <input
        id="workoutSearch"
        type="text"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange()"
        class="workout-search-input"
        placeholder="Workout neve..."
        autocomplete="off"
      />

    </div>


    <!-- ====================================================
         RENDEZÉS
         ==================================================== -->

    <button
      type="button"
      class="workout-sort-button"
      (click)="toggleSort()">

      Workout neve

      <span class="sort-icon">
        {{ sortDirection === 'asc' ? '↑' : '↓' }}
      </span>

    </button>

  </div>


  <!-- ======================================================
       ÚJ EDZÉS FORM
       ====================================================== -->

  <app-newworkout
    *ngIf="showNewWorkoutForm">
  </app-newworkout>


  <!-- ======================================================
       EDZÉSEK
       ====================================================== -->

  <ng-container
    *ngIf="
      filteredWorkouts.length > 0;
      else noWorkouts
    ">

    <div class="workouts-grid">

      <div
        *ngFor="let w of pagedWorkouts"
        class="workout-card">


        <!-- ==================================================
             FEJLÉC
             ================================================== -->

        <div class="workout-image">

          <span class="workout-emoji">
            🔥
          </span>

        </div>


        <!-- ==================================================
             TARTALOM
             ================================================== -->

        <div class="workout-content">


          <!-- WORKOUT NÉV -->

          <h3 class="workout-name">
            {{ w.workoutName }}
          </h3>


          <!-- LEÍRÁS -->

          <p
            *ngIf="w.description"
            class="workout-description">

            {{ w.description }}

          </p>


          <!-- ==================================================
               WORKOUT ADATOK
               ================================================== -->

          <div class="workout-meta">


            <!-- IDŐTARTAM -->

            <div class="workout-meta-item">

              <span class="workout-meta-label">
                Időtartam
              </span>

              <span class="workout-meta-value">
                {{ w.durationMinutes }} perc
              </span>

            </div>


            <!-- GYAKORLATOK -->

            <div class="workout-meta-item">

              <span class="workout-meta-label">
                Gyakorlatok
              </span>

              <span class="workout-meta-value">
                {{ w.exercises?.length || 0 }}
              </span>

            </div>

          </div>


          <!-- ==================================================
               NINCS GYAKORLAT
               ================================================== -->

          <div
            *ngIf="!w.exercises?.length"
            class="no-exercises">

            Nincs gyakorlat hozzárendelve.

          </div>


          <!-- ==================================================
               SZERKESZTÉS
               ================================================== -->

          <div class="workout-edit">

            <button
              type="button"
              class="edit-button"
              (click)="editWorkout(w.id, $event)">

              ✏️ Szerkesztés

            </button>

          </div>

        </div>

      </div>

    </div>


    <!-- ======================================================
         LAPOZÁS
         ====================================================== -->

    <div
      *ngIf="totalPages > 1"
      class="pagination-controls">

      <button
        type="button"
        class="pagination-button"
        (click)="prevPage()"
        [disabled]="currentPage === 1">

        ◀ Előző

      </button>


      <span class="pagination-info">

        {{ currentPage }} / {{ totalPages }}

      </span>


      <button
        type="button"
        class="pagination-button"
        (click)="nextPage()"
        [disabled]="currentPage === totalPages">

        Következő ▶

      </button>

    </div>

  </ng-container>


  <!-- ======================================================
       NINCS EDZÉS / NINCS TALÁLAT
       ====================================================== -->

  <ng-template #noWorkouts>

    <div class="no-workouts">

      <span
        *ngIf="
          searchTerm;
          else noWorkoutsAtAll
        ">

        Nincs a keresésnek megfelelő workout.

      </span>


      <ng-template #noWorkoutsAtAll>

        Nincsenek edzések.

      </ng-template>

    </div>

  </ng-template>


  <!-- ======================================================
       ÚJ EDZÉS
       ====================================================== -->

  <button
    type="button"
    class="floating-action-button"
    (click)="goToNewWorkout()"
    title="Új edzés hozzáadása">

    ➕

  </button>

</div>
