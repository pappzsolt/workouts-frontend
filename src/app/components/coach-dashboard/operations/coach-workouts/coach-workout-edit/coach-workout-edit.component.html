<h2 class="universal-form-title">
  🏋️ Edit Workout
</h2>

<!-- Üzenet -->
<div
  *ngIf="message"
  class="universal-form-message"
  [ngClass]="{
    'universal-form-message-success': messageType === 'success',
    'universal-form-message-error': messageType === 'error'
  }"
>
  {{ message }}
</div>

<!-- Workout Edit form -->
<div class="form-card">

  <div class="form-header">
    <span class="form-header-emoji">💪</span>
  </div>

  <form
    (ngSubmit)="saveWorkout()"
    #workoutForm="ngForm"
    class="universal-form"
  >

    <!-- Name -->
    <div class="universal-form-group-full">
      <label
        for="workoutName"
        class="universal-form-label"
      >
        Workout Name
      </label>

      <input
        id="workoutName"
        type="text"
        name="name"
        [(ngModel)]="workout.name"
        required
        class="universal-form-input"
      />
    </div>

    <!-- Description -->
    <div class="universal-form-group-full">
      <label
        for="description"
        class="universal-form-label"
      >
        Description
      </label>

      <textarea
        id="description"
        name="description"
        rows="3"
        [(ngModel)]="workout.description"
        class="universal-form-textarea"
      ></textarea>
    </div>

    <!-- Date -->
    <div class="universal-form-group">
      <label
        for="workoutDate"
        class="universal-form-label"
      >
        Workout Date
      </label>

      <input
        id="workoutDate"
        type="date"
        name="workoutDate"
        [(ngModel)]="workout.workoutDate"
        required
        class="universal-form-input"
      />
    </div>

    <!-- Duration -->
    <div class="universal-form-group">
      <label
        for="durationMinutes"
        class="universal-form-label"
      >
        Duration (minutes)
      </label>

      <input
        id="durationMinutes"
        type="number"
        name="durationMinutes"
        [(ngModel)]="workout.durationMinutes"
        min="0"
        class="universal-form-input"
      />
    </div>

    <!-- Intensity -->
    <div class="universal-form-group">
      <label
        for="intensityLevel"
        class="universal-form-label"
      >
        Intensity Level
      </label>

      <select
        id="intensityLevel"
        name="intensityLevel"
        [(ngModel)]="workout.intensityLevel"
        class="universal-form-select"
      >
        <option value="">-- Select Intensity --</option>
        <option value="low">Low</option>
        <option value="moderate">Moderate</option>
        <option value="high">High</option>
      </select>
    </div>

    <!-- Done -->
    <div class="universal-form-group checkbox-group">
      <input
        type="checkbox"
        name="done"
        id="done"
        [(ngModel)]="workout.done"
        class="form-checkbox"
      />

      <label
        for="done"
        class="universal-form-label checkbox-label"
      >
        Workout Completed
      </label>
    </div>

    <!-- Buttons -->
    <div class="form-buttons">

      <button
        type="submit"
        [disabled]="!workoutForm.form.valid"
        class="universal-form-button"
      >
        💾 Save
      </button>

      <button
        type="button"
        (click)="cancelEdit()"
        class="cancel-button"
      >
        ❌ Cancel
      </button>

    </div>

  </form>
</div>
