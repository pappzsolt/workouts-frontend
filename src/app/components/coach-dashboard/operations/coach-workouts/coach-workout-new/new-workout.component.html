<h2 class="universal-form-title">
  ➕ {{ 'newWorkout.title' | translate }}
</h2>

<!-- Üzenet -->
<div
  *ngIf="message"
  class="universal-form-message"
  [ngClass]="{
    'universal-form-message-success': messageType === 'success',
    'universal-form-message-error': messageType === 'error',
  }"
>
  {{ message | translate }}
</div>

<!-- Workout form kártya -->
<div class="form-card">
  <div class="form-header">
    <span class="form-header-emoji">🏋️‍♂️</span>
  </div>

  <form
    (ngSubmit)="addWorkout()"
    #workoutForm="ngForm"
    class="universal-form"
  >
    <!-- Workout név -->
    <div class="universal-form-group-full">
      <label
        for="workoutName"
        class="universal-form-label"
      >
        {{ 'newWorkout.workoutName' | translate }}
      </label>

      <input
        type="text"
        id="workoutName"
        name="name"
        [(ngModel)]="newWorkout.name"
        required
        class="universal-form-input"
      />
    </div>

    <!-- Leírás -->
    <div class="universal-form-group-full">
      <label
        for="description"
        class="universal-form-label"
      >
        {{ 'newWorkout.description' | translate }}
      </label>

      <textarea
        id="description"
        name="description"
        rows="3"
        [(ngModel)]="newWorkout.description"
        class="universal-form-textarea"
      ></textarea>
    </div>

    <!-- Dátum -->
    <div class="universal-form-group">
      <label
        for="workoutDate"
        class="universal-form-label"
      >
        {{ 'newWorkout.date' | translate }}
      </label>

      <input
        type="date"
        id="workoutDate"
        name="workoutDate"
        [(ngModel)]="newWorkout.workoutDate"
        required
        class="universal-form-input"
      />
    </div>

    <!-- Időtartam -->
    <div class="universal-form-group">
      <label
        for="durationMinutes"
        class="universal-form-label"
      >
        {{ 'newWorkout.duration' | translate }}
      </label>

      <input
        type="number"
        id="durationMinutes"
        name="durationMinutes"
        [(ngModel)]="newWorkout.durationMinutes"
        class="universal-form-input"
      />
    </div>

    <!-- Intenzitás -->
    <div class="universal-form-group">
      <label
        for="intensityLevel"
        class="universal-form-label"
      >
        {{ 'newWorkout.intensityLevel' | translate }}
      </label>

      <select
        id="intensityLevel"
        name="intensityLevel"
        [(ngModel)]="newWorkout.intensityLevel"
        class="universal-form-select"
      >
        <option value="">
          {{ 'newWorkout.select' | translate }}
        </option>

        <option value="Low">
          {{ 'newWorkout.low' | translate }}
        </option>

        <option value="Medium">
          {{ 'newWorkout.medium' | translate }}
        </option>

        <option value="High">
          {{ 'newWorkout.high' | translate }}
        </option>
      </select>
    </div>

    <!-- Gomb -->
    <div class="universal-form-actions">
      <button
        type="submit"
        [disabled]="!workoutForm.form.valid"
        class="universal-form-button"
      >
        ➕ {{ 'newWorkout.createWorkout' | translate }}
      </button>
    </div>
  </form>
</div>
