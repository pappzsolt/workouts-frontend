<div
  class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/40 to-indigo-50/50 px-4 py-6 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-5xl min-w-0 flex-col gap-6">

    <!-- Cím -->
    <h2
      class="text-center text-2xl font-bold text-content-800 sm:text-3xl"
    >
      ➕ {{ 'newWorkout.title' | translate }}
    </h2>

    <!-- Üzenet -->
    <app-message
      *ngIf="message"
      [message]="message | translate"
      [type]="messageType"
    ></app-message>

    <!-- Workout form kártya -->
    <div
      class="min-w-0 overflow-hidden rounded-2xl border border-surface-200 bg-white shadow-sm"
    >

      <!-- Fejléc -->
      <div
        class="flex items-center justify-center bg-gradient-to-r from-primary-600 to-primary-700 px-4 py-5"
      >
        <span
          class="flex h-12 w-12 items-center justify-center rounded-full bg-white text-2xl shadow-md"
        >
          🏋️‍♂️
        </span>
      </div>

      <!-- Form -->
      <form
        (ngSubmit)="addWorkout()"
        #workoutForm="ngForm"
        class="grid grid-cols-1 gap-5 p-5 sm:grid-cols-2 sm:p-6"
      >

        <!-- Workout név -->
        <div class="min-w-0 sm:col-span-2">
          <label
            for="workoutName"
            class="mb-2 block text-sm font-semibold text-content-700"
          >
            {{ 'newWorkout.workoutName' | translate }}
          </label>

          <input
            type="text"
            id="workoutName"
            name="name"
            [(ngModel)]="newWorkout.name"
            required
            class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
          />
        </div>

        <!-- Leírás -->
        <div class="min-w-0 sm:col-span-2">
          <label
            for="description"
            class="mb-2 block text-sm font-semibold text-content-700"
          >
            {{ 'newWorkout.description' | translate }}
          </label>

          <textarea
            id="description"
            name="description"
            rows="3"
            [(ngModel)]="newWorkout.description"
            class="block w-full resize-y rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
          ></textarea>
        </div>

        <!-- Dátum -->
        <div class="min-w-0">
          <label
            for="workoutDate"
            class="mb-2 block text-sm font-semibold text-content-700"
          >
            {{ 'newWorkout.date' | translate }}
          </label>

          <input
            type="date"
            id="workoutDate"
            name="workoutDate"
            [(ngModel)]="newWorkout.workoutDate"
            required
            class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
          />
        </div>

        <!-- Időtartam -->
        <div class="min-w-0">
          <label
            for="durationMinutes"
            class="mb-2 block text-sm font-semibold text-content-700"
          >
            {{ 'newWorkout.duration' | translate }}
          </label>

          <input
            type="number"
            id="durationMinutes"
            name="durationMinutes"
            [(ngModel)]="newWorkout.durationMinutes"
            class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
          />
        </div>

        <!-- Intenzitás -->
        <div class="min-w-0 sm:col-span-2">
          <label
            for="intensityLevel"
            class="mb-2 block text-sm font-semibold text-content-700"
          >
            {{ 'newWorkout.intensityLevel' | translate }}
          </label>

          <select
            id="intensityLevel"
            name="intensityLevel"
            [(ngModel)]="newWorkout.intensityLevel"
            class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
          >
            <option value="">
              {{ 'newWorkout.select' | translate }}
            </option>

            <option value="Low">
              {{ 'newWorkout.low' | translate }}
            </option>

            <option value="Medium">
              {{ 'newWorkout.medium' | translate }}
            </option>

            <option value="High">
              {{ 'newWorkout.high' | translate }}
            </option>
          </select>
        </div>

        <!-- Gomb -->
        <div
          class="flex min-w-0 justify-end pt-1 sm:col-span-2"
        >
          <button
            type="submit"
            [disabled]="!workoutForm.form.valid"
            class="w-full rounded-lg bg-gradient-to-r from-save-600 to-save-700 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:from-save-700 hover:to-save-700 focus:outline-none focus:ring-4 focus:ring-save-200/50 disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto"
          >
            ➕ {{ 'newWorkout.createWorkout' | translate }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
