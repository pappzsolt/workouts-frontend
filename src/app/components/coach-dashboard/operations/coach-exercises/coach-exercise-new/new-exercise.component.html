<div class="form-card">
  <div class="form-header">
    <span class="form-header-emoji">💪</span>
  </div>

  <h2 class="universal-form-title">
    ➕ {{ 'newExercise.title' | translate }}
  </h2>

  <!-- Üzenet -->
  <div
    *ngIf="message"
    class="universal-form-message"
    [ngClass]="{
      'universal-form-message-success': messageType === 'success',
      'universal-form-message-error': messageType !== 'success',
    }"
  >
    {{ message }}
  </div>

  <!-- Form -->
  <form (ngSubmit)="addExercise()" #exerciseForm="ngForm" class="universal-form">
    <!-- Név -->
    <div class="universal-form-group-full">
      <label for="name" class="universal-form-label">
        {{ 'newExercise.name' | translate }}:
      </label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="newExercise.name"
        required
        class="universal-form-input"
      />
    </div>

    <!-- Leírás -->
    <div class="universal-form-group-full">
      <label for="description" class="universal-form-label">
        {{ 'newExercise.description' | translate }}:
      </label>
      <textarea
        id="description"
        name="description"
        [(ngModel)]="newExercise.description"
        rows="3"
        class="universal-form-textarea"
      ></textarea>
    </div>

    <!-- Kép URL -->
    <div class="universal-form-group">
      <label for="imageUrl" class="universal-form-label">
        {{ 'newExercise.imageUrl' | translate }}:
      </label>
      <input
        type="text"
        id="imageUrl"
        name="imageUrl"
        [(ngModel)]="newExercise.imageUrl"
        class="universal-form-input"
      />
    </div>

    <!-- Videó URL -->
    <div class="universal-form-group">
      <label for="videoUrl" class="universal-form-label">
        {{ 'newExercise.videoUrl' | translate }}:
      </label>
      <input
        type="text"
        id="videoUrl"
        name="videoUrl"
        [(ngModel)]="newExercise.videoUrl"
        class="universal-form-input"
      />
    </div>

    <!-- Izomcsoport -->
    <div class="universal-form-group">
      <label for="muscleGroup" class="universal-form-label">
        {{ 'newExercise.muscleGroup' | translate }}:
      </label>
      <input
        type="text"
        id="muscleGroup"
        name="muscleGroup"
        [(ngModel)]="newExercise.muscleGroup"
        class="universal-form-input"
      />
    </div>

    <!-- Eszköz -->
    <div class="universal-form-group">
      <label for="equipment" class="universal-form-label">
        {{ 'newExercise.equipment' | translate }}:
      </label>
      <input
        type="text"
        id="equipment"
        name="equipment"
        [(ngModel)]="newExercise.equipment"
        class="universal-form-input"
      />
    </div>

    <!-- Nehézség -->
    <div class="universal-form-group">
      <label for="difficultyLevel" class="universal-form-label">
        {{ 'newExercise.difficulty' | translate }}:
      </label>
      <select
        id="difficultyLevel"
        name="difficultyLevel"
        [(ngModel)]="newExercise.difficultyLevel"
        class="universal-form-select"
      >
        <option value="easy">{{ 'newExercise.easy' | translate }}</option>
        <option value="medium">{{ 'newExercise.medium' | translate }}</option>
        <option value="hard">{{ 'newExercise.hard' | translate }}</option>
      </select>
    </div>

    <!-- Kategória -->
    <div class="universal-form-group">
      <label for="category" class="universal-form-label">
        {{ 'newExercise.category' | translate }}:
      </label>
      <input
        type="text"
        id="category"
        name="category"
        [(ngModel)]="newExercise.category"
        class="universal-form-input"
      />
    </div>

    <!-- Kalória / perc -->
    <div class="universal-form-group">
      <label for="caloriesBurnedPerMinute" class="universal-form-label">
        {{ 'newExercise.caloriesPerMinute' | translate }}:
      </label>
      <input
        type="number"
        id="caloriesBurnedPerMinute"
        name="caloriesBurnedPerMinute"
        [(ngModel)]="newExercise.caloriesBurnedPerMinute"
        step="0.01"
        class="universal-form-input"
      />
    </div>

    <!-- Időtartam -->
    <div class="universal-form-group">
      <label for="durationSeconds" class="universal-form-label">
        {{ 'newExercise.duration' | translate }}:
      </label>
      <input
        type="number"
        id="durationSeconds"
        name="durationSeconds"
        [(ngModel)]="newExercise.durationSeconds"
        class="universal-form-input"
      />
    </div>

    <!-- Kész -->
    <div class="universal-form-group-checkbox">
      <input
        type="checkbox"
        id="done"
        name="done"
        [(ngModel)]="newExercise.done"
        class="universal-form-checkbox"
      />
      <label for="done" class="universal-form-label-inline">
        {{ 'newExercise.done' | translate }}
      </label>
    </div>

    <!-- Submit -->
    <div class="universal-form-actions">
      <button
        type="submit"
        [disabled]="!exerciseForm.form.valid"
        class="universal-form-button"
      >
        ➕ {{ 'newExercise.create' | translate }}
      </button>
    </div>
  </form>
</div>
