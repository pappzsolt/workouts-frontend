<!-- Oldal címe -->
<h2
  class="mb-6 text-center text-2xl font-bold text-content-800 sm:text-3xl"
>
  ➕ {{ 'newExercise.title' | translate }}
</h2>

<!-- Közös üzenet komponens -->
<app-message
  [message]="message"
  [type]="messageType"
>
</app-message>

<!-- Form kártya -->
<div
  class="mx-auto mt-6 w-full max-w-5xl min-w-0 overflow-hidden rounded-2xl border border-surface-200 bg-white shadow-sm"
>
  <!-- Fejléc -->
  <div
    class="flex items-center justify-center bg-gradient-to-r from-primary-600 to-primary-700 px-4 py-5"
  >
    <span
      class="flex h-12 w-12 items-center justify-center rounded-full bg-white text-2xl shadow-md"
    >
      💪
    </span>
  </div>

  <!-- Form -->
  <form
    (ngSubmit)="addExercise()"
    #exerciseForm="ngForm"
    class="grid min-w-0 grid-cols-1 gap-5 p-5 sm:grid-cols-2 sm:p-6"
  >

    <!-- Név -->
    <div class="min-w-0 sm:col-span-2">
      <label
        for="name"
        class="mb-2 block text-sm font-semibold text-content-700"
      >
        {{ 'newExercise.name' | translate }}:
      </label>

      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="newExercise.name"
        required
        class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
      />
    </div>

    <!-- Leírás -->
    <div class="min-w-0 sm:col-span-2">
      <label
        for="description"
        class="mb-2 block text-sm font-semibold text-content-700"
      >
        {{ 'newExercise.description' | translate }}:
      </label>

      <textarea
        id="description"
        name="description"
        [(ngModel)]="newExercise.description"
        rows="3"
        class="block w-full resize-y rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
      ></textarea>
    </div>

    <!-- Kép URL -->
    <div class="min-w-0">
      <label
        for="imageUrl"
        class="mb-2 block text-sm font-semibold text-content-700"
      >
        {{ 'newExercise.imageUrl' | translate }}:
      </label>

      <input
        type="text"
        id="imageUrl"
        name="imageUrl"
        [(ngModel)]="newExercise.imageUrl"
        class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
      />
    </div>

    <!-- Videó URL -->
    <div class="min-w-0">
      <label
        for="videoUrl"
        class="mb-2 block text-sm font-semibold text-content-700"
      >
        {{ 'newExercise.videoUrl' | translate }}:
      </label>

      <input
        type="text"
        id="videoUrl"
        name="videoUrl"
        [(ngModel)]="newExercise.videoUrl"
        class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
      />
    </div>

    <!-- Izomcsoport -->
    <div class="min-w-0">
      <label
        for="muscleGroup"
        class="mb-2 block text-sm font-semibold text-content-700"
      >
        {{ 'newExercise.muscleGroup' | translate }}:
      </label>

      <input
        type="text"
        id="muscleGroup"
        name="muscleGroup"
        [(ngModel)]="newExercise.muscleGroup"
        class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
      />
    </div>

    <!-- Eszköz -->
    <div class="min-w-0">
      <label
        for="equipment"
        class="mb-2 block text-sm font-semibold text-content-700"
      >
        {{ 'newExercise.equipment' | translate }}:
      </label>

      <input
        type="text"
        id="equipment"
        name="equipment"
        [(ngModel)]="newExercise.equipment"
        class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
      />
    </div>

    <!-- Nehézség -->
    <div class="min-w-0">
      <label
        for="difficultyLevel"
        class="mb-2 block text-sm font-semibold text-content-700"
      >
        {{ 'newExercise.difficulty' | translate }}:
      </label>

      <select
        id="difficultyLevel"
        name="difficultyLevel"
        [(ngModel)]="newExercise.difficultyLevel"
        class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
      >
        <option value="easy">
          {{ 'newExercise.easy' | translate }}
        </option>

        <option value="medium">
          {{ 'newExercise.medium' | translate }}
        </option>

        <option value="hard">
          {{ 'newExercise.hard' | translate }}
        </option>
      </select>
    </div>

    <!-- Kategória -->
    <div class="min-w-0">
      <label
        for="category"
        class="mb-2 block text-sm font-semibold text-content-700"
      >
        {{ 'newExercise.category' | translate }}:
      </label>

      <input
        type="text"
        id="category"
        name="category"
        [(ngModel)]="newExercise.category"
        class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
      />
    </div>

    <!-- Kalória / perc -->
    <div class="min-w-0">
      <label
        for="caloriesBurnedPerMinute"
        class="mb-2 block text-sm font-semibold text-content-700"
      >
        {{ 'newExercise.caloriesPerMinute' | translate }}:
      </label>

      <input
        type="number"
        id="caloriesBurnedPerMinute"
        name="caloriesBurnedPerMinute"
        [(ngModel)]="newExercise.caloriesBurnedPerMinute"
        step="0.01"
        class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
      />
    </div>

    <!-- Időtartam -->
    <div class="min-w-0">
      <label
        for="durationSeconds"
        class="mb-2 block text-sm font-semibold text-content-700"
      >
        {{ 'newExercise.duration' | translate }}:
      </label>

      <input
        type="number"
        id="durationSeconds"
        name="durationSeconds"
        [(ngModel)]="newExercise.durationSeconds"
        class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
      />
    </div>

    <!-- Kész -->
    <div
      class="flex min-w-0 items-center gap-3 rounded-lg border border-surface-200 bg-surface-50 px-4 py-3 sm:col-span-2"
    >
      <input
        type="checkbox"
        id="done"
        name="done"
        [(ngModel)]="newExercise.done"
        class="h-4 w-4 shrink-0 rounded border-surface-300 text-blue-600 focus:ring-2 focus:ring-blue-600/20"
      />

      <label
        for="done"
        class="cursor-pointer text-sm font-semibold text-content-700"
      >
        {{ 'newExercise.done' | translate }}
      </label>
    </div>

    <!-- Submit -->
    <div
      class="flex min-w-0 justify-end pt-1 sm:col-span-2"
    >
      <button
        type="submit"
        [disabled]="!exerciseForm.form.valid || saving"
        class="w-full rounded-lg bg-gradient-to-r from-primary-600 to-primary-700 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-4 focus:ring-blue-600/20 disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto"
      >
        ➕ {{ 'newExercise.create' | translate }}
      </button>
    </div>

  </form>
</div>
