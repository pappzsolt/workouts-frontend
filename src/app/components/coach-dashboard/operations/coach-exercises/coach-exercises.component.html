<div class="mx-auto flex max-w-[1200px] flex-col gap-6 p-4">

  <!-- ======================================================
       OLDAL CÍM
       ====================================================== -->

  <h2 class="text-center text-3xl font-bold text-gray-800">
    {{ 'coachExercises.title' | translate }}
  </h2>


  <!-- ======================================================
       ÜZENET
       ====================================================== -->

  <app-message
    [message]="message"
    [type]="messageType"
  >
  </app-message>


  <!-- ======================================================
       BETÖLTÉS
       ====================================================== -->

  <div
    *ngIf="loading"
    class="rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center text-gray-500"
  >
    {{ 'common.loading' | translate }}
  </div>


  <ng-container *ngIf="!loading">

    <!-- ====================================================
         KERESÉS ÉS RENDEZÉS
         ==================================================== -->

    <div
      class="flex flex-col gap-4 rounded-xl border border-gray-200 bg-white p-4 shadow-sm sm:p-5 lg:flex-row lg:items-end"
    >

      <!-- KERESÉS -->

      <div class="flex min-w-0 flex-1 flex-col gap-2">

        <label
          for="exerciseSearch"
          class="text-sm font-semibold text-gray-700"
        >
          {{ 'coachExercises.search' | translate }}
        </label>


        <div
          class="grid grid-cols-1 gap-3 sm:grid-cols-[minmax(0,1fr)_180px_auto]"
        >

          <!-- KERESÉSI SZÖVEG -->

          <input
            id="exerciseSearch"
            type="text"
            [(ngModel)]="searchTerm"
            class="min-h-11 w-full rounded-xl border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10"
            [placeholder]="'coachExercises.searchPlaceholder' | translate"
            autocomplete="off"
          />


          <!-- KERESÉSI MEZŐ -->

          <app-exercise-search-field
            [(value)]="searchField"
            [options]="searchFieldOptions"
          >
          </app-exercise-search-field>


          <!-- KERESÉS GOMB -->

          <button
            type="button"
            class="min-h-11 w-full rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500/10 sm:w-auto"
            (click)="search()"
          >
            {{ 'common.search' | translate }}
          </button>

        </div>

      </div>


      <!-- ==================================================
           RENDEZÉS
           ================================================== -->

      <button
        type="button"
        class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-xl border border-sort-200 bg-sort-50 px-4 py-2.5 text-sm font-semibold text-sort-700 shadow-sm transition duration-150 hover:border-sort-200 hover:bg-sort-100 focus:outline-none focus:ring-4 focus:ring-sort-600/10 lg:w-auto"
        (click)="toggleSort()"
      >
  <span>
    {{ 'coachExercises.sortByName' | translate }}
  </span>

        <span class="text-lg font-bold leading-none">
    {{ sortDirection === 'asc' ? '↑' : '↓' }}
  </span>
      </button>

    </div>


    <!-- ======================================================
         GYAKORLATOK
         ====================================================== -->

    <ng-container
      *ngIf="filteredExercises.length > 0; else noExercises"
    >

      <div
        class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
      >

        <div
          *ngFor="let ex of pagedExercises"
          class="flex min-h-[350px] flex-col overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm transition duration-150 hover:-translate-y-0.5 hover:shadow-md"
        >

          <!-- ==================================================
               EXERCISE KÉPEK
               ================================================== -->

          <div
            class="flex h-[180px] items-center justify-center overflow-hidden border-b border-gray-200 bg-gray-50"
          >

            <ng-container
              *ngIf="getExerciseImages(ex).length > 0; else noImage"
            >

              <img
                *ngFor="let image of getExerciseImages(ex)"
                [src]="'/assets/images/flat/' + image"
                [alt]="ex.name"
                class="h-full w-full object-contain"
              />

            </ng-container>


            <!-- NINCS KÉP -->

            <ng-template #noImage>

              <span class="text-5xl">
                🏋️‍♂️
              </span>

            </ng-template>

          </div>


          <!-- ==================================================
               KÁRTYA TARTALOM
               ================================================== -->

          <div class="flex flex-1 flex-col p-4">

            <h3 class="text-lg font-bold text-gray-800">
              {{ ex.name }}
            </h3>


            <p
              *ngIf="ex.description"
              class="mt-2 text-sm leading-6 text-gray-600"
            >
              {{ ex.description }}
            </p>


            <!-- ==================================================
                 SZERKESZTÉS
                 ================================================== -->

            <div class="mt-auto pt-4">

              <button
                type="button"
                class="w-full rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500/10"
                (click)="editExercise(ex.id!)"
              >
                ✏️ {{ 'common.edit' | translate }}
              </button>

            </div>

          </div>

        </div>

      </div>


      <!-- ======================================================
           LAPOZÁS
           ====================================================== -->

      <div
        *ngIf="totalPages > 1"
        class="flex items-center justify-center gap-4 pt-2"
      >

        <button
          type="button"
          class="rounded-xl border border-blue-200 bg-blue-50 px-4 py-2.5 text-sm font-semibold text-blue-700 shadow-sm transition hover:border-blue-300 hover:bg-blue-100 disabled:cursor-not-allowed disabled:opacity-50"
          (click)="prevPage()"
          [disabled]="currentPage === 0"
        >
          ◀ {{ 'common.previous' | translate }}
        </button>


        <span class="text-sm font-semibold text-gray-700">
          {{ currentPage + 1 }} / {{ totalPages }}
        </span>


        <button
          type="button"
          class="rounded-xl border border-blue-200 bg-blue-50 px-4 py-2.5 text-sm font-semibold text-blue-700 transition hover:border-blue-300 hover:bg-blue-100 disabled:cursor-not-allowed disabled:opacity-50"
          (click)="nextPage()"
          [disabled]="currentPage === totalPages - 1"
        >
          {{ 'common.next' | translate }} ▶
        </button>

      </div>

    </ng-container>

  </ng-container>


  <!-- ======================================================
       NINCS GYAKORLAT / NINCS KERESÉSI TALÁLAT
       ====================================================== -->

  <ng-template #noExercises>

    <div
      class="rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center text-gray-500"
    >

      <span
        *ngIf="searchTerm; else noExercisesAtAll"
      >
        {{ 'coachExercises.noSearchResults' | translate }}
      </span>


      <ng-template #noExercisesAtAll>

        {{ 'coachExercises.noExercises' | translate }}

      </ng-template>

    </div>

  </ng-template>


  <!-- ======================================================
       ÚJ GYAKORLAT
       ====================================================== -->

  <button
    type="button"
    class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-green-600 text-2xl text-white shadow-lg transition hover:bg-green-700 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-green-500/20"
    (click)="goToNewExercise()"
    [title]="'coachExercises.addExercise' | translate"
  >
    ➕
  </button>

</div>
