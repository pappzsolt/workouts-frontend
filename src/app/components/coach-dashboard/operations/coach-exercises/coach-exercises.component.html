<div class="exercises-container">

  <!-- ======================================================
       OLDAL CÍM
       ====================================================== -->

  <h2 class="exercises-title">
    {{ 'coachExercises.title' | translate }}
  </h2>


  <!-- ======================================================
       ÜZENET
       ====================================================== -->

  <app-message
    [message]="message"
    [type]="messageType"
  >
  </app-message>


  <!-- ======================================================
       BETÖLTÉS
       ====================================================== -->

  <div
    *ngIf="loading"
    class="no-exercises"
  >
    {{ 'common.loading' | translate }}
  </div>


  <ng-container *ngIf="!loading">

    <!-- ====================================================
         KERESÉS ÉS RENDEZÉS
         ==================================================== -->

    <div class="exercise-controls">

      <!-- KERESÉS -->

      <div class="exercise-search">

        <label
          for="exerciseSearch"
          class="exercise-search-label"
        >
          {{ 'coachExercises.search' | translate }}
        </label>

        <div class="exercise-search-row">

          <input
            id="exerciseSearch"
            type="text"
            [(ngModel)]="searchTerm"
            class="exercise-search-input"
            [placeholder]="'coachExercises.searchPlaceholder' | translate"
            autocomplete="off"
          />

          <select
            [(ngModel)]="searchField"
            class="exercise-search-field"
          >
            <option value="all">
              {{ 'coachExercises.searchFields.all' | translate }}
            </option>

            <option value="name">
              {{ 'coachExercises.searchFields.name' | translate }}
            </option>

            <option value="bodyPart">
              {{ 'coachExercises.searchFields.bodyPart' | translate }}
            </option>

            <option value="primaryMuscles">
              {{ 'coachExercises.searchFields.primaryMuscles' | translate }}
            </option>

            <option value="secondaryMuscles">
              {{ 'coachExercises.searchFields.secondaryMuscles' | translate }}
            </option>
          </select>

          <button
            type="button"
            class="exercise-search-button"
            (click)="search()"
          >
            {{ 'common.search' | translate }}
          </button>

        </div>

      </div>


      <!-- RENDEZÉS -->

      <button
        type="button"
        class="exercise-sort-button"
        (click)="toggleSort()"
      >
        {{ 'coachExercises.sortByName' | translate }}

        <span class="sort-icon">
          {{ sortDirection === 'asc' ? '↑' : '↓' }}
        </span>
      </button>

    </div>


    <!-- ======================================================
         GYAKORLATOK
         ====================================================== -->

    <ng-container
      *ngIf="filteredExercises.length > 0; else noExercises"
    >

      <div class="exercises-grid">

        <div
          *ngFor="let ex of pagedExercises"
          class="exercise-card"
        >

          <!-- ==================================================
               EXERCISE KÉPEK
               ================================================== -->

          <div class="exercise-image">

            <ng-container
              *ngIf="getExerciseImages(ex).length > 0; else noImage"
            >

              <img
                *ngFor="let image of getExerciseImages(ex)"
                [src]="'/assets/images/flat/' + image"
                [alt]="ex.name"
                class="exercise-image-item"
              />

            </ng-container>


            <!-- NINCS KÉP -->

            <ng-template #noImage>

              <span class="exercise-emoji">
                🏋️‍♂️
              </span>

            </ng-template>

          </div>


          <!-- ==================================================
               KÁRTYA TARTALOM
               ================================================== -->

          <div class="exercise-content">

            <h3 class="exercise-name">
              {{ ex.name }}
            </h3>


            <p
              *ngIf="ex.description"
              class="exercise-description"
            >
              {{ ex.description }}
            </p>


            <!-- ==================================================
                 SZERKESZTÉS
                 ================================================== -->

            <div class="exercise-edit">

              <button
                type="button"
                class="edit-button"
                (click)="editExercise(ex.id!)"
              >
                ✏️ {{ 'common.edit' | translate }}
              </button>

            </div>

          </div>

        </div>

      </div>


      <!-- ======================================================
           LAPOZÁS
           ====================================================== -->

      <div
        *ngIf="totalPages > 1"
        class="pagination-controls"
      >

        <button
          type="button"
          class="pagination-button"
          (click)="prevPage()"
          [disabled]="currentPage === 0"
        >
          ◀ {{ 'common.previous' | translate }}
        </button>


        <span class="pagination-info">
          {{ currentPage + 1 }} / {{ totalPages }}
        </span>


        <button
          type="button"
          class="pagination-button"
          (click)="nextPage()"
          [disabled]="currentPage === totalPages - 1"
        >
          {{ 'common.next' | translate }} ▶
        </button>

      </div>

    </ng-container>

  </ng-container>


  <!-- ======================================================
       NINCS GYAKORLAT / NINCS KERESÉSI TALÁLAT
       ====================================================== -->

  <ng-template #noExercises>

    <div class="no-exercises">

      <span
        *ngIf="searchTerm; else noExercisesAtAll"
      >
        {{ 'coachExercises.noSearchResults' | translate }}
      </span>


      <ng-template #noExercisesAtAll>

        {{ 'coachExercises.noExercises' | translate }}

      </ng-template>

    </div>

  </ng-template>


  <!-- ======================================================
       ÚJ GYAKORLAT
       ====================================================== -->

  <button
    type="button"
    class="floating-action-button"
    (click)="goToNewExercise()"
    [title]="'coachExercises.addExercise' | translate"
  >
    ➕
  </button>

</div>
