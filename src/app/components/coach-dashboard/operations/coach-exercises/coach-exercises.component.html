
<div
  class="min-h-full min-w-0 bg-transparent px-4 py-6 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-7xl min-w-0 flex-col gap-6">

    <!-- ======================================================
         OLDAL CÍM
         ====================================================== -->

    <h2
      class="text-center text-2xl font-bold tracking-tight text-content-800 sm:text-3xl"
    >
      {{ 'coachExercises.title' | translate }}
    </h2>

    <!-- ======================================================
         ÜZENET
         ====================================================== -->

    <app-message
      [message]="message"
      [type]="messageType"
    >
    </app-message>

    <!-- ======================================================
         BETÖLTÉS
         ====================================================== -->

    <app-message *ngIf="loading" message="common.loading" type="info" class="block mb-4"></app-message>

    <ng-container *ngIf="!loading">

      <!-- ====================================================
           KERESÉS ÉS RENDEZÉS
           ==================================================== -->

      <div
        class="flex flex-col gap-4 rounded-2xl border border-surface-200 bg-white p-4 shadow-sm sm:p-5 lg:flex-row lg:items-end"
      >

        <!-- KERESÉS -->

        <div class="flex min-w-0 flex-1 flex-col gap-2">

          <div
            class="grid min-w-0 grid-cols-1 gap-3 sm:grid-cols-[minmax(0,1fr)_180px_auto] sm:items-end"
          >

            <!-- KERESÉSI SZÖVEG -->

            <app-search
              inputId="exerciseSearch"
              [searchTerm]="searchTerm"
              label="coachExercises.search"
              placeholder="coachExercises.searchPlaceholder"
              [showClearButton]="true"
              (searchTermChange)="searchTerm = $event"
              [debounceMs]="0"
            ></app-search>

            <!-- KERESÉSI MEZŐ -->

            <app-exercise-search-field
              [(value)]="searchField"
              [options]="searchFieldOptions"
            >
            </app-exercise-search-field>

            <!-- KERESÉS GOMB -->

            <app-button
              variant="search"
              type="button"
              [label]="'common.search' | translate"
              (buttonClick)="search()"
            ></app-button>

          </div>

        </div>

        <!-- RENDEZÉS -->

        <app-button
          variant="sort"
          [label]="'coachExercises.sortByName' | translate"
          [lucideIcon]="sortDirection === 'asc' ? 'arrow-up-narrow-wide' : 'arrow-down-wide-narrow'"
          (buttonClick)="toggleSort()"
        ></app-button>

      </div>

      <!-- ======================================================
           GYAKORLATOK
           ====================================================== -->

      <ng-container
        *ngIf="filteredExercises.length > 0; else noExercises"
      >

        <div
          class="grid min-w-0 grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"
        >

          <!-- ==================================================
               EXERCISE KÁRTYA
               ================================================== -->

          <app-card
            *ngFor="let ex of pagedExercises; trackBy: trackByExercise"
            class="group flex min-w-0 flex-col overflow-hidden"
          >

            <!-- PIROS FEJLÉC -->

            <div
              class="flex h-28 items-center justify-center bg-gradient-to-r from-primary-700 to-primary-800"
            >
              <span
                class="flex h-14 w-14 items-center justify-center rounded-full bg-white text-3xl shadow-md transition duration-200 group-hover:scale-105"
              >
                <app-icon name="dumbbell" sizeClass="h-5 w-5" />
              </span>
            </div>

            <!-- EXERCISE KÉPEK -->

            <div
              class="flex h-[180px] items-center justify-center overflow-hidden border-b border-surface-100 bg-surface-50"
            >
              <ng-container
                *ngIf="getExerciseImages(ex).length > 0; else noImage"
              >
                <img
                  *ngFor="let image of getExerciseImages(ex); trackBy: trackByImage"
                  [src]="'/assets/images/flat/' + image"
                  [alt]="ex.name"
                  class="h-full w-full object-contain transition duration-200 group-hover:scale-105"
                />
              </ng-container>

              <!-- NINCS KÉP -->

              <ng-template #noImage>
                <span class="text-5xl">
                  <app-icon name="dumbbell" sizeClass="h-5 w-5" />
                </span>
              </ng-template>
            </div>

            <!-- KÁRTYA TARTALOM -->

            <div class="flex min-w-0 flex-1 flex-col p-5">

              <!-- EXERCISE NÉV -->

              <h3
                class="mb-2 break-words text-lg font-bold text-content-800"
              >
                {{ ex.name }}
              </h3>

              <!-- LEÍRÁS -->

              <p
                *ngIf="ex.description"
                class="mb-4 break-words text-sm leading-6 text-content-600"
              >
                {{ ex.description }}
              </p>

              <!-- SZERKESZTÉS -->

              <div class="mt-auto pt-4">
                <app-button
                  type="button"
                  (buttonClick)="editExercise(ex.id!)"
                  variant="edit"
                  appearance="solid"
                  [fullWidth]="true"
                  class="block w-full"
                >
                  <app-icon name="pencil" sizeClass="h-5 w-5" /> {{ 'common.edit' | translate }}
                </app-button>
              </div>

            </div>

          </app-card>

        </div>

        <!-- ======================================================
             KÖZÖS LAPOZÓ KOMPONENS
             ====================================================== -->

        <app-pagination
          *ngIf="totalElements > 0"
          [totalItems]="totalElements"
          [pageSize]="itemsPerPage"
          [currentPage]="currentPage + 1"
          [showPageSize]="false"
          [showInfo]="true"
          (pageChange)="onPageChange($event)"
        >
        </app-pagination>

      </ng-container>

    </ng-container>

    <!-- ======================================================
         NINCS GYAKORLAT / NINCS KERESÉSI TALÁLAT
         ====================================================== -->

    <ng-template #noExercises>

      <app-message *ngIf="messageType !== 'error'"
        [message]="
          (searchTerm
            ? 'coachExercises.noSearchResults'
            : 'coachExercises.noExercises')"
        type="info"
      >
      </app-message>

    </ng-template>

    <!-- ======================================================
         ÚJ GYAKORLAT
         ====================================================== -->

    <app-button
      type="button"
      (buttonClick)="goToNewExercise()"
      [title]="'coachExercises.addExercise' | translate"
      variant="add"
      appearance="solid"
      [iconOnly]="true"
      [floating]="true"
    >
      <app-icon name="circle-plus" sizeClass="h-5 w-5" />
    </app-button>

  </div>
</div>
