<div
  class="min-h-screen min-w-0 bg-gradient-to-br from-slate-50 via-blue-50/40 to-indigo-50/50 px-4 py-6 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-7xl min-w-0 flex-col gap-6">

    <!-- ======================================================
         OLDAL CÍM
         ====================================================== -->

    <h2
      class="text-center text-2xl font-bold tracking-tight text-content-800 sm:text-3xl"
    >
      {{ 'coachExercises.title' | translate }}
    </h2>


    <!-- ======================================================
         ÜZENET
         ====================================================== -->

    <app-message
      [message]="message"
      [type]="messageType"
    >
    </app-message>


    <!-- ======================================================
         BETÖLTÉS
         ====================================================== -->

    <div
      *ngIf="loading"
      class="rounded-2xl border border-surface-200 bg-white p-8 text-center text-content-500 shadow-sm"
    >
      {{ 'common.loading' | translate }}
    </div>


    <ng-container *ngIf="!loading">

      <!-- ====================================================
           KERESÉS ÉS RENDEZÉS
           ==================================================== -->

      <div
        class="flex flex-col gap-4 rounded-2xl border border-surface-200 bg-white p-4 shadow-sm sm:p-5 lg:flex-row lg:items-end"
      >

        <!-- KERESÉS -->

        <div class="flex min-w-0 flex-1 flex-col gap-2">

          <label
            for="exerciseSearch"
            class="text-sm font-semibold text-content-700"
          >
            {{ 'coachExercises.search' | translate }}
          </label>


          <div
            class="grid min-w-0 grid-cols-1 gap-3 sm:grid-cols-[minmax(0,1fr)_180px_auto]"
          >

            <!-- KERESÉSI SZÖVEG -->

            <input
              id="exerciseSearch"
              type="text"
              [(ngModel)]="searchTerm"
              class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-sm text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10"
              [placeholder]="'coachExercises.searchPlaceholder' | translate"
              autocomplete="off"
            />


            <!-- KERESÉSI MEZŐ -->

            <app-exercise-search-field
              [(value)]="searchField"
              [options]="searchFieldOptions"
            >
            </app-exercise-search-field>


            <!-- KERESÉS GOMB -->

            <button
              type="button"
              class="min-h-11 w-full rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-600/10 sm:w-auto"
              (click)="search()"
            >
              {{ 'common.search' | translate }}
            </button>

          </div>

        </div>


        <!-- RENDEZÉS -->

        <button
          type="button"
          class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-xl border border-sort-200 bg-sort-50 px-4 py-2.5 text-sm font-semibold text-sort-700 shadow-sm transition duration-150 hover:border-sort-200 hover:bg-sort-100 focus:outline-none focus:ring-4 focus:ring-sort-600/10 lg:w-auto"
          (click)="toggleSort()"
        >

          <span>
            {{ 'coachExercises.sortByName' | translate }}
          </span>

          <span class="text-lg font-bold leading-none">
            {{ sortDirection === 'asc' ? '↑' : '↓' }}
          </span>

        </button>

      </div>


      <!-- ======================================================
           GYAKORLATOK
           ====================================================== -->

      <ng-container
        *ngIf="filteredExercises.length > 0; else noExercises"
      >

        <div
          class="grid min-w-0 grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"
        >

          <!-- ==================================================
               EXERCISE KÁRTYA
               ================================================== -->

          <app-card
            *ngFor="let ex of pagedExercises"
            class="group flex min-w-0 flex-col overflow-hidden"
          >

            <!-- ==================================================
                 PIROS FEJLÉC
                 ================================================== -->

            <div
              class="flex h-28 items-center justify-center bg-gradient-to-r from-primary-600 to-primary-700"
            >
    <span
      class="flex h-14 w-14 items-center justify-center rounded-full bg-white text-3xl shadow-md transition duration-200 group-hover:scale-105"
    >
      🏋️‍♂️
    </span>
            </div>


            <!-- ==================================================
                 EXERCISE KÉPEK
                 ================================================== -->

            <div
              class="flex h-[180px] items-center justify-center overflow-hidden border-b border-surface-100 bg-surface-50"
            >
              <ng-container
                *ngIf="getExerciseImages(ex).length > 0; else noImage"
              >
                <img
                  *ngFor="let image of getExerciseImages(ex)"
                  [src]="'/assets/images/flat/' + image"
                  [alt]="ex.name"
                  class="h-full w-full object-contain transition duration-200 group-hover:scale-105"
                />
              </ng-container>

              <!-- NINCS KÉP -->

              <ng-template #noImage>
      <span class="text-5xl">
        🏋️‍♂️
      </span>
              </ng-template>
            </div>


            <!-- ==================================================
                 KÁRTYA TARTALOM
                 ================================================== -->

            <div class="flex min-w-0 flex-1 flex-col p-5">

              <!-- EXERCISE NÉV -->

              <h3
                class="mb-2 break-words text-lg font-bold text-content-800"
              >
                {{ ex.name }}
              </h3>


              <!-- LEÍRÁS -->

              <p
                *ngIf="ex.description"
                class="mb-4 break-words text-sm leading-6 text-content-600"
              >
                {{ ex.description }}
              </p>


              <!-- ==================================================
                   SZERKESZTÉS
                   ================================================== -->

              <div class="mt-auto pt-4">
                <button
                  type="button"
                  class="w-full rounded-lg border border-blue-200 bg-blue-50 px-4 py-2.5 text-sm font-semibold text-blue-700 transition hover:border-blue-300 hover:bg-blue-100 focus:outline-none focus:ring-4 focus:ring-blue-600/10"
                  (click)="editExercise(ex.id!)"
                >
                  ✏️ {{ 'common.edit' | translate }}
                </button>
              </div>

            </div>

          </app-card>

        </div>


        <!-- ======================================================
             LAPOZÁS
             ====================================================== -->

        <div
          *ngIf="totalPages > 1"
          class="flex flex-col items-center justify-center gap-3 rounded-2xl border border-surface-200 bg-white p-4 shadow-sm sm:flex-row"
        >

          <button
            type="button"
            class="w-full rounded-lg border border-surface-300 bg-white px-4 py-2.5 text-sm font-semibold text-content-700 transition hover:border-blue-300 hover:bg-blue-50 hover:text-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-600/10 disabled:cursor-not-allowed disabled:opacity-40 sm:w-auto"
            (click)="prevPage()"
            [disabled]="currentPage === 0"
          >
            ◀ {{ 'common.previous' | translate }}
          </button>


          <span
            class="min-w-20 text-center text-sm font-semibold text-content-700"
          >
            {{ currentPage + 1 }} / {{ totalPages }}
          </span>


          <button
            type="button"
            class="w-full rounded-lg border border-surface-300 bg-white px-4 py-2.5 text-sm font-semibold text-content-700 transition hover:border-blue-300 hover:bg-blue-50 hover:text-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-600/10 disabled:cursor-not-allowed disabled:opacity-40 sm:w-auto"
            (click)="nextPage()"
            [disabled]="currentPage === totalPages - 1"
          >
            {{ 'common.next' | translate }} ▶
          </button>

        </div>

      </ng-container>

    </ng-container>


    <!-- ======================================================
         NINCS GYAKORLAT / NINCS KERESÉSI TALÁLAT
         ====================================================== -->

    <ng-template #noExercises>

      <app-message
        [message]="
          (searchTerm
            ? 'coachExercises.noSearchResults'
            : 'coachExercises.noExercises') | translate
        "
        type="info"
      >
      </app-message>

    </ng-template>


    <!-- ======================================================
         ÚJ GYAKORLAT
         ====================================================== -->

    <button
      type="button"
      class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-r from-primary-600 to-primary-700 text-2xl text-white shadow-lg transition duration-200 hover:scale-105 hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-4 focus:ring-blue-600/20"
      (click)="goToNewExercise()"
      [title]="'coachExercises.addExercise' | translate"
    >
      ➕
    </button>

  </div>
</div>
