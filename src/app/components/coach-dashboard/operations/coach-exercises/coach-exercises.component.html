<h2 class="programs-title">Exercises</h2>

<div *ngIf="loading" class="no-programs">
  Betöltés...
</div>

<ng-container *ngIf="!loading; else noExercises">

  <div *ngIf="exercises.length > 0; else noExercises"
       class="programs-grid">

    <div *ngFor="let ex of pagedExercises" class="program-card">

      <div class="program-image">
        <span class="program-emoji">🏋️‍♂️</span>
      </div>

      <div class="program-content">

        <div class="program-name">
          {{ ex.name }}
        </div>

        <div class="program-description">
          {{ ex.description }}
        </div>

        <div class="program-edit">
          <button (click)="editExercise(ex.id!)">
            ✏️ Szerkesztés
          </button>
        </div>

      </div>
    </div>

  </div>

  <div class="pagination-controls">

    <button
      (click)="prevPage()"
      [disabled]="currentPage === 1">
      ◀ Előző
    </button>

    <span>
      Oldal {{ currentPage }} / {{ totalPages }}
    </span>

    <button
      (click)="nextPage()"
      [disabled]="currentPage === totalPages">
      Következő ▶
    </button>

  </div>

</ng-container>

<ng-template #noExercises>
  <div class="no-programs">
    No exercises found.
  </div>
</ng-template>

<button
  class="floating-action-button"
  (click)="goToNewExercise()"
  title="Új Exercise hozzáadása">
  ➕
</button>
