<h2 class="universal-form-title">✏️ Gyakorlat szerkesztése</h2>

<!-- Üzenet -->
<div
  *ngIf="message"
  class="universal-form-message"
  [ngClass]="{
    'universal-form-message-success': messageType === 'success',
    'universal-form-message-error': messageType === 'error',
  }"
>
  {{ message }}
</div>

<!-- Gyakorlat szerkesztési űrlap -->
<div class="form-card">
  <div class="form-header">
    <span class="form-header-emoji">🏋️‍♀️</span>
  </div>

  <form (ngSubmit)="saveExercise()" #exerciseForm="ngForm" class="universal-form">
    <!-- Név -->
    <div class="universal-form-group-full">
      <label for="name" class="universal-form-label">Gyakorlat neve</label>
      <input
        id="name"
        name="name"
        type="text"
        [(ngModel)]="exercise.name"
        required
        class="universal-form-input"
      />
    </div>

    <!-- Leírás -->
    <div class="universal-form-group-full">
      <label for="description" class="universal-form-label">Leírás</label>
      <textarea
        id="description"
        name="description"
        rows="3"
        [(ngModel)]="exercise.description"
        class="universal-form-textarea"
      ></textarea>
    </div>

    <!-- Kép URL -->
    <div class="universal-form-group">
      <label for="imageUrl" class="universal-form-label">Kép URL</label>
      <input
        id="imageUrl"
        name="imageUrl"
        type="text"
        [(ngModel)]="exercise.imageUrl"
        class="universal-form-input"
      />
    </div>

    <!-- Videó URL -->
    <div class="universal-form-group">
      <label for="videoUrl" class="universal-form-label">Videó URL</label>
      <input
        id="videoUrl"
        name="videoUrl"
        type="text"
        [(ngModel)]="exercise.videoUrl"
        class="universal-form-input"
      />
    </div>

    <!-- Izomcsoport -->
    <div class="universal-form-group">
      <label for="muscleGroup" class="universal-form-label">Izomcsoport</label>
      <input
        id="muscleGroup"
        name="muscleGroup"
        type="text"
        [(ngModel)]="exercise.muscleGroup"
        class="universal-form-input"
      />
    </div>

    <!-- Eszköz -->
    <div class="universal-form-group">
      <label for="equipment" class="universal-form-label">Eszköz</label>
      <input
        id="equipment"
        name="equipment"
        type="text"
        [(ngModel)]="exercise.equipment"
        class="universal-form-input"
      />
    </div>

    <!-- Nehézségi szint -->
    <div class="universal-form-group">
      <label for="difficultyLevel" class="universal-form-label">Nehézségi szint</label>
      <input
        id="difficultyLevel"
        name="difficultyLevel"
        type="text"
        [(ngModel)]="exercise.difficultyLevel"
        class="universal-form-input"
      />
    </div>

    <!-- Kategória -->
    <div class="universal-form-group">
      <label for="category" class="universal-form-label">Kategória</label>
      <input
        id="category"
        name="category"
        type="text"
        [(ngModel)]="exercise.category"
        class="universal-form-input"
      />
    </div>

    <!-- Elégetett kalória / perc -->
    <div class="universal-form-group">
      <label for="caloriesBurnedPerMinute" class="universal-form-label">
        Elégetett kalória / perc
      </label>
      <input
        id="caloriesBurnedPerMinute"
        name="caloriesBurnedPerMinute"
        type="number"
        step="0.01"
        [(ngModel)]="exercise.caloriesBurnedPerMinute"
        class="universal-form-input"
      />
    </div>

    <!-- Időtartam (másodperc) -->
    <div class="universal-form-group">
      <label for="durationSeconds" class="universal-form-label">Időtartam (másodperc)</label>
      <input
        id="durationSeconds"
        name="durationSeconds"
        type="number"
        [(ngModel)]="exercise.durationSeconds"
        class="universal-form-input"
      />
    </div>

    <!-- Mentés gomb -->
    <div class="md:col-span-2 text-center mt-4">
      <button type="submit" [disabled]="!exerciseForm.form.valid" class="universal-form-button">
        💾 Gyakorlat mentése
      </button>
    </div>
  </form>
</div>
