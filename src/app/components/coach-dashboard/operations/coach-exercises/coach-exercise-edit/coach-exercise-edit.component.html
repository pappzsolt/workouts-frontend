<!-- Oldal címe -->
<h2 class="universal-form-title">
  ✏️ {{ 'coachExerciseEdit.title' | translate }}
</h2>

<!-- Közös üzenet -->
<app-message
  [message]="message"
  [type]="messageType"
></app-message>

<!-- Gyakorlat szerkesztési űrlap -->
<div class="form-card" *ngIf="exerciseFound">

  <div class="form-header">
    <span class="form-header-emoji">
      🏋️‍♀️
    </span>
  </div>

  <form
    (ngSubmit)="saveExercise()"
    #exerciseForm="ngForm"
    class="universal-form"
  >

    <!-- ======================================================
         FORDÍTOTT ADATOK
         ====================================================== -->

    <!-- Név -->
    <div class="universal-form-group-full">

      <label
        for="name"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.name' | translate }}
      </label>

      <input
        id="name"
        name="name"
        type="text"
        [(ngModel)]="exercise.name"
        required
        class="universal-form-input"
      />

    </div>


    <!-- Leírás -->
    <div class="universal-form-group-full">

      <label
        for="description"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.description' | translate }}
      </label>

      <textarea
        id="description"
        name="description"
        rows="3"
        [(ngModel)]="exercise.description"
        class="universal-form-textarea"
      ></textarea>

    </div>


    <!-- Testrész -->
    <div class="universal-form-group">

      <label
        for="bodyPart"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.bodyPart' | translate }}
      </label>

      <input
        id="bodyPart"
        name="bodyPart"
        type="text"
        [(ngModel)]="exercise.bodyPart"
        class="universal-form-input"
      />

    </div>


    <!-- Szinonimák -->
    <div class="universal-form-group">

      <label
        for="synonyms"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.synonyms' | translate }}
      </label>

      <input
        id="synonyms"
        name="synonyms"
        type="text"
        [(ngModel)]="exercise.synonyms"
        class="universal-form-input"
      />

    </div>


    <!-- Utasítások -->
    <div class="universal-form-group-full">

      <label
        for="instructions"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.instructions' | translate }}
      </label>

      <textarea
        id="instructions"
        name="instructions"
        rows="5"
        [(ngModel)]="exercise.instructions"
        class="universal-form-textarea"
      ></textarea>

    </div>


    <!-- Tippek -->
    <div class="universal-form-group-full">

      <label
        for="tips"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.tips' | translate }}
      </label>

      <textarea
        id="tips"
        name="tips"
        rows="4"
        [(ngModel)]="exercise.tips"
        class="universal-form-textarea"
      ></textarea>

    </div>


    <!-- Elsődleges izmok -->
    <div class="universal-form-group">

      <label
        for="primaryMuscles"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.primaryMuscles' | translate }}
      </label>

      <input
        id="primaryMuscles"
        name="primaryMuscles"
        type="text"
        [(ngModel)]="exercise.primaryMuscles"
        class="universal-form-input"
      />

    </div>


    <!-- Másodlagos izmok -->
    <div class="universal-form-group">

      <label
        for="secondaryMuscles"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.secondaryMuscles' | translate }}
      </label>

      <input
        id="secondaryMuscles"
        name="secondaryMuscles"
        type="text"
        [(ngModel)]="exercise.secondaryMuscles"
        class="universal-form-input"
      />

    </div>


    <!-- ======================================================
         KÖZÖS EXERCISE ADATOK
         ====================================================== -->

    <!-- Kép URL -->
    <div class="universal-form-group">

      <label
        for="imageUrl"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.imageUrl' | translate }}
      </label>

      <input
        id="imageUrl"
        name="imageUrl"
        type="text"
        [(ngModel)]="exercise.imageUrl"
        class="universal-form-input"
      />

    </div>


    <!-- Videó URL -->
    <div class="universal-form-group">

      <label
        for="videoUrl"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.videoUrl' | translate }}
      </label>

      <input
        id="videoUrl"
        name="videoUrl"
        type="text"
        [(ngModel)]="exercise.videoUrl"
        class="universal-form-input"
      />

    </div>


    <!-- Izomcsoport -->
    <div class="universal-form-group">

      <label
        for="muscleGroup"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.muscleGroup' | translate }}
      </label>

      <input
        id="muscleGroup"
        name="muscleGroup"
        type="text"
        [(ngModel)]="exercise.muscleGroup"
        class="universal-form-input"
      />

    </div>


    <!-- Eszköz -->
    <div class="universal-form-group">

      <label
        for="equipment"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.equipment' | translate }}
      </label>

      <input
        id="equipment"
        name="equipment"
        type="text"
        [(ngModel)]="exercise.equipment"
        class="universal-form-input"
      />

    </div>


    <!-- Nehézségi szint -->
    <div class="universal-form-group">

      <label
        for="difficultyLevel"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.difficultyLevel' | translate }}
      </label>

      <input
        id="difficultyLevel"
        name="difficultyLevel"
        type="text"
        [(ngModel)]="exercise.difficultyLevel"
        class="universal-form-input"
      />

    </div>


    <!-- Kategória -->
    <div class="universal-form-group">

      <label
        for="category"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.category' | translate }}
      </label>

      <input
        id="category"
        name="category"
        type="text"
        [(ngModel)]="exercise.category"
        class="universal-form-input"
      />

    </div>


    <!-- Elégetett kalória / perc -->
    <div class="universal-form-group">

      <label
        for="caloriesBurnedPerMinute"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.caloriesPerMinute' | translate }}
      </label>

      <input
        id="caloriesBurnedPerMinute"
        name="caloriesBurnedPerMinute"
        type="number"
        step="0.01"
        [(ngModel)]="exercise.caloriesBurnedPerMinute"
        class="universal-form-input"
      />

    </div>


    <!-- Időtartam -->
    <div class="universal-form-group">

      <label
        for="durationSeconds"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.durationSeconds' | translate }}
      </label>

      <input
        id="durationSeconds"
        name="durationSeconds"
        type="number"
        [(ngModel)]="exercise.durationSeconds"
        class="universal-form-input"
      />

    </div>


    <!-- Erő típusa -->
    <div class="universal-form-group">

      <label
        for="forceType"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.forceType' | translate }}
      </label>

      <input
        id="forceType"
        name="forceType"
        type="text"
        [(ngModel)]="exercise.forceType"
        class="universal-form-input"
      />

    </div>


    <!-- Mechanika -->
    <div class="universal-form-group">

      <label
        for="mechanic"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.mechanic' | translate }}
      </label>

      <input
        id="mechanic"
        name="mechanic"
        type="text"
        [(ngModel)]="exercise.mechanic"
        class="universal-form-input"
      />

    </div>


    <!-- Variációs csoport -->
    <div class="universal-form-group">

      <label
        for="variationGroup"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.variationGroup' | translate }}
      </label>

      <input
        id="variationGroup"
        name="variationGroup"
        type="text"
        [(ngModel)]="exercise.variationGroup"
        class="universal-form-input"
      />

    </div>


    <!-- Egyoldalas gyakorlat -->
    <div class="universal-form-group">

      <label
        for="isUnilateral"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.isUnilateral' | translate }}
      </label>

      <select
        id="isUnilateral"
        name="isUnilateral"
        [(ngModel)]="exercise.isUnilateral"
        class="universal-form-input"
      >
        <option [ngValue]="false">
          {{ 'common.no' | translate }}
        </option>

        <option [ngValue]="true">
          {{ 'common.yes' | translate }}
        </option>
      </select>

    </div>


    <!-- Testsúlyos gyakorlat -->
    <div class="universal-form-group">

      <label
        for="isBodyweight"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.isBodyweight' | translate }}
      </label>

      <select
        id="isBodyweight"
        name="isBodyweight"
        [(ngModel)]="exercise.isBodyweight"
        class="universal-form-input"
      >
        <option [ngValue]="false">
          {{ 'common.no' | translate }}
        </option>

        <option [ngValue]="true">
          {{ 'common.yes' | translate }}
        </option>
      </select>

    </div>


    <!-- ======================================================
         MENTÉS
         ====================================================== -->

    <div class="form-actions">

      <button
        type="submit"
        [disabled]="!exerciseForm.form.valid || saving"
        class="universal-form-button"
      >
        💾
        {{ 'coachExerciseEdit.save' | translate }}
      </button>

    </div>

  </form>

</div>
