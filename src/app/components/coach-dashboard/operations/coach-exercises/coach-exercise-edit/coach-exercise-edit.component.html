<!-- Oldal -->
<div class="min-h-full bg-transparent">
  <div class="mx-auto w-full max-w-6xl px-3 py-5 sm:px-6 sm:py-8 lg:px-8">

    <!-- Oldal címe -->
    <h2
      class="mb-6 flex items-center justify-center gap-2 text-center text-2xl font-bold tracking-tight text-content-800 sm:mb-8 sm:text-3xl"
    >
      <span><app-icon name="pencil" sizeClass="h-5 w-5" /></span>
      <span>{{ 'coachExerciseEdit.title' | translate }}</span>
    </h2>

    <!-- Közös üzenet -->
    <app-message
      [message]="message"
      [type]="messageType"
    ></app-message>

    <!-- Gyakorlat szerkesztési űrlap -->
    <div
      *ngIf="exerciseFound"
      class="mx-auto w-full overflow-hidden rounded-2xl border border-surface-200 bg-white shadow-lg shadow-surface-200/60"
    >

      <!-- Fejléc -->
      <div
        class="border-b border-info-100 bg-gradient-to-r from-primary-700 to-primary-800 px-4 py-6 sm:px-6 sm:py-7"
      >
        <div class="flex items-center justify-center">
          <span
            class="flex h-16 w-16 items-center justify-center rounded-2xl bg-white/95 text-4xl shadow-lg ring-1 ring-white/30"
          >
            <app-icon name="dumbbell" sizeClass="h-5 w-5" />
          </span>
        </div>
      </div>

      <form
        (ngSubmit)="saveExercise()"
        #exerciseForm="ngForm"
        class="grid min-w-0 grid-cols-1 gap-5 p-4 sm:grid-cols-2 sm:gap-x-6 sm:gap-y-5 sm:p-6"
      >

        <!-- ======================================================
             FORDÍTOTT ADATOK
             ====================================================== -->

        <!-- Név -->
        <app-form-field
          class="col-span-full min-w-0"
          labelKey="coachExerciseEdit.name"
          controlId="name"
        >

          <input
            id="name"
            name="name"
            type="text"
            [(ngModel)]="exercise.name"
            required
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Leírás -->
        <app-form-field
          class="col-span-full min-w-0"
          labelKey="coachExerciseEdit.description"
          controlId="description"
        >

          <textarea
            id="description"
            name="description"
            rows="3"
            [(ngModel)]="exercise.description"
            class="min-h-24 w-full min-w-0 resize-y rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base leading-6 text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          ></textarea>
        </app-form-field>

        <!-- Testrész -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.bodyPart"
          controlId="bodyPart"
        >

          <input
            id="bodyPart"
            name="bodyPart"
            type="text"
            [(ngModel)]="exercise.bodyPart"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Szinonimák -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.synonyms"
          controlId="synonyms"
        >

          <input
            id="synonyms"
            name="synonyms"
            type="text"
            [(ngModel)]="exercise.synonyms"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Utasítások -->
        <app-form-field
          class="col-span-full min-w-0"
          labelKey="coachExerciseEdit.instructions"
          controlId="instructions"
        >

          <textarea
            id="instructions"
            name="instructions"
            rows="5"
            [(ngModel)]="exercise.instructions"
            class="min-h-36 w-full min-w-0 resize-y rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base leading-6 text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          ></textarea>
        </app-form-field>

        <!-- Tippek -->
        <app-form-field
          class="col-span-full min-w-0"
          labelKey="coachExerciseEdit.tips"
          controlId="tips"
        >

          <textarea
            id="tips"
            name="tips"
            rows="4"
            [(ngModel)]="exercise.tips"
            class="min-h-28 w-full min-w-0 resize-y rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base leading-6 text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          ></textarea>
        </app-form-field>

        <!-- Elsődleges izmok -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.primaryMuscles"
          controlId="primaryMuscles"
        >

          <input
            id="primaryMuscles"
            name="primaryMuscles"
            type="text"
            [(ngModel)]="exercise.primaryMuscles"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Másodlagos izmok -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.secondaryMuscles"
          controlId="secondaryMuscles"
        >

          <input
            id="secondaryMuscles"
            name="secondaryMuscles"
            type="text"
            [(ngModel)]="exercise.secondaryMuscles"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- ======================================================
             KÖZÖS EXERCISE ADATOK
             ====================================================== -->

        <!-- Kép URL -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.imageUrl"
          controlId="imageUrl"
        >

          <input
            id="imageUrl"
            name="imageUrl"
            type="text"
            [(ngModel)]="exercise.imageUrl"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Videó URL -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.videoUrl"
          controlId="videoUrl"
        >

          <input
            id="videoUrl"
            name="videoUrl"
            type="text"
            [(ngModel)]="exercise.videoUrl"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Izomcsoport -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.muscleGroup"
          controlId="muscleGroup"
        >

          <input
            id="muscleGroup"
            name="muscleGroup"
            type="text"
            [(ngModel)]="exercise.muscleGroup"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Eszköz -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.equipment"
          controlId="equipment"
        >

          <input
            id="equipment"
            name="equipment"
            type="text"
            [(ngModel)]="exercise.equipment"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Nehézségi szint -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.difficultyLevel"
          controlId="difficultyLevel"
        >

          <input
            id="difficultyLevel"
            name="difficultyLevel"
            type="text"
            [(ngModel)]="exercise.difficultyLevel"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Kategória -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.category"
          controlId="category"
        >

          <input
            id="category"
            name="category"
            type="text"
            [(ngModel)]="exercise.category"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Elégetett kalória / perc -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.caloriesPerMinute"
          controlId="caloriesBurnedPerMinute"
        >

          <input
            id="caloriesBurnedPerMinute"
            name="caloriesBurnedPerMinute"
            type="number"
            step="0.01"
            [(ngModel)]="exercise.caloriesBurnedPerMinute"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Időtartam -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.durationSeconds"
          controlId="durationSeconds"
        >

          <input
            id="durationSeconds"
            name="durationSeconds"
            type="number"
            [(ngModel)]="exercise.durationSeconds"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Erő típusa -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.forceType"
          controlId="forceType"
        >

          <input
            id="forceType"
            name="forceType"
            type="text"
            [(ngModel)]="exercise.forceType"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Mechanika -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.mechanic"
          controlId="mechanic"
        >

          <input
            id="mechanic"
            name="mechanic"
            type="text"
            [(ngModel)]="exercise.mechanic"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Variációs csoport -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.variationGroup"
          controlId="variationGroup"
        >

          <input
            id="variationGroup"
            name="variationGroup"
            type="text"
            [(ngModel)]="exercise.variationGroup"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 disabled:cursor-not-allowed disabled:bg-surface-100 disabled:text-content-400 sm:text-sm"
          />
        </app-form-field>

        <!-- Egyoldalas gyakorlat -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.isUnilateral"
          controlId="isUnilateral"
        >

          <app-select
            id="isUnilateral"
            name="isUnilateral"
            [(value)]="exercise.isUnilateral"
            [options]="yesNoOptions"
          ></app-select>
        </app-form-field>

        <!-- Testsúlyos gyakorlat -->
        <app-form-field
          class="min-w-0"
          labelKey="coachExerciseEdit.isBodyweight"
          controlId="isBodyweight"
        >

          <app-select
            id="isBodyweight"
            name="isBodyweight"
            [(value)]="exercise.isBodyweight"
            [options]="yesNoOptions"
          ></app-select>
        </app-form-field>

        <!-- ======================================================
             MENTÉS
             ====================================================== -->

        <div
          class="col-span-full flex justify-end border-t border-info-100 pt-5"
        >
          <button
            type="submit"
            [disabled]="!exerciseForm.form.valid || saving"
            class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-primary-700 to-primary-800 px-6 py-2.5 text-sm font-semibold text-white shadow-md shadow-info-500/20 transition duration-150 hover:from-primary-700 hover:to-primary-700 hover:shadow-lg hover:shadow-info-500/25 focus:outline-none focus:ring-4 focus:ring-primary-500/20 active:scale-[0.98] disabled:cursor-not-allowed disabled:from-surface-300 disabled:to-surface-300 disabled:shadow-none sm:w-auto"
          >
            <span><app-icon name="save" sizeClass="h-5 w-5" /></span>
            <span>{{ 'coachExerciseEdit.save' | translate }}</span>
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
