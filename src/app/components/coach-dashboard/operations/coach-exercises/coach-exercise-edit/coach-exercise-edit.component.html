<!-- Oldal címe -->
<h2 class="universal-form-title">
  ✏️ {{ 'coachExerciseEdit.title' | translate }}
</h2>

<!-- Közös üzenet -->
<app-message
  [message]="message"
  [type]="messageType"
></app-message>

<!-- Gyakorlat szerkesztési űrlap -->
<div class="form-card">

  <div class="form-header">
    <span class="form-header-emoji">
      🏋️‍♀️
    </span>
  </div>

  <form
    (ngSubmit)="saveExercise()"
    #exerciseForm="ngForm"
    class="universal-form"
  >

    <!-- Név -->
    <div class="universal-form-group-full">

      <label
        for="name"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.name' | translate }}
      </label>

      <input
        id="name"
        name="name"
        type="text"
        [(ngModel)]="exercise.name"
        required
        class="universal-form-input"
      />

    </div>


    <!-- Leírás -->
    <div class="universal-form-group-full">

      <label
        for="description"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.description' | translate }}
      </label>

      <textarea
        id="description"
        name="description"
        rows="3"
        [(ngModel)]="exercise.description"
        class="universal-form-textarea"
      ></textarea>

    </div>


    <!-- Kép URL -->
    <div class="universal-form-group">

      <label
        for="imageUrl"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.imageUrl' | translate }}
      </label>

      <input
        id="imageUrl"
        name="imageUrl"
        type="text"
        [(ngModel)]="exercise.imageUrl"
        class="universal-form-input"
      />

    </div>


    <!-- Videó URL -->
    <div class="universal-form-group">

      <label
        for="videoUrl"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.videoUrl' | translate }}
      </label>

      <input
        id="videoUrl"
        name="videoUrl"
        type="text"
        [(ngModel)]="exercise.videoUrl"
        class="universal-form-input"
      />

    </div>


    <!-- Izomcsoport -->
    <div class="universal-form-group">

      <label
        for="muscleGroup"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.muscleGroup' | translate }}
      </label>

      <input
        id="muscleGroup"
        name="muscleGroup"
        type="text"
        [(ngModel)]="exercise.muscleGroup"
        class="universal-form-input"
      />

    </div>


    <!-- Eszköz -->
    <div class="universal-form-group">

      <label
        for="equipment"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.equipment' | translate }}
      </label>

      <input
        id="equipment"
        name="equipment"
        type="text"
        [(ngModel)]="exercise.equipment"
        class="universal-form-input"
      />

    </div>


    <!-- Nehézségi szint -->
    <div class="universal-form-group">

      <label
        for="difficultyLevel"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.difficultyLevel' | translate }}
      </label>

      <input
        id="difficultyLevel"
        name="difficultyLevel"
        type="text"
        [(ngModel)]="exercise.difficultyLevel"
        class="universal-form-input"
      />

    </div>


    <!-- Kategória -->
    <div class="universal-form-group">

      <label
        for="category"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.category' | translate }}
      </label>

      <input
        id="category"
        name="category"
        type="text"
        [(ngModel)]="exercise.category"
        class="universal-form-input"
      />

    </div>


    <!-- Elégetett kalória / perc -->
    <div class="universal-form-group">

      <label
        for="caloriesBurnedPerMinute"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.caloriesPerMinute' | translate }}
      </label>

      <input
        id="caloriesBurnedPerMinute"
        name="caloriesBurnedPerMinute"
        type="number"
        step="0.01"
        [(ngModel)]="exercise.caloriesBurnedPerMinute"
        class="universal-form-input"
      />

    </div>


    <!-- Időtartam -->
    <div class="universal-form-group">

      <label
        for="durationSeconds"
        class="universal-form-label"
      >
        {{ 'coachExerciseEdit.durationSeconds' | translate }}
      </label>

      <input
        id="durationSeconds"
        name="durationSeconds"
        type="number"
        [(ngModel)]="exercise.durationSeconds"
        class="universal-form-input"
      />

    </div>


    <!-- Mentés -->
    <div class="form-actions">

      <button
        type="submit"
        [disabled]="!exerciseForm.form.valid || saving"
        class="universal-form-button"
      >
        💾
        {{ 'coachExerciseEdit.save' | translate }}
      </button>

    </div>

  </form>

</div>
