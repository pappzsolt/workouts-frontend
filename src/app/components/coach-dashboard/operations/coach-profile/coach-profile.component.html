<h2 class="profile-title">Coach Profile</h2>

<div *ngIf="message" class="message-box">
  {{ message }}
</div>

<form class="profile-form">

  <div class="form-field">
    <label for="name">Name</label>
    <input
      id="name"
      name="name"
      type="text"
      placeholder="Name"
      [(ngModel)]="profile.name"
    />
  </div>

  <div class="form-field">
    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="Email"
      [(ngModel)]="profile.email"
    />
  </div>

  <div class="form-field">
    <label for="password_hash">Password</label>
    <input
      id="password_hash"
      name="password_hash"
      type="password"
      placeholder="Password"
      [(ngModel)]="profile.password_hash"
    />
  </div>

  <div class="form-field">
    <label for="phone">Phone</label>
    <input
      id="phone"
      name="phone"
      type="text"
      placeholder="Phone"
      [(ngModel)]="profile.phone"
    />
  </div>

  <div class="form-field full-width">
    <label for="specialization">Specialization</label>
    <textarea
      id="specialization"
      name="specialization"
      rows="3"
      placeholder="Specialization"
      [(ngModel)]="profile.specialization"
    ></textarea>
  </div>

  <div class="form-field full-width">
    <label for="avatar_url">Avatar URL</label>
    <input
      id="avatar_url"
      name="avatar_url"
      type="text"
      placeholder="Avatar image URL"
      [(ngModel)]="profile.avatar_url"
    />
  </div>

  <div class="form-actions">
    <button
      type="button"
      (click)="saveProfile()"
    >
      Save
    </button>
  </div>

</form>
