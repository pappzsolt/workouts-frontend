<!-- ======================================================
     OLDAL
     ====================================================== -->

<div class="min-h-full bg-transparent">
  <div class="mx-auto w-full max-w-5xl px-3 py-5 sm:px-6 sm:py-8 lg:px-8">
    <!-- ==================================================
         OLDAL CÍM
         ================================================== -->

    <h2 appHeading="page" class="mb-6 flex items-center justify-center gap-2 text-center sm:mb-8">
      <span><app-icon name="user-round" sizeClass="h-5 w-5" /></span>
      <span>{{ 'coachProfile.title' | translate }}</span>
    </h2>

    <!-- ==================================================
         ÜZENET
         ================================================== -->

    <app-message [message]="message" [type]="messageType"></app-message>

    <!-- ==================================================
         PROFIL ŰRLAP
         ================================================== -->

    <app-card class="mx-auto w-full overflow-hidden">
      <!-- ==================================================
           FEJLÉC
           ================================================== -->

      <div
        class="border-b border-info-100 bg-gradient-to-r from-primary-700 to-primary-800 px-4 py-6 sm:px-6 sm:py-7"
      >
        <div class="flex items-center justify-center">
          <span
            class="flex h-16 w-16 items-center justify-center rounded-2xl bg-white/95 text-4xl shadow-lg ring-1 ring-white/30"
          >
            🧑‍💼
          </span>
        </div>
      </div>

      <!-- ==================================================
           ŰRLAP
           ================================================== -->

      <form appProfileFields class="p-4 sm:gap-x-6 sm:gap-y-5 sm:p-6">
        <!-- ==================================================
             NÉV
             ================================================== -->

        <app-form-field labelKey="common.name" controlId="name">
          <input
            appInput="editor"
            id="name"
            name="name"
            type="text"
            [placeholder]="'common.name' | translate"
            [(ngModel)]="profile.name"
            class="placeholder:text-content-400"
          />
        </app-form-field>

        <!-- ==================================================
             EMAIL
             ================================================== -->

        <app-form-field labelKey="common.email" controlId="email">
          <input
            appInput="editor"
            id="email"
            name="email"
            type="email"
            [placeholder]="'common.email' | translate"
            [(ngModel)]="profile.email"
            class="placeholder:text-content-400"
          />
        </app-form-field>

        <!-- ==================================================
             JELSZÓ
             ================================================== -->

        <app-form-field labelKey="common.password" controlId="password_hash">
          <input
            appInput="editor"
            id="password_hash"
            name="password_hash"
            type="password"
            [placeholder]="'common.password' | translate"
            [(ngModel)]="profile.password_hash"
            class="placeholder:text-content-400"
          />
        </app-form-field>

        <!-- ==================================================
             TELEFON
             ================================================== -->

        <app-form-field labelKey="common.phone" controlId="phone">
          <input
            appInput="editor"
            id="phone"
            name="phone"
            type="text"
            [placeholder]="'common.phone' | translate"
            [(ngModel)]="profile.phone"
            class="placeholder:text-content-400"
          />
        </app-form-field>

        <!-- ==================================================
             SPECIALIZÁCIÓ
             ================================================== -->

        <app-form-field
          class="col-span-full"
          labelKey="common.specialization"
          controlId="specialization"
        >
          <textarea
            appTextarea="editor"
            id="specialization"
            name="specialization"
            rows="3"
            [placeholder]="'common.specialization' | translate"
            [(ngModel)]="profile.specialization"
            class="min-h-28 leading-6 placeholder:text-content-400"
          ></textarea>
        </app-form-field>

        <!-- ==================================================
             AVATAR URL
             ================================================== -->

        <app-form-field class="col-span-full" labelKey="common.avatarUrl" controlId="avatar_url">
          <input
            appInput="editor"
            id="avatar_url"
            name="avatar_url"
            type="text"
            [placeholder]="'common.avatarImageUrl' | translate"
            [(ngModel)]="profile.avatar_url"
            class="placeholder:text-content-400"
          />
        </app-form-field>

        <!-- ==================================================
             MENTÉS
             ================================================== -->

        <div class="col-span-full flex justify-end border-t border-info-100 pt-5">
          <app-button
            type="button"
            (buttonClick)="saveProfile()"
            variant="save"
            appearance="solid"
            [fullWidth]="true"
            buttonClass="sm:w-auto"
            class="block w-full sm:w-auto"
          >
            <span><app-icon name="save" sizeClass="h-5 w-5" /></span>
            <span>{{ 'common.save' | translate }}</span>
          </app-button>
        </div>
      </form>
    </app-card>
  </div>
</div>
