<!-- ======================================================
     OLDAL
     ====================================================== -->

<div class="min-h-full bg-transparent">
  <div class="mx-auto w-full max-w-5xl px-3 py-5 sm:px-6 sm:py-8 lg:px-8">

    <!-- ==================================================
         OLDAL CÍM
         ================================================== -->

    <h2
      class="mb-6 flex items-center justify-center gap-2 text-center text-2xl font-bold tracking-tight text-content-800 sm:mb-8 sm:text-3xl"
    >
      <span>👤</span>
      <span>{{ 'coachProfile.title' | translate }}</span>
    </h2>

    <!-- ==================================================
         ÜZENET
         ================================================== -->

    <app-message
      [message]="message"
      [type]="messageType"
    ></app-message>

    <!-- ==================================================
         PROFIL ŰRLAP
         ================================================== -->

    <app-card
      class="mx-auto w-full overflow-hidden"
    >

      <!-- ==================================================
           FEJLÉC
           ================================================== -->

      <div
        class="border-b border-info-100 bg-gradient-to-r from-primary-700 to-primary-800 px-4 py-6 sm:px-6 sm:py-7"
      >
        <div class="flex items-center justify-center">
          <span
            class="flex h-16 w-16 items-center justify-center rounded-2xl bg-white/95 text-4xl shadow-lg ring-1 ring-white/30"
          >
            🧑‍💼
          </span>
        </div>
      </div>

      <!-- ==================================================
           ŰRLAP
           ================================================== -->

      <form
        class="grid min-w-0 grid-cols-1 gap-5 p-4 sm:grid-cols-2 sm:gap-x-6 sm:gap-y-5 sm:p-6"
      >

        <!-- ==================================================
             NÉV
             ================================================== -->

        <app-form-field labelKey="common.name" controlId="name">
          <input
            id="name"
            name="name"
            type="text"
            [placeholder]="'common.name' | translate"
            [(ngModel)]="profile.name"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
          />
        </app-form-field>

        <!-- ==================================================
             EMAIL
             ================================================== -->

        <app-form-field labelKey="common.email" controlId="email">
          <input
            id="email"
            name="email"
            type="email"
            [placeholder]="'common.email' | translate"
            [(ngModel)]="profile.email"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
          />
        </app-form-field>

        <!-- ==================================================
             JELSZÓ
             ================================================== -->

        <app-form-field labelKey="common.password" controlId="password_hash">
          <input
            id="password_hash"
            name="password_hash"
            type="password"
            [placeholder]="'common.password' | translate"
            [(ngModel)]="profile.password_hash"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
          />
        </app-form-field>

        <!-- ==================================================
             TELEFON
             ================================================== -->

        <app-form-field labelKey="common.phone" controlId="phone">
          <input
            id="phone"
            name="phone"
            type="text"
            [placeholder]="'common.phone' | translate"
            [(ngModel)]="profile.phone"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
          />
        </app-form-field>

        <!-- ==================================================
             SPECIALIZÁCIÓ
             ================================================== -->

        <app-form-field
          class="col-span-full"
          labelKey="common.specialization"
          controlId="specialization"
        >
          <textarea
            id="specialization"
            name="specialization"
            rows="3"
            [placeholder]="'common.specialization' | translate"
            [(ngModel)]="profile.specialization"
            class="min-h-28 w-full min-w-0 resize-y rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base leading-6 text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
          ></textarea>
        </app-form-field>

        <!-- ==================================================
             AVATAR URL
             ================================================== -->

        <app-form-field
          class="col-span-full"
          labelKey="common.avatarUrl"
          controlId="avatar_url"
        >
          <input
            id="avatar_url"
            name="avatar_url"
            type="text"
            [placeholder]="'common.avatarImageUrl' | translate"
            [(ngModel)]="profile.avatar_url"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
          />
        </app-form-field>

        <!-- ==================================================
             MENTÉS
             ================================================== -->

        <div
          class="col-span-full flex justify-end border-t border-info-100 pt-5"
        >
          <button
            type="button"
            (click)="saveProfile()"
            class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-primary-700 to-primary-800 px-6 py-2.5 text-sm font-semibold text-white shadow-md shadow-primary-600/20 transition duration-150 hover:from-primary-700 hover:to-primary-700 hover:shadow-lg hover:shadow-primary-600/25 focus:outline-none focus:ring-4 focus:ring-primary-200/50 active:scale-[0.98] sm:w-auto"
          >
            <span>💾</span>
            <span>{{ 'common.save' | translate }}</span>
          </button>
        </div>

      </form>

    </app-card>

  </div>
</div>
