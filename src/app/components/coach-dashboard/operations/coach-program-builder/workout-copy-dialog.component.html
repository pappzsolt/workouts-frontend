<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-surface-900/50 p-4 backdrop-blur-sm"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'coachProgramBuilder.copyWorkout' | translate"
>
  <div class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl border border-surface-200 bg-white shadow-2xl">
    <div class="flex items-start justify-between gap-4 border-b border-surface-100 px-5 py-4 sm:px-6">
      <div class="min-w-0">
        <h3 class="text-lg font-bold text-content-800 sm:text-xl">
          {{ 'coachProgramBuilder.copyWorkout' | translate }}
        </h3>
        <p *ngIf="sourceWorkout" class="mt-1 break-words text-sm text-content-500">
          {{ 'coachProgramBuilder.originalWorkout' | translate }}
          <strong class="font-semibold text-content-700">{{ sourceWorkout.name }}</strong>
        </p>
      </div>
      <button
        type="button"
        [attr.aria-label]="'coachProgramBuilder.close' | translate"
        [disabled]="inProgress"
        (click)="cancel.emit()"
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg border border-surface-200 bg-white text-sm font-bold text-content-500 transition hover:border-delete-200 hover:bg-delete-50 hover:text-delete-600 focus:outline-none focus:ring-4 focus:ring-delete-600/10 disabled:cursor-not-allowed disabled:opacity-40"
      ><app-icon name="x" sizeClass="h-5 w-5" /></button>
    </div>

    <div class="grid grid-cols-1 gap-5 p-5 sm:p-6">
      <div class="min-w-0">
        <label for="copyWorkoutName" class="mb-2 block text-sm font-semibold text-content-700">
          {{ 'coachProgramBuilder.newWorkoutName' | translate }}
        </label>
        <input
          id="copyWorkoutName"
          type="text"
          [ngModel]="workoutName"
          (ngModelChange)="workoutNameChange.emit($event)"
          [disabled]="inProgress"
          [placeholder]="'coachProgramBuilder.newWorkoutNamePlaceholder' | translate"
          class="block min-h-11 w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-surface-400 focus:border-primary-600 focus:ring-4 focus:ring-primary-600/10 disabled:cursor-not-allowed disabled:bg-surface-100 sm:text-sm"
        />
      </div>
      <div class="min-w-0">
        <label for="copyWorkoutDate" class="mb-2 block text-sm font-semibold text-content-700">
          {{ 'coachProgramBuilder.newWorkoutDate' | translate }}
        </label>
        <input
          id="copyWorkoutDate"
          type="date"
          [ngModel]="workoutDate"
          (ngModelChange)="workoutDateChange.emit($event)"
          [disabled]="inProgress"
          class="block min-h-11 w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition hover:border-surface-400 focus:border-primary-600 focus:ring-4 focus:ring-primary-600/10 disabled:cursor-not-allowed disabled:bg-surface-100 sm:text-sm"
        />
      </div>
      <div class="min-w-0">
        <label for="copyWorkoutDayIndex" class="mb-2 block text-sm font-semibold text-content-700">
          {{ 'coachProgramBuilder.workoutDay' | translate }}
        </label>
        <input
          id="copyWorkoutDayIndex"
          type="number"
          min="0"
          [ngModel]="dayIndex"
          (ngModelChange)="dayIndexChange.emit($event)"
          [disabled]="inProgress"
          class="block min-h-11 w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition hover:border-surface-400 focus:border-primary-600 focus:ring-4 focus:ring-primary-600/10 disabled:cursor-not-allowed disabled:bg-surface-100 sm:text-sm"
        />
      </div>
    </div>

    <div class="flex flex-col-reverse gap-3 border-t border-surface-100 px-5 py-4 sm:flex-row sm:justify-end sm:px-6">
      <button
        type="button"
        [disabled]="inProgress"
        (click)="cancel.emit()"
        class="min-h-11 w-full rounded-lg border border-surface-300 bg-white px-5 py-2.5 text-sm font-semibold text-content-700 transition hover:border-surface-400 hover:bg-surface-50 focus:outline-none focus:ring-4 focus:ring-primary-600/10 disabled:cursor-not-allowed disabled:opacity-40 sm:w-auto"
      >{{ 'coachProgramBuilder.cancel' | translate }}</button>
      <button
        type="button"
        [disabled]="inProgress || !workoutName.trim() || !workoutDate || dayIndex < 1"
        (click)="confirm.emit()"
        class="min-h-11 w-full rounded-lg bg-gradient-to-r from-primary-700 to-primary-800 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:from-primary-800 hover:to-primary-800 focus:outline-none focus:ring-4 focus:ring-primary-600/20 disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto"
      >
        {{ inProgress ? ('coachProgramBuilder.copying' | translate) : ('coachProgramBuilder.copyWorkout' | translate) }}
      </button>
    </div>
  </div>
</div>
