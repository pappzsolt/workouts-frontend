<div
  class="min-h-full min-w-0 bg-transparent px-4 py-6 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-7xl min-w-0 flex-col gap-6">

    <!-- ======================================================
         OLDAL FEJLÉC
         ====================================================== -->

    <div
      class="overflow-hidden rounded-2xl bg-gradient-to-r from-primary-700 to-primary-800 shadow-md"
    >
      <div
        class="flex flex-col items-center gap-4 px-5 py-6 text-center sm:flex-row sm:text-left sm:px-7"
      >
        <span
          class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-white text-2xl shadow-md"
        >
          <app-icon name="dumbbell" sizeClass="h-5 w-5" />
        </span>

        <div class="min-w-0">
          <h1 class="text-2xl font-bold text-white sm:text-3xl">
            {{ 'coachProgramBuilder.title' | translate }}
          </h1>

          <p class="mt-1 text-sm text-info-100 sm:text-base">
            {{
              isEditMode
                ? ('coachProgramBuilder.editSubtitle' | translate)
                : ('coachProgramBuilder.createSubtitle' | translate)
            }}
          </p>
        </div>
      </div>
    </div>


    <!-- ======================================================
         ÜZENET
         ====================================================== -->

    <app-message
      [message]="message"
      [type]="messageType"
    ></app-message>


    <!-- ======================================================
         1. LÉPÉS - PROGRAM
         ====================================================== -->

    <app-program-details-form *ngIf="currentStep === 1"
      [form]="document.form" [isEditMode]="isEditMode" [creatingProgram]="document.busy"
      (save)="saveProgram()"></app-program-details-form>

    <!-- ======================================================
         2. LÉPÉS - WORKOUTOK
         ====================================================== -->

    <app-coach-program-builder-workouts
      *ngIf="currentStep === 2"
      [selectedUserIds]="assignment.state.selectedUserIds"
      [assignedUserIds]="assignment.state.assignedUserIds"
      [assignmentBusy]="assignment.busy || !assignment.loaded"
      [isEditMode]="isEditMode"
      [programId]="programId"
      [currentStep]="currentStep"
      (previousStep)="previousStep()"
      (finishProgram)="finishProgram()"
      (selectedUserIdsChange)="assignment.state.select($event)"
      (userSelectionReadyChange)="assignment.selectionReady = $event"
      (goToCreateWorkout)="goToCreateWorkout()"
    ></app-coach-program-builder-workouts>


  </div>
</div>
