<div class="program-workouts-ass-container">

  <!-- Üzenet -->
  <div
    *ngIf="message"
    class="message-box"
    [ngClass]="{
      'message-success': messageStatus === 'success',
      'message-error': messageStatus === 'error'
    }"
  >
    {{ message }}
  </div>


  <!-- Program lista -->
  <div class="content-card">
    <h2 class="section-title">
      Programok
    </h2>

    <app-coach-program-board
      [programs]="programs"
      (programSelected)="onProgramSelected($event)"
    >
    </app-coach-program-board>
  </div>


  <!-- Workout lista -->
  <div class="content-card">
    <h2 class="section-title">
      Elérhető workoutok
    </h2>

    <app-coach-workout-board
      [externalWorkouts]="workouts"
      [selectedWorkoutIds]="selectedWorkoutIds"
      (workoutsChange)="onWorkoutsChange($event)"
    >
    </app-coach-workout-board>
  </div>


  <!-- Kiválasztott workoutok -->
  <div
    *ngIf="selectedWorkoutIds.length"
    class="content-card"
  >
    <h2 class="section-title">
      Kiválasztott workoutok
    </h2>


    <div class="selected-workouts">

      <div
        *ngFor="let wid of selectedWorkoutIds"
        class="selected-workout"
      >
        <span class="selected-workout-id">
          ID: {{ wid }}
        </span>

        <button
          type="button"
          (click)="removeWorkout(wid)"
          class="remove-button"
          title="Eltávolítás"
        >
          ✕
        </button>
      </div>

    </div>


    <!-- Mentés -->
    <div class="save-container">

      <button
        type="button"
        (click)="saveSelectedWorkouts()"
        class="save-button"
      >
        Mentés a programhoz
      </button>

    </div>

  </div>

</div>
