<div
  class="min-h-screen bg-gradient-to-br from-surface-50 via-primary-50/40 to-primary-50/50 px-4 py-6 sm:px-6 lg:px-8"
>
  <!-- Üzenet -->
  @if (message) {
    <div class="mb-6">
      <app-message
        [message]="message"
        [type]="messageStatus"
      ></app-message>
    </div>
  }

  <!-- Program lista -->
  <div class="mb-8 min-w-0">
    <h2 class="mb-4 text-xl font-bold tracking-tight text-content-800 sm:text-2xl">
      Programok
    </h2>

    <app-coach-program-board
      [programs]="programs"
      (programSelected)="onProgramSelected($event)"
    >
    </app-coach-program-board>
  </div>

  <!-- Workout lista -->
  <div class="mb-8 min-w-0">
    <h2 class="mb-4 text-xl font-bold tracking-tight text-content-800 sm:text-2xl">
      Elérhető workoutok
    </h2>

    <app-coach-workout-board
      [externalWorkouts]="workouts"
      [selectedWorkoutIds]="selectedWorkoutIds"
      (workoutsChange)="onWorkoutsChange($event)"
    >
    </app-coach-workout-board>
  </div>

  <!-- Kiválasztott workoutok -->
  @if (selectedWorkoutIds.length) {
    <div
      class="min-w-0 rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:p-6"
    >
      <h2
        class="mb-4 text-xl font-bold tracking-tight text-content-800 sm:text-2xl"
      >
        Kiválasztott workoutok
      </h2>

      <div class="space-y-3">
        @for (wid of selectedWorkoutIds; track wid) {
          <div
            class="flex items-center justify-between rounded-xl border border-surface-200 bg-surface-50 px-4 py-3"
          >
            <span class="font-medium text-content-700">
              ID: {{ wid }}
            </span>

            <button
              type="button"
              (click)="removeWorkout(wid)"
              class="rounded-lg bg-delete-50 px-3 py-2 text-sm font-semibold text-delete-600 transition hover:bg-delete-100"
              title="Eltávolítás"
            >
              ✕
            </button>
          </div>
        }
      </div>

      <!-- Mentés -->
      <div class="mt-6 flex justify-end">
        <button
          type="button"
          (click)="saveSelectedWorkouts()"
          class="rounded-xl bg-gradient-to-r from-primary-600 to-primary-700 px-6 py-3 font-semibold text-white shadow-sm transition hover:from-primary-700 hover:to-primary-700 hover:shadow-md"
        >
          Mentés a programhoz
        </button>
      </div>
    </div>
  }
</div>
