<div
  class="min-h-screen min-w-0 bg-gradient-to-br from-surface-50 via-primary-50/40 to-primary-50/50 px-4 py-6 sm:px-6 lg:px-8"
>
  <div
    class="mx-auto flex w-full max-w-5xl min-w-0 flex-col gap-6"
  >

    <!-- Cím -->
    <h3
      class="text-center text-2xl font-bold text-content-800 sm:text-3xl"
    >
      {{ 'assignProgram.title' | translate }}
    </h3>

    <!-- Felhasználó és program kiválasztás -->
    <div
      class="grid min-w-0 grid-cols-1 gap-5 rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:p-6 lg:grid-cols-2"
    >

      <!-- Felhasználó -->
      <div class="min-w-0">
        <label
          class="mb-2 block text-sm font-semibold text-content-700"
        >
          {{ 'assignProgram.user' | translate }}:
        </label>

        <select
          [(ngModel)]="userId"
          class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition hover:border-surface-400 focus:border-primary-600 focus:ring-4 focus:ring-primary-600/10 sm:text-sm"
        >
          <option [ngValue]="null">
            {{ 'assignProgram.selectUser' | translate }}
          </option>

          <option
            *ngFor="let user of users"
            [ngValue]="user.id"
          >
            {{ user.username }}
          </option>
        </select>
      </div>

      <!-- Program -->
      <div class="min-w-0">
        <app-coach-program-select
          [(selectedProgramId)]="selectedProgramId"
        >
        </app-coach-program-select>
      </div>
    </div>

    <!-- Hozzárendelés gomb -->
    <div class="flex justify-center">
      <button
        type="button"
        (click)="assignProgram()"
        [disabled]="loading"
        class="w-full rounded-lg bg-gradient-to-r from-primary-600 to-primary-700 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:from-primary-700 hover:to-primary-700 focus:outline-none focus:ring-4 focus:ring-primary-600/20 disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto"
      >
        {{ 'assignProgram.assign' | translate }}
      </button>
    </div>

    <!-- Loading -->
    <div
      *ngIf="loading"
      class="rounded-xl border border-info-200 bg-info-50 px-4 py-3 text-center text-sm font-medium text-info-700 shadow-sm"
    >
      {{ 'assignProgram.loading' | translate }}
    </div>

    <!-- Üzenet -->
    <app-message
      *ngIf="message"
      [message]="message"
      [type]="success ? 'success' : 'error'"
    ></app-message>

  </div>
</div>
