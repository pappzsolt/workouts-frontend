<div class="assign-program-container">

  <h3 class="assign-program-title">
    Program hozzárendelés
  </h3>

  <!-- Felhasználó és program kiválasztás -->
  <div class="selection-grid">

    <div class="form-group">
      <label class="form-label">
        Felhasználó:
      </label>

      <select
        [(ngModel)]="userId"
        class="form-select">

        <option [ngValue]="null">
          -- Válassz felhasználót --
        </option>

        <option
          *ngFor="let user of users"
          [ngValue]="user.id">
          {{ user.username }}
        </option>

      </select>
    </div>

    <div class="form-group">
      <app-coach-program-select
        [(selectedProgramId)]="selectedProgramId">
      </app-coach-program-select>
    </div>

  </div>

  <!-- Hozzárendelés gomb -->
  <div class="assign-button-container">

    <button
      (click)="assignProgram()"
      [disabled]="loading"
      class="assign-button">

      Hozzárendelés

    </button>

  </div>

  <!-- Loading -->
  <div
    *ngIf="loading"
    class="loading-message">

    Betöltés...

  </div>

  <!-- Üzenet -->
  <div
    *ngIf="message"
    [ngClass]="{
      'message-success': success,
      'message-error': !success
    }"
    class="message">

    {{ message }}

  </div>

</div>
