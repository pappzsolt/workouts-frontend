<div
  class="min-h-full min-w-0 bg-transparent px-4 py-6 sm:px-6 lg:px-8"
>
  <div
    class="mx-auto flex w-full max-w-5xl min-w-0 flex-col gap-6"
  >

    <!-- Cím -->
    <h3
      class="text-center text-2xl font-bold text-content-800 sm:text-3xl"
    >
      {{ 'assignProgram.title' | translate }}
    </h3>

    <!-- Felhasználó és program kiválasztás -->
    <div
      class="grid min-w-0 grid-cols-1 gap-5 rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:p-6 lg:grid-cols-2"
    >

      <!-- Felhasználó -->
      <div class="min-w-0">
        <label for="assignProgramUser"
          class="mb-2 block text-sm font-semibold text-content-700"
        >
          {{ 'assignProgram.user' | translate }}:
        </label>

        <app-select
          id="assignProgramUser"
          name="userId"
          [value]="userId"
          (valueChange)="userId = $event ?? null"
          [options]="userOptions"
          placeholder="assignProgram.selectUser"
          [placeholderValue]="null"
          [disabled]="loading || !usersReady"
        ></app-select>
      </div>

      <!-- Program -->
      <div class="min-w-0">
        <fieldset [disabled]="loading">
        <app-coach-program-select
          (readyChange)="programReady = $event"
          [(selectedProgramId)]="selectedProgramId"
        >
        </app-coach-program-select>
        </fieldset>
      </div>
    </div>

    <!-- Hozzárendelés gomb -->
    <div class="flex justify-center">
      <button
        type="button"
        (click)="assignProgram()"
        [disabled]="loading || !usersReady || !programReady || !userId"
        class="w-full rounded-lg bg-gradient-to-r from-primary-700 to-primary-800 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:from-primary-700 hover:to-primary-700 focus:outline-none focus:ring-4 focus:ring-primary-600/20 disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto"
      >
        {{ 'assignProgram.assign' | translate }}
      </button>
    </div>

    <!-- Loading -->
    <app-message *ngIf="loading" message="assignProgram.loading" type="info"></app-message>

    <!-- Üzenet -->
    <app-message
      *ngIf="message"
      [message]="message"
      [type]="messageType"
    ></app-message>

  </div>
</div>
