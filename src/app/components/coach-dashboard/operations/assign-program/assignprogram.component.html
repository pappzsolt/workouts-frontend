<div class="assign-program-container">
  <h3 class="assign-program-title">
    {{ 'assignProgram.title' | translate }}
  </h3>

  <!-- Felhasználó és program kiválasztás -->
  <div class="selection-grid">
    <div class="form-group">
      <label class="form-label">
        {{ 'assignProgram.user' | translate }}:
      </label>

      <select [(ngModel)]="userId" class="form-select">
        <option [ngValue]="null">
          {{ 'assignProgram.selectUser' | translate }}
        </option>

        <option *ngFor="let user of users" [ngValue]="user.id">
          {{ user.username }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <app-coach-program-select [(selectedProgramId)]="selectedProgramId">
      </app-coach-program-select>
    </div>
  </div>

  <!-- Hozzárendelés gomb -->
  <div class="assign-button-container">
    <button
      (click)="assignProgram()"
      [disabled]="loading"
      class="assign-button"
    >
      {{ 'assignProgram.assign' | translate }}
    </button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading-message">
    {{ 'assignProgram.loading' | translate }}
  </div>

  <!-- Üzenet -->
  <div
    *ngIf="message"
    [ngClass]="{
      'message-success': success,
      'message-error': !success,
    }"
    class="message"
  >
    {{ message }}
  </div>
</div>
