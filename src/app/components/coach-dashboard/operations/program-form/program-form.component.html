<div
  class="grid min-w-0 grid-cols-1 gap-5 rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:grid-cols-2 sm:p-6"
>
  <!-- Message -->
  <app-message
    *ngIf="message"
    [message]="message"
    [type]="messageType"
    class="sm:col-span-2"
  ></app-message>

  <!-- Program Name -->
  <div class="min-w-0 sm:col-span-2">
    <label
      class="mb-2 block text-sm font-semibold text-content-700"
      for="programName"
    >
      {{ 'programForm.programName' | translate }}
    </label>

    <input
      id="programName"
      formControlName="programName"
      class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-surface-400 focus:border-primary-600 focus:ring-4 focus:ring-primary-600/10 sm:text-sm"
    />
  </div>

  <!-- Description -->
  <div class="min-w-0 sm:col-span-2">
    <label
      class="mb-2 block text-sm font-semibold text-content-700"
      for="programDescription"
    >
      {{ 'programForm.description' | translate }}
    </label>

    <textarea
      id="programDescription"
      formControlName="programDescription"
      rows="3"
      class="block w-full resize-y rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-surface-400 focus:border-primary-600 focus:ring-4 focus:ring-primary-600/10 sm:text-sm"
    ></textarea>
  </div>

  <!-- Start Date -->
  <div class="min-w-0">
    <label
      class="mb-2 block text-sm font-semibold text-content-700"
      for="startDate"
    >
      {{ 'programForm.startDate' | translate }}
    </label>

    <input
      type="date"
      id="startDate"
      formControlName="startDate"
      class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition hover:border-surface-400 focus:border-primary-600 focus:ring-4 focus:ring-primary-600/10 sm:text-sm"
    />
  </div>

  <!-- Calculated End Date -->
  <div class="min-w-0">
    <label
      class="mb-2 block text-sm font-semibold text-content-700"
      for="endDate"
    >
      {{ 'programForm.endDate' | translate }}
    </label>

    <input
      type="date"
      id="endDate"
      [value]="calculatedEndDate"
      readonly
      class="block w-full rounded-lg border border-surface-300 bg-surface-100 px-3.5 py-2.5 text-base text-content-600 shadow-sm outline-none sm:text-sm"
    />
  </div>

  <!-- Duration -->
  <div class="min-w-0">
    <label
      class="mb-2 block text-sm font-semibold text-content-700"
      for="durationDays"
    >
      {{ 'programForm.duration' | translate }}
    </label>

    <input
      type="number"
      id="durationDays"
      formControlName="durationDays"
      class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition hover:border-surface-400 focus:border-primary-600 focus:ring-4 focus:ring-primary-600/10 sm:text-sm"
    />
  </div>

  <!-- Difficulty Level -->
  <div class="min-w-0">
    <label
      class="mb-2 block text-sm font-semibold text-content-700"
      for="difficultyLevel"
    >
      {{ 'programForm.difficultyLevel' | translate }}
    </label>

    <input
      id="difficultyLevel"
      formControlName="difficultyLevel"
      class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-surface-400 focus:border-primary-600 focus:ring-4 focus:ring-primary-600/10 sm:text-sm"
    />
  </div>

  <!-- Submit Button -->
  <div
    class="flex min-w-0 justify-end pt-1 sm:col-span-2"
  >
    <app-button
      type="button"
      (buttonClick)="submit()"
      variant="primary"
      appearance="solid"
      [fullWidth]="true"
      buttonClass="sm:w-auto"
      class="block w-full sm:w-auto"
    >
      {{
        isEditMode
          ? ('programForm.updateProgram' | translate)
          : ('programForm.createProgram' | translate)
      }}
    </app-button>
  </div>
</div>
