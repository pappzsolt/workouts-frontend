<div
  class="grid min-w-0 grid-cols-1 gap-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:grid-cols-2 sm:p-6"
>
  <!-- Name -->
  <div class="min-w-0 sm:col-span-2">
    <label
      class="mb-2 block text-sm font-semibold text-slate-700"
      for="name"
    >
      {{ 'programForm.programName' | translate }}
    </label>

    <input
      id="name"
      formControlName="name"
      class="block w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-base text-slate-800 shadow-sm outline-none transition placeholder:text-slate-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
    />
  </div>

  <!-- Description -->
  <div class="min-w-0 sm:col-span-2">
    <label
      class="mb-2 block text-sm font-semibold text-slate-700"
      for="description"
    >
      {{ 'programForm.description' | translate }}
    </label>

    <textarea
      id="description"
      formControlName="description"
      rows="3"
      class="block w-full resize-y rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-base text-slate-800 shadow-sm outline-none transition placeholder:text-slate-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
    ></textarea>
  </div>

  <!-- Duration -->
  <div class="min-w-0">
    <label
      class="mb-2 block text-sm font-semibold text-slate-700"
      for="duration_days"
    >
      {{ 'programForm.duration' | translate }}
    </label>

    <input
      type="number"
      id="duration_days"
      formControlName="duration_days"
      class="block w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-base text-slate-800 shadow-sm outline-none transition hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
    />
  </div>

  <!-- Difficulty Level -->
  <div class="min-w-0">
    <label
      class="mb-2 block text-sm font-semibold text-slate-700"
      for="difficulty_level"
    >
      {{ 'programForm.difficultyLevel' | translate }}
    </label>

    <input
      id="difficulty_level"
      formControlName="difficulty_level"
      class="block w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-base text-slate-800 shadow-sm outline-none transition hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
    />
  </div>

  <!-- Coach ID -->
  <div class="min-w-0">
    <label
      class="mb-2 block text-sm font-semibold text-slate-700"
      for="coach_id"
    >
      {{ 'programForm.coachId' | translate }}
    </label>

    <input
      type="number"
      id="coach_id"
      formControlName="coach_id"
      class="block w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-base text-slate-800 shadow-sm outline-none transition hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
    />
  </div>

  <!-- Submit Button -->
  <div
    class="flex min-w-0 justify-end pt-1 sm:col-span-2"
  >
    <button
      type="button"
      (click)="submit()"
      class="w-full rounded-lg bg-gradient-to-r from-primary-600 to-primary-700 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-4 focus:ring-blue-600/20 sm:w-auto"
    >
      {{
        isEditMode
          ? ('programForm.updateProgram' | translate)
          : ('programForm.createProgram' | translate)
      }}
    </button>
  </div>
</div>
