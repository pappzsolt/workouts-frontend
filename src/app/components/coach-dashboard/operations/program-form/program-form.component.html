<div
  class="grid min-w-0 grid-cols-1 gap-5 rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:grid-cols-2 sm:p-6"
>
  <!-- Message -->
  <app-message
    *ngIf="message"
    [message]="message"
    [type]="messageType"
    class="sm:col-span-2"
  ></app-message>

  <app-program-details-form
    class="block sm:col-span-2"
    mode="reactive"
    [reactiveForm]="form"
    [endDate]="calculatedEndDate"
    [isEditMode]="isEditMode"
    (save)="submit()"
  ></app-program-details-form>
</div>
