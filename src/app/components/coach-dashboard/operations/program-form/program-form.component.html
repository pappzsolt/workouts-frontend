<div
  class="grid min-w-0 grid-cols-1 gap-5 rounded-2xl border border-surface-200 bg-white p-5 shadow-sm sm:grid-cols-2 sm:p-6"
>
  <!-- Message -->
  <app-message
    *ngIf="message"
    [message]="message | translate"
    [type]="messageType"
    class="sm:col-span-2"
  ></app-message>

  <!-- Program Name -->
  <div class="min-w-0 sm:col-span-2">
    <label
      class="mb-2 block text-sm font-semibold text-content-700"
      for="programName"
    >
      {{ 'programForm.programName' | translate }}
    </label>

    <input
      id="programName"
      formControlName="programName"
      class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
    />
  </div>

  <!-- Description -->
  <div class="min-w-0 sm:col-span-2">
    <label
      class="mb-2 block text-sm font-semibold text-content-700"
      for="programDescription"
    >
      {{ 'programForm.description' | translate }}
    </label>

    <textarea
      id="programDescription"
      formControlName="programDescription"
      rows="3"
      class="block w-full resize-y rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
    ></textarea>
  </div>

  <!-- Duration -->
  <div class="min-w-0">
    <label
      class="mb-2 block text-sm font-semibold text-content-700"
      for="durationDays"
    >
      {{ 'programForm.duration' | translate }}
    </label>

    <input
      type="number"
      id="durationDays"
      formControlName="durationDays"
      class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
    />
  </div>

  <!-- Difficulty Level -->
  <div class="min-w-0">
    <label
      class="mb-2 block text-sm font-semibold text-content-700"
      for="difficultyLevel"
    >
      {{ 'programForm.difficultyLevel' | translate }}
    </label>

    <input
      id="difficultyLevel"
      formControlName="difficultyLevel"
      class="block w-full rounded-lg border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-800 shadow-sm outline-none transition placeholder:text-content-400 hover:border-slate-400 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 sm:text-sm"
    />
  </div>

  <!-- Submit Button -->
  <div
    class="flex min-w-0 justify-end pt-1 sm:col-span-2"
  >
    <button
      type="button"
      (click)="submit()"
      class="w-full rounded-lg bg-gradient-to-r from-primary-600 to-primary-700 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-4 focus:ring-blue-600/20 sm:w-auto"
    >
      {{
        isEditMode
          ? ('programForm.updateProgram' | translate)
          : ('programForm.createProgram' | translate)
      }}
    </button>
  </div>
</div>
