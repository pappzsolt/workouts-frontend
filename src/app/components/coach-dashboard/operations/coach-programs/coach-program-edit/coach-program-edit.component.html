<h2 class="programs-title">
  ✏️ {{ 'coachProgramEdit.title' | translate }}
</h2>

<!-- Üzenet -->
<div
  *ngIf="message"
  class="form-message"
  [ngClass]="{
    'form-message-success': messageType === 'success',
    'form-message-error': messageType === 'error',
  }"
>
  {{ message | translate }}
</div>

<!-- Kártyás form -->
<div class="program-card">
  <!-- Ikon -->
  <div class="program-image">
    <span class="program-emoji">🛠️</span>
  </div>

  <form
    (ngSubmit)="saveProgram()"
    class="program-form"
  >
    <!-- Program Name -->
    <div class="form-group-full">
      <label
        class="form-label"
        for="programName"
      >
        {{ 'coachProgramEdit.programName' | translate }}
      </label>

      <input
        type="text"
        id="programName"
        name="programName"
        [placeholder]="'coachProgramEdit.programNamePlaceholder' | translate"
        [(ngModel)]="program.programName"
        required
        class="form-input"
      />
    </div>

    <!-- Description -->
    <div class="form-group-full">
      <label
        class="form-label"
        for="programDescription"
      >
        {{ 'coachProgramEdit.description' | translate }}
      </label>

      <textarea
        id="programDescription"
        name="programDescription"
        rows="3"
        [placeholder]="'coachProgramEdit.descriptionPlaceholder' | translate"
        [(ngModel)]="program.programDescription"
        class="form-input form-textarea"
      ></textarea>
    </div>

    <!-- Duration -->
    <div class="form-group">
      <label
        class="form-label"
        for="durationDays"
      >
        {{ 'coachProgramEdit.duration' | translate }}
      </label>

      <input
        type="number"
        id="durationDays"
        name="durationDays"
        [placeholder]="'coachProgramEdit.durationPlaceholder' | translate"
        [(ngModel)]="program.durationDays"
        class="form-input"
        min="1"
      />
    </div>

    <!-- Difficulty -->
    <div class="form-group">
      <label
        class="form-label"
        for="difficultyLevel"
      >
        {{ 'coachProgramEdit.difficultyLevel' | translate }}
      </label>

      <select
        id="difficultyLevel"
        name="difficultyLevel"
        [(ngModel)]="program.difficultyLevel"
        class="form-input"
      >
        <option value="">
          {{ 'coachProgramEdit.selectDifficulty' | translate }}
        </option>

        <option value="Easy">
          {{ 'coachProgramEdit.easy' | translate }}
        </option>

        <option value="Medium">
          {{ 'coachProgramEdit.medium' | translate }}
        </option>

        <option value="Hard">
          {{ 'coachProgramEdit.hard' | translate }}
        </option>
      </select>
    </div>

    <!-- Gomb -->
    <div class="form-submit">
      <button
        type="submit"
        class="form-button"
      >
        💾 {{ 'coachProgramEdit.save' | translate }}
      </button>
    </div>
  </form>
</div>
