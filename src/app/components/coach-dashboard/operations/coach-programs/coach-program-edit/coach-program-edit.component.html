<h2 class="programs-title">
  ✏️ Edit Program
</h2>

<!-- Üzenet -->
<div
  *ngIf="message"
  class="form-message"
  [ngClass]="{
    'form-message-success': messageType === 'success',
    'form-message-error': messageType === 'error'
  }"
>
  {{ message }}
</div>

<!-- Kártyás form -->
<div class="program-card">

  <!-- Ikon -->
  <div class="program-image">
    <span class="program-emoji">🛠️</span>
  </div>

  <form
    (ngSubmit)="saveProgram()"
    class="program-form"
  >

    <!-- Program Name -->
    <div class="form-group-full">
      <label
        class="form-label"
        for="programName"
      >
        Program Name
      </label>

      <input
        type="text"
        id="programName"
        name="programName"
        placeholder="Program Name"
        [(ngModel)]="program.programName"
        required
        class="form-input"
      />
    </div>

    <!-- Description -->
    <div class="form-group-full">
      <label
        class="form-label"
        for="programDescription"
      >
        Description
      </label>

      <textarea
        id="programDescription"
        name="programDescription"
        rows="3"
        placeholder="Program Description"
        [(ngModel)]="program.programDescription"
        class="form-input form-textarea"
      ></textarea>
    </div>

    <!-- Duration -->
    <div class="form-group">
      <label
        class="form-label"
        for="durationDays"
      >
        Duration (days)
      </label>

      <input
        type="number"
        id="durationDays"
        name="durationDays"
        placeholder="Duration"
        [(ngModel)]="program.durationDays"
        class="form-input"
        min="1"
      />
    </div>

    <!-- Difficulty -->
    <div class="form-group">
      <label
        class="form-label"
        for="difficultyLevel"
      >
        Difficulty Level
      </label>

      <select
        id="difficultyLevel"
        name="difficultyLevel"
        [(ngModel)]="program.difficultyLevel"
        class="form-input"
      >
        <option value="">Select</option>
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
      </select>
    </div>

    <!-- Gomb -->
    <div class="form-submit">
      <button
        type="submit"
        class="form-button"
      >
        💾 Save Program
      </button>
    </div>

  </form>
</div>
