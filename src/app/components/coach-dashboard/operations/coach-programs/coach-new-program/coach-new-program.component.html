<h2 class="universal-form-title">
  ➕ {{ 'coachNewProgram.title' | translate }}
</h2>

<!-- Üzenet -->
<div
  *ngIf="message"
  class="universal-form-message"
  [ngClass]="{
    'universal-form-message-success': messageType === 'success',
    'universal-form-message-error': messageType === 'error',
  }"
>
  {{ message | translate }}
</div>

<!-- Program form kártya -->
<div class="form-card">
  <div class="form-header">
    <span class="form-header-emoji">💪</span>
  </div>

  <form
    (ngSubmit)="saveProgram()"
    class="universal-form"
  >
    <!-- Program Name -->
    <div class="universal-form-group-full">
      <label
        for="programName"
        class="universal-form-label"
      >
        {{ 'coachNewProgram.programName' | translate }}
      </label>

      <input
        type="text"
        id="programName"
        name="programName"
        [placeholder]="'coachNewProgram.programNamePlaceholder' | translate"
        [(ngModel)]="program.programName"
        required
        class="universal-form-input"
      />
    </div>

    <!-- Description -->
    <div class="universal-form-group-full">
      <label
        for="programDescription"
        class="universal-form-label"
      >
        {{ 'coachNewProgram.description' | translate }}
      </label>

      <textarea
        id="programDescription"
        name="programDescription"
        rows="3"
        [placeholder]="'coachNewProgram.descriptionPlaceholder' | translate"
        [(ngModel)]="program.programDescription"
        class="universal-form-textarea"
      ></textarea>
    </div>

    <!-- Duration -->
    <div class="universal-form-group">
      <label
        for="durationDays"
        class="universal-form-label"
      >
        {{ 'coachNewProgram.duration' | translate }}
      </label>

      <input
        type="number"
        id="durationDays"
        name="durationDays"
        [placeholder]="'coachNewProgram.durationPlaceholder' | translate"
        [(ngModel)]="program.durationDays"
        class="universal-form-input"
        min="1"
      />
    </div>

    <!-- Difficulty -->
    <div class="universal-form-group">
      <label
        for="difficultyLevel"
        class="universal-form-label"
      >
        {{ 'coachNewProgram.difficultyLevel' | translate }}
      </label>

      <select
        id="difficultyLevel"
        name="difficultyLevel"
        [(ngModel)]="program.difficultyLevel"
        class="universal-form-select"
      >
        <option value="">
          {{ 'coachNewProgram.selectDifficulty' | translate }}
        </option>

        <option value="Easy">
          {{ 'coachNewProgram.easy' | translate }}
        </option>

        <option value="Medium">
          {{ 'coachNewProgram.medium' | translate }}
        </option>

        <option value="Hard">
          {{ 'coachNewProgram.hard' | translate }}
        </option>
      </select>
    </div>

    <!-- Mentés gomb -->
    <div class="universal-form-submit">
      <button
        type="submit"
        class="universal-form-button"
      >
        💾 {{ 'coachNewProgram.save' | translate }}
      </button>
    </div>
  </form>
</div>
