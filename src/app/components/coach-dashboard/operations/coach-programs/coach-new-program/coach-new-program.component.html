<!-- ======================================================
     OLDAL
     ====================================================== -->

<div class="min-h-full bg-transparent">
  <div class="mx-auto w-full max-w-5xl px-3 py-5 sm:px-6 sm:py-8 lg:px-8">

    <!-- ==================================================
         OLDAL CÍM
         ================================================== -->

    <h1
      class="mb-6 flex items-center justify-center gap-2 text-center text-2xl font-bold tracking-tight text-content-800 sm:mb-8 sm:text-3xl"
    >
      <span><app-icon name="circle-plus" sizeClass="h-5 w-5" /></span>
      <span>{{ 'coachNewProgram.title' | translate }}</span>
    </h1>

    <!-- ==================================================
         ÜZENET
         ================================================== -->

    <app-message
      [message]="message"
      [type]="messageType"
    ></app-message>

    <!-- ==================================================
         PROGRAM FORM KÁRTYA
         ================================================== -->

    <app-card>
      <!-- ==================================================
           FEJLÉC
           ================================================== -->

      <div
        class="border-b border-info-100 bg-gradient-to-r from-primary-700 to-primary-800 px-4 py-6 sm:px-6 sm:py-7"
      >
        <div class="flex items-center justify-center">
      <span
        class="flex h-16 w-16 items-center justify-center rounded-2xl bg-white/95 text-4xl shadow-lg ring-1 ring-white/30"
      >
        <app-icon name="dumbbell" sizeClass="h-5 w-5" />
      </span>
        </div>
      </div>

      <!-- ==================================================
           ŰRLAP
           ================================================== -->

      <form
        (ngSubmit)="saveProgram()"
        class="grid min-w-0 grid-cols-1 gap-5 p-4 sm:grid-cols-2 sm:gap-x-6 sm:gap-y-5 sm:p-6"
      >
        <!-- ==================================================
             PROGRAM NÉV
             ================================================== -->

        <app-form-field
          class="col-span-full"
          labelKey="coachNewProgram.programName"
          controlId="programName"
          [required]="true"
        >
          <input
            type="text"
            id="programName"
            name="programName"
            [placeholder]="'coachNewProgram.programNamePlaceholder' | translate"
            [(ngModel)]="program.programName"
            required
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
          />
        </app-form-field>

        <!-- ==================================================
             LEÍRÁS
             ================================================== -->

        <app-form-field
          class="col-span-full"
          labelKey="coachNewProgram.description"
          controlId="programDescription"
        >
          <textarea
            id="programDescription"
            name="programDescription"
            rows="3"
            [placeholder]="'coachNewProgram.descriptionPlaceholder' | translate"
            [(ngModel)]="program.programDescription"
            class="min-h-28 w-full min-w-0 resize-y rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base leading-6 text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
          ></textarea>
        </app-form-field>

        <!-- ==================================================
             IDŐTARTAM
             ================================================== -->

        <app-form-field
          labelKey="coachNewProgram.duration"
          controlId="durationDays"
        >
          <input
            type="number"
            id="durationDays"
            name="durationDays"
            [placeholder]="'coachNewProgram.durationPlaceholder' | translate"
            [(ngModel)]="program.durationDays"
            min="1"
            class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
          />
        </app-form-field>

        <!-- ==================================================
             NEHÉZSÉGI SZINT
             ================================================== -->

        <app-form-field
          labelKey="coachNewProgram.difficultyLevel"
          controlId="difficultyLevel"
        >
          <app-select
            id="difficultyLevel"
            name="difficultyLevel"
            [(value)]="program.difficultyLevel"
            [placeholder]="'coachNewProgram.selectDifficulty'"
            placeholderValue=""
            [className]="'min-h-11 w-full min-w-0 cursor-pointer rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 hover:border-primary-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm'"
            [options]="[
    { value: 'Easy', label: 'coachNewProgram.easy' },
    { value: 'Medium', label: 'coachNewProgram.medium' },
    { value: 'Hard', label: 'coachNewProgram.hard' }
            ]"
          />
        </app-form-field>

        <!-- ==================================================
             MENTÉS
             ================================================== -->

        <div
          class="col-span-full flex justify-end border-t border-info-100 pt-5"
        >
          <app-button
            variant="save"
            type="submit"
            [label]="'coachNewProgram.save' | translate"
            [lucideIcon]="'save'"
          ></app-button>
        </div>
      </form>
    </app-card>
  </div>
</div>
