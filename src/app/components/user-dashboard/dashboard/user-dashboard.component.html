<div class="min-h-full bg-surface-50 px-4 py-6 sm:px-6 lg:px-8">
  <div class="mx-auto flex w-full max-w-7xl flex-col gap-6">
    <!-- Oldal címe -->
    <div appPageHeader>
      <h2 appHeading="page">
        {{ 'userDashboard.title' | translate }}
      </h2>
    </div>

    <!-- Dashboard kártyák -->
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
      <app-dashboard-action icon="barbell" [label]="'workoutTemplates.title' | translate" (activated)="navigateTo('user/workout-templates')" />
      <app-dashboard-action icon="barbell" [label]="'personalWorkouts.create' | translate" (activated)="navigateTo('user/personal-workouts/new')" />
      <app-dashboard-action
        icon="pencil-simple"
        [label]="'personalPrograms.title' | translate"
        (activated)="navigateTo('user/personal-programs')"
      ></app-dashboard-action>
      <app-dashboard-action
        icon="book-open-text"
        [label]="'userDashboard.myPrograms' | translate"
        (activated)="navigateTo('user/my-programs')"
      ></app-dashboard-action>

      <app-dashboard-action
        icon="chart-line-up"
        [label]="'userDashboard.programStatistics' | translate"
        (activated)="navigateTo('user/program-statistics')"
      ></app-dashboard-action>

      <app-dashboard-action
        icon="calendar-blank"
        [label]="'userDashboard.myWorkouts' | translate"
        (activated)="navigateTo('user/workouts')"
      ></app-dashboard-action>
    </div>
  </div>
</div>
