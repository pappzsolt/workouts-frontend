<div
  class="min-h-full bg-surface-50 px-4 py-6 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-7xl flex-col gap-6">

    <!-- Oldal címe -->
    <div class="text-center">
      <h2
        class="text-2xl font-bold tracking-tight text-content-800 sm:text-3xl"
      >
        {{ 'userDashboard.title' | translate }}
      </h2>
    </div>

    <!-- Dashboard kártyák -->
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">

      <app-dashboard-action
        icon="book-open"
        label="userDashboard.myPrograms"
        (activated)="navigateTo('user/my-programs')"
      ></app-dashboard-action>

      <app-dashboard-action
        icon="chart-column-increasing"
        label="userDashboard.programStatistics"
        (activated)="navigateTo('user/program-statistics')"
      ></app-dashboard-action>

      <app-dashboard-action
        icon="calendar-days"
        label="userDashboard.myWorkouts"
        (activated)="navigateTo('user/workouts')"
      ></app-dashboard-action>

    </div>

  </div>
</div>
