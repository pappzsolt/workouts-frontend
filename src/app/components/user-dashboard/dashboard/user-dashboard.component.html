<div
  class="min-h-screen bg-slate-50 px-4 py-6 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full max-w-7xl flex-col gap-6">

    <!-- Oldal címe -->
    <div class="text-center">
      <h2
        class="text-2xl font-bold tracking-tight text-slate-800 sm:text-3xl"
      >
        {{ 'userDashboard.title' | translate }}
      </h2>
    </div>

    <!-- Dashboard kártyák -->
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">

      <!-- My Programs -->
      <button
        type="button"
        class="group flex min-h-44 flex-col items-center justify-center rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-slate-300 hover:shadow-md focus:outline-none focus:ring-4 focus:ring-slate-400/20"
        (click)="navigateTo('user/my-programs')"
      >
        <div
          class="mb-4 flex h-16 w-16 items-center justify-center rounded-xl bg-slate-100 text-3xl text-slate-700 shadow-sm transition-transform duration-200 group-hover:scale-105"
        >
          📚
        </div>

        <div
          class="text-base font-semibold text-slate-800 sm:text-lg"
        >
          {{ 'userDashboard.myPrograms' | translate }}
        </div>
      </button>

      <!-- Statistics -->
      <button
        type="button"
        class="group flex min-h-44 flex-col items-center justify-center rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-slate-300 hover:shadow-md focus:outline-none focus:ring-4 focus:ring-slate-400/20"
        (click)="navigateTo('user/statistics')"
      >
        <div
          class="mb-4 flex h-16 w-16 items-center justify-center rounded-xl bg-slate-100 text-3xl text-slate-700 shadow-sm transition-transform duration-200 group-hover:scale-105"
        >
          📊
        </div>

        <div
          class="text-base font-semibold text-slate-800 sm:text-lg"
        >
          {{ 'userDashboard.statistics' | translate }}
        </div>
      </button>

      <!-- Program Statistics -->
      <button
        type="button"
        class="group flex min-h-44 flex-col items-center justify-center rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-slate-300 hover:shadow-md focus:outline-none focus:ring-4 focus:ring-slate-400/20"
        (click)="navigateTo('user/program-statistics')"
      >
        <div
          class="mb-4 flex h-16 w-16 items-center justify-center rounded-xl bg-slate-100 text-3xl text-slate-700 shadow-sm transition-transform duration-200 group-hover:scale-105"
        >
          📈
        </div>

        <div
          class="text-base font-semibold text-slate-800 sm:text-lg"
        >
          {{ 'userDashboard.programStatistics' | translate }}
        </div>
      </button>

      <!-- My Workouts -->
      <button
        type="button"
        class="group flex min-h-44 flex-col items-center justify-center rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-slate-300 hover:shadow-md focus:outline-none focus:ring-4 focus:ring-slate-400/20"
        (click)="navigateTo('user/workouts')"
      >
        <div
          class="mb-4 flex h-16 w-16 items-center justify-center rounded-xl bg-slate-100 text-3xl text-slate-700 shadow-sm transition-transform duration-200 group-hover:scale-105"
        >
          📅
        </div>

        <div
          class="text-base font-semibold text-slate-800 sm:text-lg"
        >
          {{ 'userDashboard.myWorkouts' | translate }}
        </div>
      </button>

    </div>

  </div>
</div>
