<div class="min-h-screen min-w-0 bg-gradient-to-br from-slate-50 via-orange-50/30 to-amber-50/40 px-4 py-6 sm:px-6 lg:px-8">
  <div class="mx-auto flex w-full max-w-4xl min-w-0 flex-col gap-6">

    <!-- Fejléc -->
    <div class="relative isolate overflow-hidden rounded-2xl bg-gradient-to-r from-primary-600 to-primary-700 px-6 py-8 text-center shadow-lg sm:px-8">
      <!-- Dekoratív körök -->
      <div class="pointer-events-none absolute -right-10 -top-12 -z-10 h-40 w-40 rounded-full bg-white/10"></div>
      <div class="pointer-events-none absolute -bottom-16 -left-8 -z-10 h-36 w-36 rounded-full bg-white/10"></div>

      <div class="relative">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl border border-white/20 bg-white/15 text-3xl shadow-sm backdrop-blur-sm">
          📊
        </div>

        <h2 class="mt-4 break-words text-2xl font-bold tracking-tight text-white sm:text-3xl">
          {{ 'userStatistics.title' | translate }}
        </h2>
      </div>
    </div>

    <!-- Statisztikák -->
    <div
      *ngIf="stats$ | async as stats"
      class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-primary-200 hover:shadow-md sm:p-8"
    >
      <!-- Statisztikai értékek -->
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

        <!-- Teljesített edzések -->
        <div class="rounded-xl border border-primary-100 bg-gradient-to-br from-primary-50/70 to-white px-5 py-6 text-center shadow-sm">
          <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-primary-100 text-2xl">
            🏋️
          </div>

          <div class="text-sm font-semibold leading-5 text-content-500">
            {{ 'userStatistics.workoutsCompleted' | translate }}
          </div>

          <div class="mt-3 text-4xl font-bold tracking-tight text-primary-700">
            {{ stats.workoutCompleted }}
          </div>
        </div>

        <!-- Összes óra -->
        <div class="rounded-xl border border-primary-100 bg-gradient-to-br from-primary-50/70 to-white px-5 py-6 text-center shadow-sm">
          <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-primary-100 text-2xl">
            ⏱️
          </div>

          <div class="text-sm font-semibold leading-5 text-content-500">
            {{ 'userStatistics.totalHours' | translate }}
          </div>

          <div class="mt-3 text-4xl font-bold tracking-tight text-primary-700">
            {{ stats.totalHours }}
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
