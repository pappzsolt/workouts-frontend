<h2 class="statistics-title">
  {{ 'userStatistics.title' | translate }}
</h2>

<div
  *ngIf="stats$ | async as stats"
  class="statistics-card"
>
  <div class="statistics-icon">📊</div>

  <div class="statistics-completed">
    {{ 'userStatistics.workoutsCompleted' | translate }}:
    {{ stats.workoutCompleted }}
  </div>

  <div class="statistics-hours">
    {{ 'userStatistics.totalHours' | translate }}:
    {{ stats.totalHours }}
  </div>
</div>
