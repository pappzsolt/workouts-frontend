<div class="profile-page">
  <h2 class="profile-title">
    {{ 'userProfile.title' | translate }}
  </h2>

  <div *ngIf="message" class="profile-message">
    {{ message | translate }}
  </div>

  <form class="profile-form">
    <!-- Username -->
    <div class="profile-form-group">
      <label
        class="profile-label"
        for="username"
      >
        {{ 'userProfile.username' | translate }}
      </label>

      <input
        id="username"
        name="username"
        type="text"
        [placeholder]="'userProfile.usernamePlaceholder' | translate"
        [(ngModel)]="selectedUser.username"
        class="profile-input"
      />
    </div>

    <!-- Email -->
    <div class="profile-form-group">
      <label
        class="profile-label"
        for="email"
      >
        {{ 'userProfile.email' | translate }}
      </label>

      <input
        id="email"
        name="email"
        type="email"
        [placeholder]="'userProfile.emailPlaceholder' | translate"
        [(ngModel)]="selectedUser.email"
        class="profile-input"
      />
    </div>

    <!-- Password -->
    <div class="profile-form-group">
      <label
        class="profile-label"
        for="password_hash"
      >
        {{ 'userProfile.password' | translate }}
      </label>

      <input
        id="password_hash"
        name="password_hash"
        type="password"
        [placeholder]="'userProfile.passwordPlaceholder' | translate"
        [(ngModel)]="selectedUser.password"
        class="profile-input"
      />
    </div>

    <!-- Age -->
    <div class="profile-form-group">
      <label
        class="profile-label"
        for="age"
      >
        {{ 'userProfile.age' | translate }}
      </label>

      <input
        id="age"
        name="age"
        type="number"
        [placeholder]="'userProfile.agePlaceholder' | translate"
        [(ngModel)]="selectedUser.age"
        class="profile-input"
      />
    </div>

    <!-- Weight -->
    <div class="profile-form-group">
      <label
        class="profile-label"
        for="weight"
      >
        {{ 'userProfile.weight' | translate }}
      </label>

      <input
        id="weight"
        name="weight"
        type="number"
        step="0.01"
        [placeholder]="'userProfile.weightPlaceholder' | translate"
        [(ngModel)]="selectedUser.weight"
        class="profile-input"
      />
    </div>

    <!-- Height -->
    <div class="profile-form-group">
      <label
        class="profile-label"
        for="height"
      >
        {{ 'userProfile.height' | translate }}
      </label>

      <input
        id="height"
        name="height"
        type="number"
        step="0.01"
        [placeholder]="'userProfile.heightPlaceholder' | translate"
        [(ngModel)]="selectedUser.height"
        class="profile-input"
      />
    </div>

    <!-- Goals -->
    <div class="profile-form-group profile-form-group-full">
      <label
        class="profile-label"
        for="goals"
      >
        {{ 'userProfile.goals' | translate }}
      </label>

      <textarea
        id="goals"
        name="goals"
        rows="3"
        [placeholder]="'userProfile.goalsPlaceholder' | translate"
        [(ngModel)]="selectedUser.goals"
        class="profile-textarea"
      ></textarea>
    </div>

    <!-- Avatar -->
    <div class="profile-form-group profile-form-group-full">
      <label
        class="profile-label"
        for="avatar_url"
      >
        {{ 'userProfile.avatarUrl' | translate }}
      </label>

      <input
        id="avatar_url"
        name="avatar_url"
        type="text"
        [placeholder]="'userProfile.avatarUrlPlaceholder' | translate"
        [(ngModel)]="selectedUser.avatarUrl"
        class="profile-input"
      />
    </div>

    <!-- Coach -->
    <div class="profile-form-group profile-form-group-full">
      <label class="profile-label">
        {{ 'userProfile.coach' | translate }}
      </label>

      <div class="profile-coach">
        {{ coachName }}
      </div>
    </div>

    <!-- Save -->
    <div class="profile-submit">
      <button
        type="button"
        (click)="onSave()"
        class="profile-save-button"
      >
        {{ 'userProfile.save' | translate }}
      </button>
    </div>
  </form>
</div>
