<div class="profile-page">

  <h2 class="profile-title">Profile</h2>

  <div *ngIf="message" class="profile-message">
    {{ message }}
  </div>

  <form class="profile-form">

    <!-- Username -->
    <div class="profile-form-group">
      <label class="profile-label" for="username">
        Username
      </label>

      <input
        id="username"
        name="username"
        type="text"
        placeholder="Username"
        [(ngModel)]="selectedUser.username"
        class="profile-input"
      />
    </div>

    <!-- Email -->
    <div class="profile-form-group">
      <label class="profile-label" for="email">
        Email
      </label>

      <input
        id="email"
        name="email"
        type="email"
        placeholder="Email"
        [(ngModel)]="selectedUser.email"
        class="profile-input"
      />
    </div>

    <!-- Password -->
    <div class="profile-form-group">
      <label class="profile-label" for="password_hash">
        Password
      </label>

      <input
        id="password_hash"
        name="password_hash"
        type="password"
        placeholder="Password"
        [(ngModel)]="selectedUser.password"
        class="profile-input"
      />
    </div>

    <!-- Age -->
    <div class="profile-form-group">
      <label class="profile-label" for="age">
        Age
      </label>

      <input
        id="age"
        name="age"
        type="number"
        placeholder="Age"
        [(ngModel)]="selectedUser.age"
        class="profile-input"
      />
    </div>

    <!-- Weight -->
    <div class="profile-form-group">
      <label class="profile-label" for="weight">
        Weight (kg)
      </label>

      <input
        id="weight"
        name="weight"
        type="number"
        step="0.01"
        placeholder="Weight"
        [(ngModel)]="selectedUser.weight"
        class="profile-input"
      />
    </div>

    <!-- Height -->
    <div class="profile-form-group">
      <label class="profile-label" for="height">
        Height (cm)
      </label>

      <input
        id="height"
        name="height"
        type="number"
        step="0.01"
        placeholder="Height"
        [(ngModel)]="selectedUser.height"
        class="profile-input"
      />
    </div>

    <!-- Goals -->
    <div class="profile-form-group profile-form-group-full">
      <label class="profile-label" for="goals">
        Goals
      </label>

      <textarea
        id="goals"
        name="goals"
        rows="3"
        placeholder="Your goals"
        [(ngModel)]="selectedUser.goals"
        class="profile-textarea"
      ></textarea>
    </div>

    <!-- Avatar -->
    <div class="profile-form-group profile-form-group-full">
      <label class="profile-label" for="avatar_url">
        Avatar URL
      </label>

      <input
        id="avatar_url"
        name="avatar_url"
        type="text"
        placeholder="Avatar image URL"
        [(ngModel)]="selectedUser.avatarUrl"
        class="profile-input"
      />
    </div>

    <!-- Coach -->
    <div class="profile-form-group profile-form-group-full">
      <label class="profile-label">
        Coach
      </label>

      <div class="profile-coach">
        {{ coachName }}
      </div>
    </div>

    <!-- Save -->
    <div class="profile-submit">
      <button
        type="button"
        (click)="onSave()"
        class="profile-save-button"
      >
        Save
      </button>
    </div>

  </form>

</div>
