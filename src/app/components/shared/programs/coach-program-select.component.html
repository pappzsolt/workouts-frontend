<div class="mb-5">
  <label for="coachProgramSelect" class="mb-2 block text-sm font-semibold text-content-700">
    {{ 'coachProgramSelect.program' | translate }}:
  </label>

  <app-select
    id="coachProgramSelect"
    [value]="selectedProgramId"
    [options]="programOptions"
    placeholder="coachProgramSelect.selectProgram"
    [placeholderValue]="undefined"
    [placeholderDisabled]="true"
    (valueChange)="onProgramSelect($event)"
  ></app-select>
</div>

<div
  *ngIf="loading"
  class="mt-3 rounded-xl border border-surface-200 bg-white px-4 py-3 text-sm font-medium text-content-500 shadow-sm"
>
  {{ 'coachProgramSelect.loading' | translate }}
</div>

<div
  *ngIf="message"
  class="mt-3 rounded-xl border border-delete-200 bg-delete-50 px-4 py-3 text-sm font-medium text-delete-700"
>
  {{ message | translate }}
</div>
