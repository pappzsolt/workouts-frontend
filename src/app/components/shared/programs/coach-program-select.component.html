<div class="mb-5">
  <label class="mb-2 block text-sm font-semibold text-content-700">
    {{ 'coachProgramSelect.program' | translate }}:
  </label>

  <select
    [(ngModel)]="selectedProgramId"
    (ngModelChange)="onProgramSelect($event)"
    class="min-h-11 w-full rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
  >
    <option
      [ngValue]="null"
      disabled
      selected
    >
      {{ 'coachProgramSelect.selectProgram' | translate }}
    </option>

    <option
      *ngFor="let program of programs"
      [value]="program.programId"
    >
      {{ program.programName }}
    </option>
  </select>
</div>

<div
  *ngIf="loading"
  class="mt-3 rounded-xl border border-surface-200 bg-white px-4 py-3 text-sm font-medium text-content-500 shadow-sm"
>
  {{ 'coachProgramSelect.loading' | translate }}
</div>

<div
  *ngIf="message"
  class="mt-3 rounded-xl border border-delete-200 bg-delete-50 px-4 py-3 text-sm font-medium text-delete-700"
>
  {{ message | translate }}
</div>
