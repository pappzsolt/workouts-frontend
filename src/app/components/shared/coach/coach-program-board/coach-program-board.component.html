<app-search
  inputId="programBoardSearch"
  [searchTerm]="searchTerm"
  label="appSearch.programsLabel"
  placeholder="appSearch.programsPlaceholder"
  [showClearButton]="true"
  (searchTermChange)="searchTerm = $event"
  class="mb-4 block"
></app-search>

<!-- Betöltés állapot -->
<app-message *ngIf="loading" message="coachProgramBoard.loading" type="info" class="block"></app-message>

<!-- Üzenet -->
<app-message
  *ngIf="message && !loading"
  [message]="message"
  [type]="'error'"
  class="block"
></app-message>

<!-- Program oszlopok -->
<div
  *ngIf="!loading && filteredPrograms.length"
  class="grid min-w-0 grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
>
  <div
    *ngFor="let program of filteredPrograms; trackBy: trackByProgram"
    class="min-w-0"
  >
    <!-- Program kiválasztása rádiógombbal -->
    <div class="relative h-full">

      <input
        type="radio"
        name="selectedProgram"
        [value]="program.programId"
        [(ngModel)]="selectedProgramId"
        (change)="onSelectProgram(program.programId)"
        id="program-{{ program.programId }}"
        class="peer sr-only"
      />

      <label
        for="program-{{ program.programId }}"
        class="flex min-h-32 w-full cursor-pointer items-center gap-4 rounded-2xl border border-surface-200 bg-white px-5 py-5 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-primary-200 hover:shadow-md peer-checked:border-primary-500 peer-checked:bg-primary-50/50 peer-checked:ring-2 peer-checked:ring-primary-500/20"
      >
        <!-- Radio vizuális jelzése -->
        <span
          class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 bg-white transition-colors"
          [class.border-surface-300]="selectedProgramId !== program.programId"
          [class.border-primary-600]="selectedProgramId === program.programId"
        >
          <span
            class="h-3 w-3 rounded-full bg-primary-600 transition-opacity"
            [class.opacity-0]="selectedProgramId !== program.programId"
            [class.opacity-100]="selectedProgramId === program.programId"
          ></span>
        </span>

        <!-- Program név + dátumok -->
        <div class="min-w-0 flex-1">
          <span
            class="block break-words text-base font-semibold leading-snug text-content-800 sm:text-lg"
          >
            {{ program.programName }}
          </span>

          <span
            *ngIf="program.startDate || program.endDate"
            class="mt-1 block text-xs text-content-500"
          >
            {{ program.startDate | date:'yyyy.MM.dd' }}
            –
            {{ program.endDate | date:'yyyy.MM.dd' }}
          </span>
        </div>
      </label>

    </div>
  </div>
</div>

<!-- Nincs program -->
<app-message
  *ngIf="!loading && !message && !filteredPrograms.length"
  [message]="searchTerm.trim() ? 'appSearch.noResults' : 'coachProgramBoard.noPrograms'"
  type="info"
  class="block"
></app-message>
