<div
  *ngIf="loading"
  class="text-gray-500 p-6 text-center"
>
  {{ 'coachWorkoutBoard.loading' | translate }}
</div>

<div
  *ngIf="message && !loading"
  class="p-4 mb-4 rounded-xl text-center font-medium"
  [ngClass]="{
    'bg-red-50 text-red-700 border border-red-200': messageType === 'error',
    'bg-green-50 text-green-700 border border-green-200': messageType === 'success',
  }"
>
  <span *ngIf="messageType === 'error'; else translatedMessage">
    {{ message }}
  </span>

  <ng-template #translatedMessage>
    {{ message | translate }}
  </ng-template>
</div>

<div
  *ngIf="!loading && workouts?.length"
  class="coach-board grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 pb-6 max-h-[600px] overflow-y-auto p-2"
>
  <div
    *ngFor="let workout of workouts"
    class="group relative bg-white border border-gray-200 rounded-2xl shadow-sm hover:shadow-md hover:border-blue-300 transition-all duration-200 p-5 min-h-[150px] flex flex-col"
  >
    <!-- Kiválasztás -->
    <div class="flex items-center justify-between mb-4">
      <label
        for="workout-{{ workout.id }}"
        class="flex items-center cursor-pointer"
      >
        <input
          type="checkbox"
          [checked]="selectedWorkoutIds.includes(workout.id!)"
          (change)="toggleWorkoutSelection(workout.id!, $any($event.target).checked)"
          id="workout-{{ workout.id }}"
          class="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
        />

        <span class="ml-2 text-sm font-medium text-gray-600">
          {{ 'coachWorkoutBoard.select' | translate }}
        </span>
      </label>

      <span
        class="text-xs font-medium text-gray-400 bg-gray-100 px-2 py-1 rounded-lg"
      >
        ID {{ workout.id }}
      </span>
    </div>

    <!-- Workout név -->
    <div class="flex-1 flex items-center justify-center text-center">
      <p
        class="text-base sm:text-lg font-semibold text-gray-800 line-clamp-3"
      >
        {{
          workout.name ||
          ('coachWorkoutBoard.noName' | translate)
        }}
      </p>
    </div>

    <!-- Alsó információ -->
    <div
      class="mt-4 pt-3 border-t border-gray-100 text-xs text-gray-400 text-center"
    >
      {{ 'coachWorkoutBoard.workout' | translate }}
    </div>
  </div>
</div>
