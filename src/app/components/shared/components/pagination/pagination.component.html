
<!-- ======================================================
     LAPOZÓ
     ====================================================== -->

<div
  *ngIf="totalPages > 0"
  class="flex w-full flex-col items-center justify-center
         gap-3 rounded-2xl border border-primary-100
         bg-white p-4 shadow-sm
         sm:flex-row sm:gap-5"
>
  <!-- Előző oldal -->

  <button
    type="button"
    (click)="previousPage()"
    [disabled]="!hasPreviousPage"
    class="w-full rounded-lg border border-primary-200
           bg-white px-4 py-2.5 text-sm font-semibold
           text-primary-700 transition
           hover:bg-primary-50 hover:text-primary-700
           focus:outline-none focus:ring-4
           focus:ring-primary-600/10
           disabled:cursor-not-allowed
           disabled:opacity-40 sm:w-auto"
  >
    ◀ {{ 'common.previous' | translate }}
  </button>

  <!-- Aktuális oldal -->

  <span
    class="min-w-20 text-center text-sm font-semibold
           text-content-700"
  >
    {{ 'coachExercisesBoard.page' | translate }}
    {{ currentPage }} / {{ totalPages }}
  </span>

  <!-- Következő oldal -->

  <button
    type="button"
    (click)="nextPage()"
    [disabled]="!hasNextPage"
    class="w-full rounded-lg border border-primary-200
           bg-white px-4 py-2.5 text-sm font-semibold
           text-primary-700 transition
           hover:bg-primary-50 hover:text-primary-700
           focus:outline-none focus:ring-4
           focus:ring-primary-600/10
           disabled:cursor-not-allowed
           disabled:opacity-40 sm:w-auto"
  >
    {{ 'common.next' | translate }} ▶
  </button>
</div>
