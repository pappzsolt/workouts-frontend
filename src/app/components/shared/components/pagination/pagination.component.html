
<!-- ======================================================
     LAPOZÓ
     ====================================================== -->

<div
  *ngIf="totalPages > 0"
  class="flex w-full flex-col items-center justify-center
         gap-3 rounded-2xl border border-primary-100
         bg-white p-4 shadow-sm
         sm:flex-row sm:gap-5"
>
  <!-- Előző oldal -->

  <app-button
    type="button"
    (buttonClick)="previousPage()"
    [disabled]="!hasPreviousPage"
    variant="secondary"
    appearance="outline"
    [fullWidth]="true"
    buttonClass="sm:w-auto"
    class="block w-full sm:w-auto"
  >
    ◀ {{ 'common.previous' | translate }}
  </app-button>

  <!-- Aktuális oldal -->

  <span
    class="min-w-20 text-center text-sm font-semibold
           text-content-700"
  >
    {{ 'coachExercisesBoard.page' | translate }}
    {{ currentPage }} / {{ totalPages }}
  </span>

  <!-- Következő oldal -->

  <app-button
    type="button"
    (buttonClick)="nextPage()"
    [disabled]="!hasNextPage"
    variant="secondary"
    appearance="outline"
    [fullWidth]="true"
    buttonClass="sm:w-auto"
    class="block w-full sm:w-auto"
  >
    {{ 'common.next' | translate }} ▶
  </app-button>
</div>
