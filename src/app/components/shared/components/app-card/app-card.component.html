<div
  class="group flex min-w-0 flex-col overflow-hidden rounded-2xl shadow-md transition duration-200"
  [ngClass]="{
    'border-4 border-primary-600 bg-primary-100 shadow-primary-300/50 hover:-translate-y-1 hover:border-primary-800 hover:shadow-xl hover:shadow-primary-400/60':
      variant === 'default',

    'border border-surface-200 bg-white shadow-sm':
      variant === 'outlined'
  }"
>
  <ng-content></ng-content>
</div>
