<div *ngIf="open" class="confirm-backdrop" role="presentation">
  <section class="confirm-panel" role="alertdialog" aria-modal="true"
           aria-labelledby="confirm-title" aria-describedby="confirm-description">
    <h2 id="confirm-title" class="confirm-title">{{ 'userWorkoutExerciseManager.deleteConfirmTitle' | translate }}</h2>
    <div id="confirm-description">
      <app-message [message]="message" [messageParams]="messageParams" type="info"></app-message>
    </div>
    <div class="confirm-actions">
      <app-button type="button" [disabled]="busy" (buttonClick)="cancelled.emit()" variant="secondary" appearance="outline">
        {{ cancelLabel | translate }}
      </app-button>
      <app-button type="button" [disabled]="busy" (buttonClick)="confirmed.emit()" variant="delete" appearance="solid">
        {{ confirmLabel | translate }}
      </app-button>
    </div>
  </section>
</div>
