<button
  type="button"
  (click)="activated.emit()"
  class="group flex min-h-52 w-full min-w-0 cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-surface-200 bg-white p-6 text-center shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-primary-300 hover:bg-primary-50/40 hover:shadow-md focus:outline-none focus:ring-4 focus:ring-primary-500/20 active:scale-[0.99] sm:p-8"
>
  <span class="mb-5 flex h-20 w-20 items-center justify-center rounded-2xl bg-primary-50 text-primary-700 shadow-sm transition-transform duration-200 group-hover:scale-110" aria-hidden="true">
    <app-icon [name]="icon" sizeClass="h-10 w-10" />
  </span>

  <span
    class="break-words text-lg font-bold text-content-800 sm:text-xl"
  >
    {{ label | translate }}
  </span>
</button>
