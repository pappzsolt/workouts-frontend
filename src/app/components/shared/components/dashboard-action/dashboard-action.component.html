<button
  type="button"
  (click)="activated.emit()"
  class="workouts-action-card group flex min-h-52 w-full min-w-0 cursor-pointer flex-col items-center justify-center rounded-2xl border border-surface-200 bg-white p-6 text-center shadow-sm transition-all duration-200 hover:border-primary-300 hover:bg-primary-50/40 hover:shadow-md focus:outline-none focus:ring-4 focus:ring-primary-500/20 active:scale-[0.99] sm:p-8"
>
  <span
    class="workouts-action-icon phosphor-dashboard-icon mb-5 flex h-20 w-20 items-center justify-center rounded-2xl bg-primary-50 text-primary-700 transition-transform duration-200"
    aria-hidden="true"
  >
    <app-phosphor-icon [name]="icon" sizeClass="text-4xl" />
  </span>

  <span
    class="break-words text-lg font-bold text-content-800 sm:text-xl"
  >
    {{ label | translate }}
  </span>
</button>
