<button
  type="button"
  (click)="activated.emit()"
  class="group flex min-w-0 cursor-pointer flex-col items-center justify-center rounded-2xl border border-surface-200 bg-white text-center shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-surface-300 hover:shadow-md focus:outline-none focus:ring-4 focus:ring-surface-400/20"
  [ngClass]="
    size === 'compact'
      ? 'min-h-36 p-6'
      : 'min-h-44 p-6'
  "
>
  <span
    class="flex items-center justify-center rounded-xl bg-surface-100 text-content-700 shadow-sm transition-transform duration-200 group-hover:scale-105"
    [ngClass]="
      size === 'compact'
        ? 'mb-3 h-14 w-14 text-2xl'
        : 'mb-4 h-16 w-16 text-3xl'
    "
    aria-hidden="true"
  >
    {{ icon }}
  </span>

  <span
    class="break-words font-semibold text-content-800"
    [ngClass]="size === 'compact' ? 'text-base' : 'text-base sm:text-lg'"
  >
    {{ label | translate }}
  </span>
</button>
