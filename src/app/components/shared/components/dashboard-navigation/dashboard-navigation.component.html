@if (items.length) {
  <nav [attr.aria-label]="'dashboardNavigation.label' | translate"
       class="workouts-breadcrumb mx-2 mt-3 flex min-w-0 flex-wrap items-center gap-2 rounded-xl border border-surface-200 px-3 py-2 sm:mx-6 sm:mt-4 lg:mx-8">
    <ol class="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-2 text-sm">
      @for (item of items; track $index; let last = $last; let first = $first) {
        <li class="flex min-w-0 max-w-full items-center gap-2">
          @if (!first) {
            <span aria-hidden="true" class="text-content-400">/</span>
          }
          @if (last && isCurrent(item.url)) {
            <span aria-current="page" class="min-w-0 break-words font-semibold text-content-800">{{ item.label | translate }}</span>
          } @else {
            <a [routerLink]="link(item.url)" class="min-w-0 break-words rounded py-1 text-primary-700 underline-offset-4 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-600">{{ item.label | translate }}</a>
          }
        </li>
      }
    </ol>
  </nav>
}
