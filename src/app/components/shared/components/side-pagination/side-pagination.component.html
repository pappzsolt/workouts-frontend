<!-- ======================================================
     KÖZÖS LAPOZÓ
====================================================== -->

<div class="w-full">

  <!-- ====================================================
       KÁRTYA + OLDALSÓ NYILAK
       ==================================================== -->

  <div
    class="relative mx-auto w-full"
    [class.max-w-sm]="!fullWidth && !fullWidthMobile"
    [class.max-w-none]="fullWidth || fullWidthMobile"
    [ngClass]="{ 'sm:max-w-sm': fullWidthMobile && !fullWidth }"
  >

    <!-- ==================================================
         KÁRTYA
         ================================================== -->

    <div class="w-full min-w-0">
      <ng-content></ng-content>
    </div>

    <!-- ==================================================
         ELŐZŐ
         ================================================== -->

    <button
      *ngIf="totalPages > 1"
      type="button"
      [attr.aria-label]="'common.previous' | translate"
      [disabled]="currentPage <= 1"
      (click)="onPreviousPage()"
      class="absolute -left-3 top-1/2 z-10
             flex h-11 w-11 -translate-y-1/2
             items-center justify-center
             rounded-full
             border border-primary-700
             bg-primary-700
             text-white
             shadow-sm
             transition
             hover:border-primary-800
             hover:bg-primary-800
             disabled:cursor-not-allowed
             disabled:opacity-30
             sm:-left-5
             sm:h-11 sm:w-11"
    >
      <svg
        lucideChevronLeft
        class="h-4 w-4 sm:h-5 sm:w-5"
        aria-hidden="true"
      ></svg>
    </button>

    <!-- ==================================================
         KÖVETKEZŐ
         ================================================== -->

    <button
      *ngIf="totalPages > 1"
      type="button"
      [attr.aria-label]="'common.next' | translate"
      [disabled]="currentPage >= totalPages"
      (click)="onNextPage()"
      class="absolute -right-3 top-1/2 z-10
             flex h-11 w-11 -translate-y-1/2
             items-center justify-center
             rounded-full
             border border-primary-700
             bg-primary-700
             text-white
             shadow-sm
             transition
             hover:border-primary-800
             hover:bg-primary-800
             disabled:cursor-not-allowed
             disabled:opacity-30
             sm:-right-5
             sm:h-11 sm:w-11"
    >
      <svg
        lucideChevronRight
        class="h-4 w-4 sm:h-5 sm:w-5"
        aria-hidden="true"
      ></svg>
    </button>

  </div>

  <!-- ==================================================
       OLDALSZÁM
       ================================================== -->

  <div
    *ngIf="totalPages > 1"
    class="mt-5 text-center text-sm font-medium text-content-600"
    aria-live="polite"
  >
    {{ currentPage }} / {{ totalPages }}
  </div>

</div>
