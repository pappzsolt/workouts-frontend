<!-- ======================================================
     LAPOZÓ KÖZÖS KERETE
====================================================== -->

<div class="mx-auto w-full">

  <!-- ====================================================
       KÁRTYA + OLDALSÓ NYILAK
       ==================================================== -->

  <div
    class="relative w-full"
    [ngClass]="
      fullWidth
        ? 'px-6 sm:px-0'
        : fullWidthMobile
          ? 'px-6 sm:px-0'
          : 'px-12 sm:px-0'
    "
  >

    <!-- ==================================================
         KÁRTYA TARTALOM
         ================================================== -->

    <div class="w-full min-w-0">

      <ng-content></ng-content>

    </div>

    <!-- ==================================================
         ELŐZŐ
         ================================================== -->

    <button
      *ngIf="totalPages > 1"
      type="button"
      aria-label="Előző oldal"
      [disabled]="currentPage <= 1"
      (click)="onPreviousPage()"
      class="absolute left-0 top-1/2 z-10
             flex h-6 w-6 -translate-y-1/2
             items-center justify-center
             rounded-full
             border border-primary-600
             bg-primary-600
             text-white
             shadow-sm
             transition
             hover:border-primary-700
             hover:bg-primary-700
             disabled:cursor-not-allowed
             disabled:opacity-30
             sm:h-10 sm:w-10"
      [ngClass]="
        fullWidth
          ? '-left-2'
          : fullWidthMobile
            ? '-left-2 sm:left-1'
            : 'left-1 sm:left-5'
      "
    >
      <svg
        lucideChevronLeft
        class="h-4 w-4 sm:h-5 sm:w-5"
        aria-hidden="true"
      ></svg>
    </button>

    <!-- ==================================================
         KÖVETKEZŐ
         ================================================== -->

    <button
      *ngIf="totalPages > 1"
      type="button"
      aria-label="Következő oldal"
      [disabled]="currentPage >= totalPages"
      (click)="onNextPage()"
      class="absolute right-0 top-1/2 z-10
             flex h-6 w-6 -translate-y-1/2
             items-center justify-center
             rounded-full
             border border-primary-600
             bg-primary-600
             text-white
             shadow-sm
             transition
             hover:border-primary-700
             hover:bg-primary-700
             disabled:cursor-not-allowed
             disabled:opacity-30
             sm:h-10 sm:w-10"
      [ngClass]="
        fullWidth
          ? '-right-2'
          : fullWidthMobile
            ? '-right-2 sm:right-1'
            : 'right-1 sm:right-5'
      "
    >
      <svg
        lucideChevronRight
        class="h-4 w-4 sm:h-5 sm:w-5"
        aria-hidden="true"
      ></svg>
    </button>

  </div>

  <!-- ==================================================
       OLDALSZÁM
       ================================================== -->

  <div
    *ngIf="totalPages > 1"
    class="mt-5 text-center text-sm font-medium text-content-600"
    aria-live="polite"
  >
    {{ currentPage }} / {{ totalPages }}
  </div>

</div>
