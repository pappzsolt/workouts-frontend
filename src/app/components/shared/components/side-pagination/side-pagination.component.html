<!-- ======================================================
     LAPOZÓ ÉS KÁRTYA KÖZÖS KERETE
====================================================== -->

<div class="mx-auto w-full max-w-6xl">

  <!-- ====================================================
       KÁRTYA TERÜLETE + OLDALSÓ NYILAK
       ==================================================== -->
  <div
    class="relative"
    [ngClass]="
      fullWidth
        ? 'px-6 sm:px-0'
        : fullWidthMobile
          ? 'px-6 sm:px-0'
          : 'px-12 sm:px-0'
    "
  >

    <!-- ==================================================
         KÁRTYA KÖZÉPEN
         ================================================== -->
    <div
      class="mx-auto w-full min-w-0"
      [ngClass]="
        fullWidth
          ? 'max-w-none'
          : fullWidthMobile
            ? 'max-w-none sm:max-w-4xl'
            : 'max-w-lg'
      "
    >
      <ng-content></ng-content>
    </div>


    <!-- ==================================================
         ELŐZŐ OLDAL
         ================================================== -->
    <button
      *ngIf="totalPages > 1"
      type="button"
      aria-label="Előző oldal"
      [disabled]="currentPage <= 1"
      (click)="onPreviousPage()"
      class="absolute top-1/2 z-10
             flex h-6 w-6 -translate-y-1/2
             items-center justify-center
             rounded-full
             border border-primary-600
             bg-primary-600
             text-white
             shadow-sm
             transition
             hover:bg-primary-700
             hover:border-primary-700
             disabled:cursor-not-allowed
             disabled:opacity-30
             sm:h-10 sm:w-10"
      [ngClass]="
        fullWidth
          ? '-left-2'
          : fullWidthMobile
            ? '-left-2 sm:left-1'
            : 'left-1 sm:left-5'
      "
    >
      <svg
        lucideChevronLeft
        class="h-4 w-4 sm:h-5 sm:w-5"
        aria-hidden="true"
      ></svg>
    </button>


    <!-- ==================================================
         KÖVETKEZŐ OLDAL
         ================================================== -->
    <button
      *ngIf="totalPages > 1"
      type="button"
      aria-label="Következő oldal"
      [disabled]="currentPage >= totalPages"
      (click)="onNextPage()"
      class="absolute top-1/2 z-10
             flex h-6 w-6 -translate-y-1/2
             items-center justify-center
             rounded-full
             border border-primary-600
             bg-primary-600
             text-white
             shadow-sm
             transition
             hover:bg-primary-700
             hover:border-primary-700
             disabled:cursor-not-allowed
             disabled:opacity-30
             sm:h-10 sm:w-10"
      [ngClass]="
        fullWidth
          ? '-right-2'
          : fullWidthMobile
            ? '-right-2 sm:right-1'
            : 'right-1 sm:right-5'
      "
    >
      <svg
        lucideChevronRight
        class="h-4 w-4 sm:h-5 sm:w-5"
        aria-hidden="true"
      ></svg>
    </button>

  </div>


  <!-- ====================================================
       OLDALSZÁM A KÁRTYA ALATT
       ==================================================== -->
  <div
    *ngIf="totalPages > 1"
    class="mt-5 text-center text-sm font-medium text-content-600"
    aria-live="polite"
  >
    {{ currentPage }} / {{ totalPages }}
  </div>

</div>
