<!-- ======================================================
     LAPOZÓ ÉS KÁRTYA KÖZÖS KERETE
====================================================== -->

<div class="mx-auto w-full max-w-6xl">

  <!-- ====================================================
       KÁRTYA TERÜLETE + OLDALSÓ NYILAK
       ==================================================== -->
  <div class="relative">

    <!-- ==================================================
         PROGRAMKÁRTYA KÖZÉPEN
         ================================================== -->
    <div
      class="mx-auto w-full min-w-0"
      [ngClass]="
        fullWidthMobile
          ? 'max-w-none'
          : 'max-w-md'
      "
    >
      <ng-content></ng-content>
    </div>


    <!-- ==================================================
         ELŐZŐ OLDAL
         ================================================== -->
    <button
      *ngIf="totalPages > 1"
      type="button"
      aria-label="Előző oldal"
      [disabled]="currentPage <= 1"
      (click)="onPreviousPage()"
      class="absolute top-1/2 z-10
             flex h-10 w-10 -translate-y-1/2
             items-center justify-center
             rounded-full border border-surface-300
             bg-white text-content-700 shadow-sm
             transition hover:bg-surface-100
             disabled:cursor-not-allowed disabled:opacity-30
             sm:h-12 sm:w-12"
      [ngClass]="
        fullWidthMobile
          ? 'left-0 -translate-x-1/2'
          : 'left-1 sm:left-5'
      "
    >
      <!-- LUCIDE CHEVRON LEFT -->
      <svg
        lucideChevronLeft
        class="h-5 w-5 sm:h-6 sm:w-6"
        aria-hidden="true"
      ></svg>
    </button>


    <!-- ==================================================
         KÖVETKEZŐ OLDAL
         ================================================== -->
    <button
      *ngIf="totalPages > 1"
      type="button"
      aria-label="Következő oldal"
      [disabled]="currentPage >= totalPages"
      (click)="onNextPage()"
      class="absolute top-1/2 z-10
             flex h-10 w-10 -translate-y-1/2
             items-center justify-center
             rounded-full border border-surface-300
             bg-white text-content-700 shadow-sm
             transition hover:bg-surface-100
             disabled:cursor-not-allowed disabled:opacity-30
             sm:h-12 sm:w-12"
      [ngClass]="
        fullWidthMobile
          ? 'right-0 translate-x-1/2'
          : 'right-1 sm:right-5'
      "
    >
      <!-- LUCIDE CHEVRON RIGHT -->
      <svg
        lucideChevronRight
        class="h-5 w-5 sm:h-6 sm:w-6"
        aria-hidden="true"
      ></svg>
    </button>

  </div>


  <!-- ====================================================
       OLDALSZÁM A KÁRTYA ALATT
       ==================================================== -->
  <div
    *ngIf="totalPages > 1"
    class="mt-5 text-center text-sm font-medium text-content-600"
    aria-live="polite"
  >
    {{ currentPage }} / {{ totalPages }}
  </div>

</div>
