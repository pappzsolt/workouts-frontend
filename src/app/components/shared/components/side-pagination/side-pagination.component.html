<!-- ======================================================
     KÖZÖS LAPOZÓ
====================================================== -->

<div class="w-full">

  <!-- ====================================================
       KÁRTYA + OLDALSÓ NYILAK
       ==================================================== -->

  <div
    class="relative mx-auto w-full"
    [class.max-w-sm]="!fullWidth && !fullWidthMobile"
    [class.max-w-none]="fullWidth || fullWidthMobile"
    [ngClass]="{ 'sm:max-w-sm': fullWidthMobile && !fullWidth }"
  >

    <!-- ==================================================
         KÁRTYA
         ================================================== -->

    <div class="w-full min-w-0">
      <ng-content></ng-content>
    </div>

    <!-- ==================================================
         ELŐZŐ
         ================================================== -->

    <app-button
      *ngIf="totalPages > 1"
      type="button"
      [ariaLabel]="'common.previous' | translate"
      [disabled]="currentPage <= 1"
      (buttonClick)="onPreviousPage()"
      variant="secondary"
      appearance="outline"
      [iconOnly]="true"
      [round]="true"
      class="absolute top-1/2 z-10 -translate-y-1/2 -left-3 sm:-left-5"
    >
      <app-icon name="chevron-left" sizeClass="h-5 w-5" />
    </app-button>

    <!-- ==================================================
         KÖVETKEZŐ
         ================================================== -->

    <app-button
      *ngIf="totalPages > 1"
      type="button"
      [ariaLabel]="'common.next' | translate"
      [disabled]="currentPage >= totalPages"
      (buttonClick)="onNextPage()"
      variant="secondary"
      appearance="outline"
      [iconOnly]="true"
      [round]="true"
      class="absolute top-1/2 z-10 -translate-y-1/2 -right-3 sm:-right-5"
    >
      <app-icon name="chevron-right" sizeClass="h-5 w-5" />
    </app-button>

  </div>

  <!-- ==================================================
       OLDALSZÁM
       ================================================== -->

  <div
    *ngIf="totalPages > 1"
    class="mt-5 text-center text-sm font-medium text-content-600"
    aria-live="polite"
  >
    {{ currentPage }} / {{ totalPages }}
  </div>

</div>
