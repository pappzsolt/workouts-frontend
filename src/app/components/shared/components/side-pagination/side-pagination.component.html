<!-- OLDALSÓ LAPOZÓ -->
<div
  class="flex w-full items-center justify-center gap-1 sm:gap-5"
  *ngIf="totalPages > 1"
>

  <!-- ELŐZŐ OLDAL -->
  <button
    type="button"
    class="flex h-11 w-11 shrink-0 items-center justify-center
           rounded-full border border-surface-300 bg-white
           text-content-700 shadow-sm transition
           hover:bg-surface-100
           disabled:cursor-not-allowed disabled:opacity-30
           sm:h-12 sm:w-12"
    [disabled]="currentPage <= 1"
    (click)="onPreviousPage()"
    aria-label="Előző oldal"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5 sm:h-6 sm:w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15 19l-7-7 7-7"
      />
    </svg>
  </button>

  <!-- OLDALSZÁM -->
  <span
    class="whitespace-nowrap text-sm font-medium text-content-500"
    aria-live="polite"
  >
    {{ currentPage }} / {{ totalPages }}
  </span>

  <!-- KÖVETKEZŐ OLDAL -->
  <button
    type="button"
    class="flex h-11 w-11 shrink-0 items-center justify-center
           rounded-full border border-surface-300 bg-white
           text-content-700 shadow-sm transition
           hover:bg-surface-100
           disabled:cursor-not-allowed disabled:opacity-30
           sm:h-12 sm:w-12"
    [disabled]="currentPage >= totalPages"
    (click)="onNextPage()"
    aria-label="Következő oldal"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5 sm:h-6 sm:w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M9 5l7 7-7 7"
      />
    </svg>
  </button>

</div>
