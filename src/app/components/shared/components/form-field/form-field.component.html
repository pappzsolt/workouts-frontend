<div class="flex min-w-0 flex-col gap-2">
  <label
    *ngIf="labelKey"
    [for]="controlId || null"
    class="block text-sm font-semibold text-content-700"
  >
    {{ labelKey | translate }}{{ labelSuffix }}
    <span *ngIf="required" aria-hidden="true">*</span>
  </label>

  <ng-content></ng-content>
  @if (hint) {
    <p [id]="hintId" class="text-xs text-content-500">{{ hint | translate }}</p>
  }
  @if (showError && error) {
    <p [id]="errorId" role="alert" class="form-field-error text-sm text-delete-700">
      {{ error | translate }}
    </p>
  }
</div>
