<div class="flex min-w-0 flex-col gap-2">
  <label
    *ngIf="labelKey"
    [for]="controlId || null"
    class="block text-sm font-semibold text-content-700"
  >
    {{ labelKey | translate }}{{ labelSuffix }}
    <span *ngIf="required" aria-hidden="true">*</span>
  </label>

  <ng-content></ng-content>
</div>
