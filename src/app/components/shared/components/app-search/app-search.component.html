<!-- Keresés -->
<div class="flex min-w-0 flex-col gap-2">
  <label
    [for]="inputId"
    class="text-sm font-semibold text-content-700"
  >
    {{ label | translate }}
  </label>

  <input
    [id]="inputId"
    type="text"
    [ngModel]="searchTerm"
    (ngModelChange)="onSearchChange($event)"
    [placeholder]="placeholder | translate"
    autocomplete="off"
    class="min-h-11 w-full min-w-0 rounded-xl border border-surface-300 bg-white px-3.5 py-2.5 text-base text-content-900 shadow-sm outline-none transition duration-150 placeholder:text-content-400 hover:border-blue-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 sm:text-sm"
  />
</div>
