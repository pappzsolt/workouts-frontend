<button
  [type]="type"
  [disabled]="disabled"
  [attr.title]="title || null"
  [attr.aria-label]="ariaLabel || label || title || null"
  [attr.aria-expanded]="ariaExpanded"
  [attr.aria-controls]="ariaControls || null"
  (click)="onClick($event)"
  [ngClass]="[
    'inline-flex items-center justify-center gap-2 font-semibold transition duration-200 focus:outline-none disabled:cursor-not-allowed disabled:opacity-50',

    floating
      ? 'fixed bottom-5 right-5 z-50 h-14 w-14 rounded-full text-2xl shadow-xl transition duration-200 hover:scale-105 focus:ring-4 active:scale-95 sm:bottom-7 sm:right-7'
      : 'rounded-xl',

    !floating && size === 'sm' ? 'px-3 py-1.5 text-xs' : '',

    !floating && size === 'md' ? 'px-4 py-2.5 text-sm' : '',

    !floating && size === 'lg' ? 'px-6 py-3 text-base' : '',

    floating
      ? getFloatingClasses()
      : getVariantClasses()
  ]"
>
  @if (lucideIcon) {
    <app-icon [name]="lucideIcon" sizeClass="h-[18px] w-[18px]" />
  }

  <!-- Gomb felirata -->
  @if (label) {
    <span>{{ label }}</span>
  }
</button>
