<button
  type="button"
  (click)="goBack()"
  [attr.aria-label]="label"
  class="group inline-flex min-h-11 items-center justify-center
         gap-2 rounded-xl border border-primary-200
         bg-white px-4 py-2.5 text-sm font-semibold
         text-primary-700 shadow-sm
         transition-all duration-200
         hover:border-primary-300 hover:bg-primary-50
         hover:shadow-md
         active:scale-[0.98]
         focus:outline-none focus:ring-2
         focus:ring-primary-500 focus:ring-offset-2"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="h-5 w-5 shrink-0 transition-transform
           duration-200 group-hover:-translate-x-0.5"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="2"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M15 19l-7-7 7-7"
    />
  </svg>

  <span>{{ label }}</span>
</button>
