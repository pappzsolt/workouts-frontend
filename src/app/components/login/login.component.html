<div
  class="flex min-h-screen items-center justify-center bg-gradient-to-br from-surface-50 via-primary-50/40 to-primary-50/50 px-4 py-8 sm:px-6"
>
  <div class="w-full max-w-md rounded-2xl border border-surface-200 bg-white p-6 shadow-lg sm:p-8">
    <!-- Language selector -->
    <div class="mb-6 flex justify-end">
      <app-language-selector></app-language-selector>
    </div>

    <!-- Title -->
    <div class="mb-8 text-center">
      <h2 appHeading="page">
        {{ 'login.title' | translate }}
      </h2>
    </div>

    <!-- Login form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit($event)" class="flex flex-col gap-5">
      <!-- Username -->
      <app-form-field labelKey="login.username" controlId="login-username">
        <input
          appInput="admin"
          id="login-username"
          formControlName="username"
          type="text"
          [placeholder]="'login.usernamePlaceholder' | translate"
          class="placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Password -->
      <app-form-field labelKey="login.password" controlId="login-password">
        <input
          appInput="admin"
          id="login-password"
          formControlName="password"
          type="password"
          [placeholder]="'login.passwordPlaceholder' | translate"
          class="placeholder:text-content-400"
        />
      </app-form-field>

      <!-- Error -->
      <app-message
        *ngIf="errorMessage"
        [message]="errorMessage"
        type="error"
        class="block mb-4"
      ></app-message>

      <!-- Login button -->
      <app-button
        variant="primary"
        type="submit"
        [disabled]="loading"
        [label]="loading ? ('login.loading' | translate) : ('login.login' | translate)"
      ></app-button>

      <!-- Forgot password -->
      <div class="text-center">
        <a
          routerLink="/forgot-password"
          class="text-sm font-medium text-primary-600 transition-colors hover:text-primary-700 hover:underline"
        >
          {{ 'login.forgotPassword' | translate }}
        </a>
      </div>
    </form>
  </div>
</div>
