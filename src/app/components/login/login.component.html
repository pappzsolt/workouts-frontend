<div
  class="flex min-h-screen items-center justify-center bg-gradient-to-br from-surface-50 via-primary-50/40 to-primary-50/50 px-4 py-8 sm:px-6"
>
  <div
    class="w-full max-w-md rounded-2xl border border-surface-200 bg-white p-6 shadow-lg sm:p-8"
  >

    <!-- Language selector -->
    <div class="mb-6 flex justify-end">
      <app-language-selector></app-language-selector>
    </div>

    <!-- Title -->
    <div class="mb-8 text-center">
      <h2 class="text-2xl font-bold tracking-tight text-content-800 sm:text-3xl">
        {{ 'login.title' | translate }}
      </h2>
    </div>

    <!-- Login form -->
    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit($event)"
      class="flex flex-col gap-5"
    >

      <!-- Username -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-content-700">
          {{ 'login.username' | translate }}
        </label>

        <input
          formControlName="username"
          type="text"
          [placeholder]="'login.usernamePlaceholder' | translate"
          class="min-h-11 w-full rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-content-700">
          {{ 'login.password' | translate }}
        </label>

        <input
          formControlName="password"
          type="password"
          [placeholder]="'login.passwordPlaceholder' | translate"
          class="min-h-11 w-full rounded-xl border border-surface-300 bg-white px-4 py-2.5 text-base text-content-800 shadow-sm outline-none transition-all duration-200 placeholder:text-content-400 hover:border-surface-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 sm:text-sm"
        />
      </div>

      <!-- Error -->
      <div
        *ngIf="errorMessage"
        class="rounded-xl border border-delete-200 bg-delete-50 px-4 py-3 text-sm font-medium text-delete-700"
      >
        {{ errorMessage }}
      </div>

      <!-- Login button -->
      <app-button
        variant="primary"
        type="submit"
        [disabled]="loading"
        [label]="
    loading
      ? ('login.loading' | translate)
      : ('login.login' | translate)
  "
      ></app-button>

    </form>
  </div>
</div>
