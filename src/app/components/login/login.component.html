<div class="login-card">

  <h2 class="login-title">
    Login
  </h2>

  <form
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit($event)"
    class="login-form"
  >

    <div class="login-form-group">
      <label class="login-label">
        Username
      </label>

      <input
        formControlName="username"
        type="text"
        placeholder="Felhasználónév"
        class="login-input"
      />
    </div>

    <div class="login-form-group">
      <label class="login-label">
        Password
      </label>

      <input
        formControlName="password"
        type="password"
        placeholder="Jelszó"
        class="login-input"
      />
    </div>

    <div
      *ngIf="errorMessage"
      class="login-error"
    >
      {{ errorMessage }}
    </div>

    <button
      type="submit"
      [disabled]="loading"
      class="login-button"
    >
      {{ loading ? 'Betöltés...' : 'Bejelentkezés' }}
    </button>

  </form>
</div>
