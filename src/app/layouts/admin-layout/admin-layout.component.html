<!-- src/app/layouts/admin-layout/admin-layout.component.html -->
<div class="admin-layout flex flex-col min-h-screen">
  <!-- Fejléc -->
  <header class="bg-surface-900 text-white p-4 flex justify-between items-center">
    <h1 class="text-lg md:text-xl font-bold">
      {{ 'adminLayout.title' | translate }}
    </h1>

    <div class="flex items-center space-x-3">
      <div class="text-sm md:text-base">
        <span class="mr-2">👤 {{ username }}</span>
        <span class="italic">({{ role }})</span>
      </div>

      <app-button
        variant="danger"
        type="button"
        [label]="'adminLayout.logout' | translate"
        (buttonClick)="onLogout()"
      ></app-button>
    </div>
  </header>

  <!-- Tartalom -->
  <div class="flex flex-1 flex-col md:flex-row">
    <!-- Menü mobilon felül, asztalin bal oldalt -->
    <app-admin-menu
      class="bg-surface-100 p-4 md:w-64 border-b md:border-b-0 md:border-r"
    ></app-admin-menu>

    <!-- Központi tartalom -->
    <main class="flex-1 p-4 md:p-6 bg-surface-50 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Lábléc -->
  <footer class="bg-surface-900 text-content-300 text-center py-3 text-sm md:text-base">
    {{ 'adminLayout.footer' | translate }}
  </footer>
</div>
