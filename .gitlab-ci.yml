stages:
  - test
  - build
  - docker
  - deploy

variables:
  GIT_DEPTH: "1"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  FRONTEND_IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  FRONTEND_PACKAGE_NAME: "workouts-frontend"
  FRONTEND_PACKAGE_VERSION: "$CI_COMMIT_SHA"
  FRONTEND_PACKAGE_FILE: "workouts-frontend-image.tar.gz"

cache:
  key: "${CI_PROJECT_NAME}-npm"
  paths:
    - .npm/

# ------------------------------------------------------------
# Frontend validation. No environment-specific files are changed.
# ------------------------------------------------------------
frontend-test:
  stage: test
  image: node:22-alpine
  script:
    - 'echo "Checking frontend project"'
    - 'test -f package.json'
    - 'test -f angular.json'
    - 'test -f Dockerfile'
    - 'test -f docker-compose.yml'
    - 'test -f nginx.conf'
    - 'test -n "$(node --version)"'
    - 'test -n "$(npm --version)"'
    - 'echo "Frontend project validation OK"'
  environment:
    name: test

# ------------------------------------------------------------
# ONE Angular build for the whole pipeline.
# No production build is performed.
# ------------------------------------------------------------
frontend-build:
  stage: build
  image: node:22-alpine
  needs:
    - job: frontend-test
      artifacts: false
  script:
    - 'echo "Building Angular frontend exactly once"'
    - 'npm install'
    - 'npm run build'
    - 'test -d dist/workouts-frontend'
    - 'test -f dist/workouts-frontend/browser/index.html'
    - 'echo "Angular build OK"'
  artifacts:
    paths:
      - dist/workouts-frontend/
    expire_in: 1 day
  environment:
    name: test

# ------------------------------------------------------------
# ONE Docker build.
# The image contains only the Angular static files.
# TEST and PROD provide their own nginx configuration at runtime.
# ------------------------------------------------------------
frontend-docker-build:
  stage: docker
  image: docker:29-cli
  needs:
    - job: frontend-build
      artifacts: true
  services:
    - name: docker:29-dind
      command:
        - "--tls=false"
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - 'echo "Building frontend Docker image exactly once"'
    - 'test -f dist/workouts-frontend/browser/index.html'
    - 'docker version'
    - 'docker build --pull -t "$FRONTEND_IMAGE_NAME" .'
    - 'docker image inspect "$FRONTEND_IMAGE_NAME" >/dev/null'
    - 'docker save "$FRONTEND_IMAGE_NAME" | gzip -1 > "$FRONTEND_PACKAGE_FILE"'
    - 'test -s "$FRONTEND_PACKAGE_FILE"'
    - 'ls -lh "$FRONTEND_PACKAGE_FILE"'
    - 'echo "Uploading exact frontend image to GitLab Generic Package Registry"'
    - >
      curl --fail --show-error --location
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file "$FRONTEND_PACKAGE_FILE"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$FRONTEND_PACKAGE_NAME/$FRONTEND_PACKAGE_VERSION/$FRONTEND_PACKAGE_FILE"

# ------------------------------------------------------------
# TEST deploy.
# Uses TEST scoped variables and TEST nginx configuration.
# The existing TEST directory is /home/pappzs.
# ------------------------------------------------------------
frontend-deploy-test:
  stage: deploy
  image: alpine:3.22
  needs:
    - job: frontend-docker-build
      artifacts: false
  variables:
    DEPLOY_ENVIRONMENT: "test"
  environment:
    name: test
  before_script:
    - 'apk add --no-cache openssh-client curl'
    - 'mkdir -p ~/.ssh'
    - 'chmod 700 ~/.ssh'
    - 'test -f "$SSH_PRIVATE_KEY"'
    - 'sed "s/\r$//" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519'
    - 'printf "\n" >> ~/.ssh/id_ed25519'
    - 'chmod 600 ~/.ssh/id_ed25519'
    - 'test -s ~/.ssh/id_ed25519'
    - 'ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/deploy_public_key'
    - |
      cat > ~/.ssh/config <<EOF
      Host *
        StrictHostKeyChecking no
        UserKnownHostsFile /dev/null
        IdentitiesOnly yes
      EOF
    - 'chmod 600 ~/.ssh/config'
  script:
    - 'echo "TEST frontend deploy"'
    - 'echo "Server: $DEPLOY_SERVER"'
    - 'echo "User: $DEPLOY_USER"'
    - 'echo "Path: $DEPLOY_PATH"'
    - 'test "$DEPLOY_SERVER" = "192.168.1.37"'
    - 'test "$DEPLOY_USER" = "pappzs"'
    - 'test "$DEPLOY_PATH" = "/home/pappzs"'
    - 'ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER" "echo SSH connection OK"'
    - 'ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER" "mkdir -p \"$DEPLOY_PATH\""'
    - 'scp -i ~/.ssh/id_ed25519 docker-compose.yml "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/docker-compose.yml"'
    - 'scp -i ~/.ssh/id_ed25519 nginx.conf "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/nginx.conf"'
    - 'printf "%s\n" "WORKOUTS_FRONTEND_IMAGE=$FRONTEND_IMAGE_NAME" > deploy.env'
    - 'scp -i ~/.ssh/id_ed25519 deploy.env "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/.env"'
    - 'rm -f deploy.env'
    - 'echo "Downloading exact frontend image from GitLab Generic Package Registry"'
    - >
      curl --fail --show-error --location
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --output "$FRONTEND_PACKAGE_FILE"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$FRONTEND_PACKAGE_NAME/$FRONTEND_PACKAGE_VERSION/$FRONTEND_PACKAGE_FILE"
    - 'test -s "$FRONTEND_PACKAGE_FILE"'
    - 'scp -i ~/.ssh/id_ed25519 "$FRONTEND_PACKAGE_FILE" "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/$FRONTEND_PACKAGE_FILE"'
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "gunzip -c '$DEPLOY_PATH/$FRONTEND_PACKAGE_FILE' | docker load"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker image inspect '$FRONTEND_IMAGE_NAME' >/dev/null"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "rm -f '$DEPLOY_PATH/$FRONTEND_PACKAGE_FILE'"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "cd '$DEPLOY_PATH' && docker compose config >/dev/null"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "cd '$DEPLOY_PATH' && docker compose up -d --pull never"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "cd '$DEPLOY_PATH' && docker compose ps"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker ps --filter 'name=workouts-frontend'"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker logs --tail=100 workouts-frontend"

# ------------------------------------------------------------
# PROD deploy.
# Manual. Uses PROD scoped variables and the existing PROD certs.
# It does NOT copy, delete, or modify the cert directory.
# ------------------------------------------------------------
frontend-deploy-production:
  stage: deploy
  image: alpine:3.22
  needs:
    - job: frontend-docker-build
      artifacts: false
  variables:
    DEPLOY_ENVIRONMENT: "production"
  environment:
    name: production
  when: manual
  allow_failure: false
  before_script:
    - 'apk add --no-cache openssh-client curl'
    - 'mkdir -p ~/.ssh'
    - 'chmod 700 ~/.ssh'
    - 'test -f "$SSH_PRIVATE_KEY_PROD"'
    - 'sed "s/\r$//" "$SSH_PRIVATE_KEY_PROD" > ~/.ssh/id_ed25519'
    - 'printf "\n" >> ~/.ssh/id_ed25519'
    - 'chmod 600 ~/.ssh/id_ed25519'
    - 'test -s ~/.ssh/id_ed25519'
    - 'ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/deploy_public_key'
    - |
      cat > ~/.ssh/config <<EOF
      Host *
        StrictHostKeyChecking no
        UserKnownHostsFile /dev/null
        IdentitiesOnly yes
      EOF
    - 'chmod 600 ~/.ssh/config'
  script:
    - 'echo "PRODUCTION frontend deploy"'
    - 'echo "Server: $DEPLOY_SERVER"'
    - 'echo "User: $DEPLOY_USER"'
    - 'echo "Path: $DEPLOY_PATH"'
    - 'test "$DEPLOY_SERVER" = "2.29.51.66"'
    - 'test "$DEPLOY_USER" = "pappzsol"'
    - 'test "$DEPLOY_PATH" = "/home/pappzsol/workouts/deploy/frontend"'
    - 'ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER" "echo SSH connection OK"'
    - 'ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER" "test -d \"$DEPLOY_PATH/certs\""'
    - 'ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER" "test -f \"$DEPLOY_PATH/certs/workouts.hevexora.com.pem\""'
    - 'ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER" "test -f \"$DEPLOY_PATH/certs/workouts.hevexora.com.key\""'
    - 'scp -i ~/.ssh/id_ed25519 docker-compose.production.yml "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/docker-compose.yml"'
    - 'scp -i ~/.ssh/id_ed25519 nginx.runtime.conf "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/nginx.runtime.conf"'
    - 'printf "%s\n" "WORKOUTS_FRONTEND_IMAGE=$FRONTEND_IMAGE_NAME" > deploy.env'
    - 'scp -i ~/.ssh/id_ed25519 deploy.env "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/.env"'
    - 'rm -f deploy.env'
    - 'echo "Downloading exact frontend image from GitLab Generic Package Registry"'
    - >
      curl --fail --show-error --location
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --output "$FRONTEND_PACKAGE_FILE"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$FRONTEND_PACKAGE_NAME/$FRONTEND_PACKAGE_VERSION/$FRONTEND_PACKAGE_FILE"
    - 'test -s "$FRONTEND_PACKAGE_FILE"'
    - 'scp -i ~/.ssh/id_ed25519 "$FRONTEND_PACKAGE_FILE" "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/$FRONTEND_PACKAGE_FILE"'
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "gunzip -c '$DEPLOY_PATH/$FRONTEND_PACKAGE_FILE' | docker load"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker image inspect '$FRONTEND_IMAGE_NAME' >/dev/null"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "rm -f '$DEPLOY_PATH/$FRONTEND_PACKAGE_FILE'"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "test -d '$DEPLOY_PATH/certs' && test -f '$DEPLOY_PATH/certs/workouts.hevexora.com.pem' && test -f '$DEPLOY_PATH/certs/workouts.hevexora.com.key'"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "cd '$DEPLOY_PATH' && docker compose config >/dev/null"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker network inspect workouts-network >/dev/null"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "cd '$DEPLOY_PATH' && docker compose up -d --pull never"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "cd '$DEPLOY_PATH' && docker compose ps"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker ps --filter 'name=workouts-frontend-runtime'"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker logs --tail=100 workouts-frontend-runtime"
