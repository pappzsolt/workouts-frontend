stages:
  - test
  - build
  - docker
  - deploy

variables:
  GIT_DEPTH: "1"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  FRONTEND_IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  FRONTEND_PACKAGE_NAME: "workouts-frontend"
  FRONTEND_PACKAGE_VERSION: "$CI_COMMIT_SHA"
  FRONTEND_PACKAGE_FILE: "workouts-frontend-image.tar.gz"

cache:
  key: "${CI_PROJECT_NAME}-npm"
  paths:
    - .npm/

# ------------------------------------------------------------
# Frontend validation. No environment-specific files are changed.
# ------------------------------------------------------------
frontend-test:
  stage: test
  image: node:22-alpine
  script:
    - 'test -f package.json && test -f package-lock.json && test -f angular.json'
    - 'test -f Dockerfile && test -f docker-compose.yml && test -f nginx.conf'
    # karma.conf.cjs uses FirefoxHeadless.
    - 'apk add --no-cache firefox ttf-dejavu'
    - 'export FIREFOX_BIN="$(command -v firefox)"'
    - 'npm ci --no-audit --no-fund'
    - 'npx ng test --watch=false --no-progress --browsers=FirefoxHeadless'
  environment:
    name: test

# ------------------------------------------------------------
# ONE Angular build for the whole pipeline.
# No production build is performed.
# ------------------------------------------------------------
frontend-build:
  stage: build
  image: node:22-alpine
  needs:
    - job: frontend-test
      artifacts: false
  script:
    - 'echo "Building Angular frontend exactly once"'
    - 'npm ci --no-audit --no-fund'
    - 'npm run build'
    - 'test -d dist/workouts-frontend'
    - 'test -f dist/workouts-frontend/browser/index.html'
    - 'echo "Angular build OK"'
  artifacts:
    paths:
      - dist/workouts-frontend/
    expire_in: 1 day
  environment:
    name: test

# ------------------------------------------------------------
# ONE Docker build.
# The image contains the Angular static files.
#
# TEST uses /usr/share/nginx/html.
# Existing PROD nginx.runtime.conf uses /usr/share/nginx/html/browser.
#
# Both paths are intentionally present in the SAME image so the
# already-working TEST configuration is not changed and the existing
# PROD configuration remains unchanged.
# ------------------------------------------------------------
frontend-docker-build:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  stage: docker
  image: docker:29-cli
  before_script:
    - apk add --no-cache curl
  needs:
    - job: frontend-build
      artifacts: true
  services:
    - name: docker:29-dind
      command:
        - "--tls=false"
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - 'echo "Building frontend Docker image exactly once"'
    - 'test -f dist/workouts-frontend/browser/index.html'
    - 'docker version'
    - 'docker build --pull -t "$FRONTEND_IMAGE_NAME" .'
    - 'docker image inspect "$FRONTEND_IMAGE_NAME" >/dev/null'
    - 'docker run --rm "$FRONTEND_IMAGE_NAME" test -f /usr/share/nginx/html/index.html'
    - 'docker run --rm "$FRONTEND_IMAGE_NAME" test -f /usr/share/nginx/html/browser/index.html'
    - 'docker save "$FRONTEND_IMAGE_NAME" | gzip -1 > "$FRONTEND_PACKAGE_FILE"'
    - 'test -s "$FRONTEND_PACKAGE_FILE"'
    - 'ls -lh "$FRONTEND_PACKAGE_FILE"'
    - 'echo "Uploading exact frontend image to GitLab Generic Package Registry"'
    - >
      curl --fail --show-error --location
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file "$FRONTEND_PACKAGE_FILE"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$FRONTEND_PACKAGE_NAME/$FRONTEND_PACKAGE_VERSION/$FRONTEND_PACKAGE_FILE"

# ------------------------------------------------------------
# TEST deploy.
# Uses TEST scoped variables and TEST nginx configuration.
# The existing TEST directory is /home/pappzs.
# ------------------------------------------------------------
frontend-deploy-test:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  stage: deploy
  image: alpine:3.22
  needs:
    - job: frontend-docker-build
      artifacts: false
  variables:
    DEPLOY_ENVIRONMENT: "test"
  environment:
    name: test
  before_script:
    - 'apk add --no-cache openssh-client curl'
    - 'mkdir -p ~/.ssh'
    - 'chmod 700 ~/.ssh'
    - 'test -f "$SSH_PRIVATE_KEY"'
    - 'sed "s/\r$//" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519'
    - 'printf "\n" >> ~/.ssh/id_ed25519'
    - 'chmod 600 ~/.ssh/id_ed25519'
    - 'test -s ~/.ssh/id_ed25519'
    - 'ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/deploy_public_key'
    # Server host keys come from the SSH_KNOWN_HOSTS File variable (never trust on first use).
    - 'test -s "$SSH_KNOWN_HOSTS"'
    - 'cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts'
    - 'chmod 600 ~/.ssh/known_hosts'
    - |
      cat > ~/.ssh/config <<EOF
      Host *
        StrictHostKeyChecking yes
        UserKnownHostsFile ~/.ssh/known_hosts
        IdentitiesOnly yes
        BatchMode yes
      EOF
    - 'chmod 600 ~/.ssh/config'
  script:
    - 'echo "TEST frontend deploy"'
    - 'echo "Server: $DEPLOY_SERVER"'
    - 'echo "User: $DEPLOY_USER"'
    - 'echo "Path: $DEPLOY_PATH"'
    - 'test "$DEPLOY_SERVER" = "192.168.1.37"'
    - 'test "$DEPLOY_USER" = "pappzs"'
    - 'test "$DEPLOY_PATH" = "/home/pappzs"'
    - 'ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER" "echo SSH connection OK"'
    - 'ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER" "mkdir -p \"$DEPLOY_PATH\""'
    - 'scp -i ~/.ssh/id_ed25519 docker-compose.yml "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/docker-compose.yml"'
    - 'scp -i ~/.ssh/id_ed25519 nginx.conf "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/nginx.conf"'
    - 'printf "%s\n" "WORKOUTS_FRONTEND_IMAGE=$FRONTEND_IMAGE_NAME" > deploy.env'
    - 'scp -i ~/.ssh/id_ed25519 deploy.env "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/.env"'
    - 'rm -f deploy.env'
    - 'echo "Downloading exact frontend image from GitLab Generic Package Registry"'
    - >
      curl --fail --show-error --location
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --output "$FRONTEND_PACKAGE_FILE"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$FRONTEND_PACKAGE_NAME/$FRONTEND_PACKAGE_VERSION/$FRONTEND_PACKAGE_FILE"
    - 'test -s "$FRONTEND_PACKAGE_FILE"'
    - 'scp -i ~/.ssh/id_ed25519 "$FRONTEND_PACKAGE_FILE" "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/$FRONTEND_PACKAGE_FILE"'
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "gunzip -c '$DEPLOY_PATH/$FRONTEND_PACKAGE_FILE' | docker load"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker image inspect '$FRONTEND_IMAGE_NAME' >/dev/null"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker run --rm '$FRONTEND_IMAGE_NAME' test -f /usr/share/nginx/html/index.html"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker run --rm '$FRONTEND_IMAGE_NAME' test -f /usr/share/nginx/html/browser/index.html"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "rm -f '$DEPLOY_PATH/$FRONTEND_PACKAGE_FILE'"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "cd '$DEPLOY_PATH' && docker compose config >/dev/null"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "cd '$DEPLOY_PATH' && docker compose up -d --pull never"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "cd '$DEPLOY_PATH' && docker compose ps"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker ps --filter 'name=workouts-frontend'"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker exec workouts-frontend test -f /usr/share/nginx/html/index.html"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker logs --tail=100 workouts-frontend"
    - 'echo "Removing old images (keeping the 3 newest; images in use are never removed)"'
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker image ls '$CI_REGISTRY_IMAGE' --format '{{.Tag}}' | tail -n +4 | while read -r t; do if docker rmi '$CI_REGISTRY_IMAGE':\$t >/dev/null 2>&1; then echo removed \$t; else echo kept \$t; fi; done; docker image prune -f >/dev/null; echo IMAGE_CLEANUP_OK"

# ------------------------------------------------------------
# PROD deploy.
# Manual. Uses PROD scoped variables and the existing PROD certs.
# It does NOT copy, delete, or modify the cert directory.
#
# Existing PROD nginx.runtime.conf expects:
# /usr/share/nginx/html/browser
#
# Host 80/443 are owned by the CENTRAL REVERSE PROXY (reverse-proxy repo,
# container central-reverse-proxy). This container is only reachable on
# workouts-network (central proxy --HTTPS--> workouts-frontend-runtime:443).
#
# Precondition: the reverse-proxy "deploy-production" job has staged its
# files in $REVERSE_PROXY_PATH. The first run of this job IS the cutover:
# the new compose frees host 80/443, then the central proxy is started.
# The previous compose/nginx files are kept as *.bak-<commit> for rollback.
# ------------------------------------------------------------
frontend-deploy-production:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
  stage: deploy
  image: alpine:3.22
  needs:
    - job: frontend-docker-build
      artifacts: false
  variables:
    DEPLOY_ENVIRONMENT: "production"
    REVERSE_PROXY_PATH: "/home/pappzsol/reverse-proxy"
    REVERSE_PROXY_COMPOSE: "docker compose -p central-reverse-proxy-production -f docker-compose.production.yml"
  environment:
    name: production
  before_script:
    - 'apk add --no-cache openssh-client curl'
    - 'mkdir -p ~/.ssh'
    - 'chmod 700 ~/.ssh'
    - 'test -f "$SSH_PRIVATE_KEY_PROD"'
    - 'sed "s/\r$//" "$SSH_PRIVATE_KEY_PROD" > ~/.ssh/id_ed25519'
    - 'printf "\n" >> ~/.ssh/id_ed25519'
    - 'chmod 600 ~/.ssh/id_ed25519'
    - 'test -s ~/.ssh/id_ed25519'
    - 'ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/deploy_public_key'
    # Server host keys come from the SSH_KNOWN_HOSTS File variable (never trust on first use).
    - 'test -s "$SSH_KNOWN_HOSTS"'
    - 'cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts'
    - 'chmod 600 ~/.ssh/known_hosts'
    - |
      cat > ~/.ssh/config <<EOF
      Host *
        StrictHostKeyChecking yes
        UserKnownHostsFile ~/.ssh/known_hosts
        IdentitiesOnly yes
        BatchMode yes
      EOF
    - 'chmod 600 ~/.ssh/config'
  script:
    - 'echo "PRODUCTION frontend deploy"'
    - 'echo "Server: $DEPLOY_SERVER"'
    - 'echo "User: $DEPLOY_USER"'
    - 'echo "Path: $DEPLOY_PATH"'
    - 'echo "Image: $FRONTEND_IMAGE_NAME"'
    - 'test "$DEPLOY_SERVER" = "2.29.51.66"'
    - 'test "$DEPLOY_USER" = "pappzsol"'
    - 'test "$DEPLOY_PATH" = "/home/pappzsol/workouts/deploy/frontend"'
    - 'ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER" "echo SSH connection OK"'
    - 'ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER" "test -d \"$DEPLOY_PATH/certs\""'
    - 'ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER" "test -f \"$DEPLOY_PATH/certs/workouts.hevexora.com.pem\""'
    - 'ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER" "test -f \"$DEPLOY_PATH/certs/workouts.hevexora.com.key\""'
    - 'echo "Checking that the central reverse proxy is staged on the server"'
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "set -eu; test -f '$REVERSE_PROXY_PATH/docker-compose.production.yml'; test -f '$REVERSE_PROXY_PATH/nginx/nginx.production.conf'; test -f '$REVERSE_PROXY_PATH/certs/cloudflare-origin-ca.pem'; cd '$REVERSE_PROXY_PATH' && $REVERSE_PROXY_COMPOSE config -q && echo CENTRAL_PROXY_STAGED_OK"
    - 'echo "Backing up current PROD compose/nginx files for rollback"'
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "set -eu; cd '$DEPLOY_PATH'; for f in docker-compose.yml nginx.runtime.conf .env; do if [ -f \"\$f\" ]; then cp -p \"\$f\" \"\$f.bak-$CI_COMMIT_SHORT_SHA\"; fi; done; ls -1 *.bak-* | tail -n 6"
    - 'scp -i ~/.ssh/id_ed25519 docker-compose.production.yml "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/docker-compose.yml"'
    - 'scp -i ~/.ssh/id_ed25519 nginx.runtime.conf "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/nginx.runtime.conf"'
    - 'printf "%s\n" "WORKOUTS_FRONTEND_IMAGE=$FRONTEND_IMAGE_NAME" > deploy.env'
    - 'scp -i ~/.ssh/id_ed25519 deploy.env "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/.env"'
    - 'rm -f deploy.env'
    - 'echo "Downloading exact frontend image from GitLab Generic Package Registry"'
    - >
      curl --fail --show-error --location
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --output "$FRONTEND_PACKAGE_FILE"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$FRONTEND_PACKAGE_NAME/$FRONTEND_PACKAGE_VERSION/$FRONTEND_PACKAGE_FILE"
    - 'test -s "$FRONTEND_PACKAGE_FILE"'
    - 'scp -i ~/.ssh/id_ed25519 "$FRONTEND_PACKAGE_FILE" "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/$FRONTEND_PACKAGE_FILE"'
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "gunzip -c '$DEPLOY_PATH/$FRONTEND_PACKAGE_FILE' | docker load"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker image inspect '$FRONTEND_IMAGE_NAME' >/dev/null"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker run --rm '$FRONTEND_IMAGE_NAME' test -f /usr/share/nginx/html/index.html"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker run --rm '$FRONTEND_IMAGE_NAME' test -f /usr/share/nginx/html/browser/index.html"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "rm -f '$DEPLOY_PATH/$FRONTEND_PACKAGE_FILE'"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "test -d '$DEPLOY_PATH/certs' && test -f '$DEPLOY_PATH/certs/workouts.hevexora.com.pem' && test -f '$DEPLOY_PATH/certs/workouts.hevexora.com.key'"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "cd '$DEPLOY_PATH' && docker compose config >/dev/null"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker network inspect workouts-network >/dev/null"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "cd '$DEPLOY_PATH' && docker compose up -d --pull never"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "i=0; while [ \$i -lt 20 ]; do s=\$(docker inspect -f '{{.State.Health.Status}}' workouts-frontend-runtime); [ \"\$s\" = healthy ] && { echo WORKOUTS_FRONTEND_RUNTIME_HEALTHY; exit 0; }; [ \"\$s\" = unhealthy ] && break; i=\$((i+1)); sleep 3; done; docker logs --tail=80 workouts-frontend-runtime; echo 'workouts-frontend-runtime did not become healthy' >&2; exit 1"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "cd '$DEPLOY_PATH' && docker compose ps"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker ps --filter 'name=workouts-frontend-runtime'"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker exec workouts-frontend-runtime test -f /usr/share/nginx/html/browser/index.html"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker exec workouts-frontend-runtime nginx -t"
    - 'echo "Ensuring the central reverse proxy owns host 80/443"'
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "set -eu; cd '$REVERSE_PROXY_PATH' && $REVERSE_PROXY_COMPOSE up -d && docker exec central-reverse-proxy nginx -t && $REVERSE_PROXY_COMPOSE ps"
    - 'echo "Smoke tests through the central reverse proxy"'
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "set -eu; CA='$REVERSE_PROXY_PATH/certs/cloudflare-origin-ca.pem';
      W='--resolve workouts.hevexora.com:443:127.0.0.1 --cacert '\$CA;
      P='--resolve pigapp.hevexora.com:443:127.0.0.1 --cacert '\$CA;
      i=0; code=000; while [ \$i -lt 10 ]; do code=\$(curl -s -o /dev/null -w '%{http_code}' \$W https://workouts.hevexora.com/login || true); [ \"\$code\" = 200 ] && break; i=\$((i+1)); sleep 3; done;
      [ \"\$code\" = 200 ] || { echo \"FAIL workouts /login via proxy: \$code\"; exit 1; }; echo WORKOUTS_HTTPS_OK;
      curl -sSI \$W https://workouts.hevexora.com/ > /tmp/workouts-headers.txt || { echo 'FAIL workouts headers'; exit 1; };
      grep -qi '^strict-transport-security:' /tmp/workouts-headers.txt || { echo 'FAIL workouts HSTS missing'; exit 1; };
      grep -qi '^content-security-policy:' /tmp/workouts-headers.txt || { echo 'FAIL workouts CSP missing'; exit 1; }; echo WORKOUTS_HEADERS_OK;
      code=\$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: workouts.hevexora.com' http://127.0.0.1/ || true);
      [ \"\$code\" = 301 ] || { echo \"FAIL workouts HTTP redirect: \$code\"; exit 1; }; echo WORKOUTS_HTTP_REDIRECT_OK;
      code=\$(curl -s -o /dev/null -w '%{http_code}' \$P https://pigapp.hevexora.com/ || true);
      [ \"\$code\" = 200 ] || { echo \"FAIL pigapp via proxy: \$code\"; exit 1; }; echo PIGAPP_HTTPS_OK"
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker logs --tail=100 workouts-frontend-runtime"
    - 'echo "Removing old images (keeping the 3 newest; images in use are never removed)"'
    - >
      ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_SERVER"
      "docker image ls '$CI_REGISTRY_IMAGE' --format '{{.Tag}}' | tail -n +4 | while read -r t; do if docker rmi '$CI_REGISTRY_IMAGE':\$t >/dev/null 2>&1; then echo removed \$t; else echo kept \$t; fi; done; docker image prune -f >/dev/null; echo IMAGE_CLEANUP_OK"
