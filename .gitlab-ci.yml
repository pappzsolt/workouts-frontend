before_script:
  - 'apk add --no-cache openssh-client netcat-openbsd'
  - 'mkdir -p ~/.ssh'
  - 'chmod 700 ~/.ssh'

  # ========================================================
  # SSH PRIVATE KEY
  # ========================================================

  - 'test -f "$SSH_PRIVATE_KEY"'
  - 'sed "s/\r$//" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519'
  - 'printf "\n" >> ~/.ssh/id_ed25519'
  - 'chmod 600 ~/.ssh/id_ed25519'

  # ========================================================
  # SSH KEY VALIDATION
  # ========================================================

  - 'echo "Validating SSH private key..."'
  - 'test -s ~/.ssh/id_ed25519'
  - 'ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/deploy_public_key'
  - 'echo "SSH private key validation OK"'

  # ========================================================
  # SSH CONNECTIVITY
  # ========================================================

  - 'echo "Checking SSH connectivity to $DEPLOY_SERVER"'
  - 'nc -zv "$DEPLOY_SERVER" 22'

  # ========================================================
  # KNOWN HOST
  # ========================================================

  - 'ssh-keyscan -v -T 10 -H "$DEPLOY_SERVER" >> ~/.ssh/known_hosts'
  - 'chmod 644 ~/.ssh/known_hosts'
  - 'echo "Known host added successfully"'
