
server {
    listen 80;
    server_name workouts.hevexora.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name workouts.hevexora.com;

    # Valós kliens IP: a nyilvános 80/443-at a központi reverse proxy
    # (central-reverse-proxy, fix IP: 172.21.0.250) birtokolja. Csak a Cloudflare
    # felől érkező kéréseknél állítja be a CF-Connecting-IP fejlécet, és mindig
    # felülírja a kliens által küldött értéket, ezért csak neki hiszünk.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    set_real_ip_from 172.21.0.250;

    ssl_certificate /etc/nginx/certs/workouts.hevexora.com.pem;
    ssl_certificate_key /etc/nginx/certs/workouts.hevexora.com.key;

    server_tokens off;

    # ==========================================================
    # SECURITY HEADERS
    # ==========================================================
    # 'always': hibaválaszokra (4xx/5xx) is rákerülnek.
    # FONTOS: egy location blokkban megadott add_header felülírja
    # (nem örökli) a server szintű add_header sorokat, ezért ahol egy
    # location saját add_header-t használ, ott ezeket is meg kell ismételni.
    #
    # CSP: a scriptek csak saját originről jöhetnek (Angular AOT build,
    # nincs inline script, az angular.json-ban az inlineCritical ki van
    # kapcsolva). Stílusnál az 'unsafe-inline' az Angular komponens-
    # stílusok miatt kell. A fontok az alkalmazás saját /assets/fonts/ könyvtárából töltődnek.
    # A gyakorlatképek külső HTTPS-forrásból is jöhetnek, ezért img-src https:.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    root /usr/share/nginx/html/browser;
    index index.html;

    # Hibabejelentés: legfeljebb 3 x 5 MB képernyőkép (a backend is ennyit enged).
    # Csak ezen az egy végponton nagyobb a kéréskorlát; minden más /api kérés marad 1 MB.
    location = /api/bug-reports {
        client_max_body_size 16m;

        proxy_pass http://workouts-api:8080/api/bug-reports;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://workouts-api:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # SWAGGER UI - BACKEND
    # ==========================================================

    location ^~ /swagger-ui/ {
        proxy_pass http://workouts-api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # CUSTOM TWO-LEVEL SWAGGER - BACKEND
    # ==========================================================

    location ^~ /swagger-two-level/ {
        proxy_pass http://workouts-api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # OPENAPI DOCUMENTATION - BACKEND
    # ==========================================================

    location /v3/api-docs {
        proxy_pass http://workouts-api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # SWAGGER LEGACY URL
    # ==========================================================

    location = /swagger-ui.html {
        proxy_pass http://workouts-api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # ANGULAR FRONTEND - VALTOZATLAN
    # ==========================================================

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Az index.html-t a böngésző mindig ellenőrizze (új verzió után azonnal az új fájlt kapja).
    # Az 'expires' nem add_header, így a server szintű biztonsági fejlécek megmaradnak.
    location = /index.html {
        expires -1;
    }

    # Statikus fájlok: hiányzó fájlra 404, nem index.html (különben JS helyett HTML jön,
    # „disallowed MIME type (text/html)”).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
    }
}
